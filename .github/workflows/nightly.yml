# Long-running gates outside the PR path: fuzzing, load, chaos, restore - and the support matrix.
#
# The `matrix-*` jobs are the evidence behind docs/architecture/support-matrix.md. Their names are
# load-bearing: the documentation gate reconciles them with the table in both directions, so
# renaming one without the row turns the build red, and so does deleting one.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    name: Fuzzing, load, resilience
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: make tools
      - run: make gate-fuzz
      # Re-run on the nightly hardware as well: RT-2 and RT-3 are timing-sensitive, and a
      # second run under different load is how a flake announces itself before it fails a
      # pull request.
      - run: make gate-resilience
      # RT-6 and the storm bring up their own installation - a container, the real binary and a
      # seeded dataset - so they need no service beside them. The hardware is named because the
      # regression guard compares only against a baseline recorded on the same kind of machine:
      # comparing across iron measures the iron (H-11, decision 7).
      #
      # The dataset is the scaled one. Two million rows is the per-release capacity ramp's figure,
      # seeded by scripts/seed-load-dataset.sh against a real stack on named hardware; carrying
      # them into a container on a shared runner would spend the whole nightly on the COPY.
      - run: make gate-load
        env:
          HUBTASK_LOAD_HARDWARE: github-ubuntu-latest
          HUBTASK_LOAD_TENANTS: "20"
          HUBTASK_LOAD_ITEMS: "40000"
          HUBTASK_LOAD_EVIDENCE_DIR: ${{ github.workspace }}/load-evidence
      # Uploaded whether or not the gate passed: the numbers are the finding either way, and a
      # red load test is read from its timeline rather than from the assertion that failed.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-evidence
          path: load-evidence/
          if-no-files-found: ignore

  matrix-arm64:
    name: Support matrix - the full suite on arm64
    # Natively, not cross-compiled. The release image is multi-arch and until now nothing had ever
    # *run* the tests on ARM - a claim of support that no job stood behind.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: make tools
      - run: make verify
      - run: make gate-integration
      # PG-2 and PG-7: the deletion test across every storage location, and the schema reconciled
      # against the data catalogue. ADR-0018 calls the first "the expensive one with the highest
      # protective value" and puts it here rather than on every pull request (E-11).
      - run: make gate-privacy-full
      # And the proof that those two bite. `gate-selftest` skips its container-backed probes where
      # there is no PostgreSQL - which is every pull request - so the machine that has one is the
      # machine that has to run the whole script (E-11).
      - run: make gate-selftest
      - run: make gate-compose

  matrix-postgres:
    name: Support matrix - PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 16 is the supported floor and runs on every pull request; this job is what lets the
        # table claim anything beyond it.
        postgres: ["17-alpine"]
    env:
      HUBTASK_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: make tools
      # The integration suite starts its own container, so the image variable is all it takes.
      - run: make gate-integration
      - run: make gate-resilience

  matrix-podman:
    name: Support matrix - the stack under Podman
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - name: Podman with its Compose implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          podman --version
      # The same Compose file, the same script, a different engine. deployment.md promises
      # "Docker/Podman"; this is what turns that from a sentence into a claim with evidence.
      - name: The reference stack under Podman
        env:
          DOCKER: podman
          HUBTASK_COMPOSE: podman-compose
        run: make gate-compose

  matrix-hubctl:
    name: Support matrix - hubctl on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        # The Makefile sets SHELL := /bin/bash and the gates are POSIX shell. On Windows that is
        # Git Bash, which the image carries; naming it here rather than per step keeps the job the
        # same job on all three operating systems.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
          - platform: macOS arm64
            runner: macos-14
          - platform: Windows amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - name: GNU make, which the Windows image does not carry
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      # The CLI is the one artefact that runs natively on somebody's machine rather than in a
      # container, so its matrix is about operating systems in a way the server's is not
      # (support-matrix.md §4). Cross-compilation proves a binary links; only a native runner
      # proves it starts.
      - run: make gate-cli

  matrix-kind:
    name: Support matrix - the chart on a real API server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: make tools
      # `helm template` renders; only an API server *validates*. Admission is where a field that
      # does not exist, or a value of the wrong type, is finally noticed.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: hubtask
      - run: make gate-kind

  vulnerabilities:
    name: Vulnerabilities in the published build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
      - run: make tools && .tools/govulncheck ./...
      - name: The image name in lower case
        # A Docker reference must be lower case; github.repository keeps the owner's spelling.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Is there a published build to scan?
        id: published
        # The floating tags are two audiences (versioning-release.md §5): `latest` is the stable
        # release, `:rc` is the candidate somebody asks for on purpose. The scan wants whichever
        # published image is newest, and a repository that has only ever cut a pre-release has an
        # image under `:rc` and nothing under `:latest` - which is the state this repository was
        # in when the scan quietly skipped its first night after the first published build.
        #
        # Skipping when neither exists stays right, and stays announced: failing the nightly on
        # "no release yet" would be a red run nobody can act on, repeated every night, which is
        # how a nightly stops being read. `govulncheck` above scans the source either way.
        env:
          # `docker manifest` is still gated behind the experimental flag on some CLI builds.
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          for tag in latest rc; do
            if docker manifest inspect "ghcr.io/$IMAGE_NAME:$tag" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "reference=ghcr.io/$IMAGE_NAME:$tag" >> "$GITHUB_OUTPUT"
              echo "::notice::Scanning ghcr.io/$IMAGE_NAME:$tag."
              exit 0
            fi
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Neither ghcr.io/$IMAGE_NAME:latest nor :rc exists yet - the image scan is skipped until the first release."
      - name: Image scan
        if: steps.published.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.published.outputs.reference }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: steps.published.outputs.exists == 'true'
        with:
          sarif_file: trivy.sarif

  action-pins:
    name: The action pins still resolve
    # A pin is checked by the job that uses it, and only then: `trivy-action` pointed at a commit
    # that does not exist for months, because the one job that would have noticed died before it
    # got that far, and Dependabot cannot bump a ref it is unable to resolve (#64). This asks
    # GitHub directly, every night, for every pin - so the answer no longer depends on which job
    # happens to run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make gate-action-pins
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    name: File what broke
    # A nightly failure that only exists as a red run in a tab nobody opens is a failure nobody
    # fixes. This turns it into an issue - one per failing job, deduplicated across nights, with
    # the label that lets the CI assistant open a pull request against it.
    needs: [deep, matrix-arm64, matrix-postgres, matrix-podman, matrix-kind, vulnerabilities, action-pins]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => name);

            for (const job of failed) {
              const title = `Nightly: ${job} is failing`;
              // One issue per job, reopened rather than duplicated: a platform that breaks for a
              // week should be one thread, not seven.
              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
              });
              const body = [
                `The nightly job \`${job}\` failed.`,
                ``,
                `* Run: ${run}`,
                `* Commit: ${context.sha}`,
                ``,
                `If this is a \`matrix-*\` job, a row in \`docs/architecture/support-matrix.md\``,
                `is currently claiming support that nothing proves. Either the defect gets fixed or`,
                `the row changes - silently leaving it is the one outcome the matrix exists to`,
                `prevent.`,
              ].join('\n');

              if (existing.data.total_count > 0) {
                const issue = existing.data.items[0];
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number, body,
                });
                if (issue.state === 'closed') {
                  await github.rest.issues.update({
                    ...context.repo, issue_number: issue.number, state: 'open',
                  });
                }
              } else {
                await github.rest.issues.create({
                  ...context.repo, title, body, labels: ['task', 'claude:task'],
                });
              }
            }
