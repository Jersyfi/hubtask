# Architecture review by Claude on every pull request.
#
# Deliberately NOT a substitute for the deterministic gates: tests, linters, govulncheck and the
# cross-tenant suite decide green or red. Claude checks what a linter cannot
# see - agreement with the ADRs and the subject documents. The result is a
# comment, not a blocking status.
name: Claude architecture review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Request the review
        # AI comments, gates decide (ci-cd.md §5): a failure here must never turn the pipeline
        # red. Open point: claude-code-action fetches an OIDC token and therefore needs
        # `id-token: write`, which ci-cd.md §4 reserves for the release job. Until that is
        # decided the step runs, fails without consequence, and produces no review.
        continue-on-error: true
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1.0.196
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Read,Glob,Grep,Bash(git diff *),Bash(git log *)"
          direct_prompt: |
            Check this pull request against the project's architecture rules.
            Read CLAUDE.md first, then the subject documents under docs/architecture/
            touched by the diff, and the ADRs they link to.

            Check exclusively these points and report only genuine findings:

            1. Layer boundaries: does core/domain or core/port import anything outwards
               or any third-party library?
            2. Authorisation: does it happen in the application layer - not in an adapter,
               not in a repository?
            3. Tenant boundary: does every query go through the transaction wrapper?
               Is a new repository method missing its cross-tenant negative test?
            4. Determinism: time.Now, math/rand, or UUID generation in domain/application?
            5. Concurrency: a bare `go` statement outside core/shared/concurrency?
            6. Outbound calls: bypassing GuardedClient? A call without a timeout?
            7. Data protection and audit: user content in logs, metrics, traces, or audit
               entries? A new personal data field with no entry in the data catalogue?
            8. Contract: a hand-written change to generated code? An API change without
               openapi.yaml being adjusted first?
            9. Offline sync: a new field on WorkItem with no merge rule defined?
            10. i18n: display text in the backend instead of a message code?

            Format: a short list. Per finding, the file, the line, the rule or ADR number
            affected, and a concrete correction. No style or taste questions, no summary
            of the diff, no praise. If there is nothing to report, answer with exactly one
            line: "No architecture findings."
            Answer in English.
