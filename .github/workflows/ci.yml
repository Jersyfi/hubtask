name: CI

on:
  # A draft runs nothing - not even `ci-required` - and the pipeline runs once the pull request is
  # ready, so `ready_for_review` is a trigger and every job below that needs no other job carries
  # the draft condition (ADR-0079, ADR-0089). A draft's run starts no runner; the session checks its
  # own change with `make check`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# The principle from ADR-0022: minimal permissions, widened only where necessary.
permissions:
  contents: read

# On a pull request a newer push makes the older run worthless, so it is cancelled. On `main` every
# commit gets its own complete run: pull requests merge without catching up (ADR-0083), and a run
# cancelled by the next merge would leave unknown which commit turned `main` red. A group shared by
# all of `main` would not do even without cancelling - it cancels a pending run when a third arrives.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.3"

jobs:
  # Which parts of the tree a pull request touches, and therefore which jobs have anything to say
  # about it. One repository now holds the Go core, two clients and the design system (ADR-0027),
  # and running twelve security gates because somebody fixed a typo in a stylesheet teaches
  # everybody to stop reading the pipeline.
  #
  # The filtering happens in `if:` conditions on the jobs below, never in a workflow-level
  # `paths:` trigger. That distinction is the whole design: a workflow that does not trigger
  # produces no check at all, and a required check that never reports is not "skipped", it is
  # *pending* - forever, and the pull request can never merge. A job that is skipped by an `if:`
  # does report, and `ci-required` at the bottom treats skipped as passing.
  #
  # On anything that is not a pull request - a push to main, a tag - every output is `true` and
  # the whole pipeline runs. There is no filtering on the branch that gets released.
  changes:
    name: What changed
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      openapi: ${{ github.event_name != 'pull_request' || steps.filter.outputs.openapi == 'true' }}
      db: ${{ github.event_name != 'pull_request' || steps.filter.outputs.db == 'true' }}
      deploy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deploy == 'true' }}
      webapp: ${{ github.event_name != 'pull_request' || steps.filter.outputs.webapp == 'true' }}
      website: ${{ github.event_name != 'pull_request' || steps.filter.outputs.website == 'true' }}
      design_system: ${{ github.event_name != 'pull_request' || steps.filter.outputs.design_system == 'true' }}
      api_client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api_client == 'true' }}
      sync_engine: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sync_engine == 'true' }}
      n8n_node: ${{ github.event_name != 'pull_request' || steps.filter.outputs.n8n_node == 'true' }}
      zapier_app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.zapier_app == 'true' }}
      sdk_typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sdk_typescript == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
      # `docs` is deliberately not an output any more: the documentation job runs unconditionally
      # (see it below), and an output nothing reads is a filter nobody maintains. The `docs:`
      # entry in the filter list stays, because the coverage check in test/architecture reads the
      # filters to decide whether every tracked path is claimed by one - and `**/*.md` is how
      # most of them are.
      ci: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
      gates: ${{ github.event_name != 'pull_request' || steps.filter.outputs.gates == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # The root manifests belong to every JavaScript package: a lockfile change can alter
            # what any of them builds against. Declared once and referenced, so that adding a
            # package cannot forget them.
            workspace: &workspace-manifests
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              # The workspace dependency lint (ADR-0033): a change to the checker re-proves
              # every package against the map, exactly like a manifest change.
              - 'build/**'
            # Trees, not patterns. A pattern like `**/*.go` and a list of manifests leaves out every
            # non-Go file a Go test reads: the thirty golden archives under test/backup, the
            # adapters' testdata, the load guard's baseline, the embedded web placeholder, the Go
            # SDK's templates. A pull request that changed one of them alone would run no Go job at
            # all and report green, because `ci-required` counts a skip as a pass - the golden file
            # being the sharpest case, since the test that exists to notice a changed archive format
            # is exactly the test that would not run.
            #
            # A tree covers a file by where it is, so a fixture added beside its test is covered
            # by being there. `**/*.go` stays as well, for a Go file somewhere none of these
            # names reach - it costs nothing and rule 14 already forbids the place it would be.
            go:
              - '**/*.go'
              - 'core/**'
              - 'infrastructure/**'
              - 'presentation/**'
              - 'cmd/**'
              - 'test/**'
              - 'tools/**'
              - 'scripts/**'
              - 'sdk/go/**'
              - 'sdk/python/**'
              - 'third-party/**'
              - 'locales/**'
              # infrastructure/i18n holds every locale to a face in this list.
              - 'packages/design-system/fonts/faces.json'
              - 'k8s/**'
              - 'go.mod'
              - 'go.sum'
              # The hook a session runs before a pull request leaves draft (ADR-0079): test/architecture
              # reads it and runs its script, so a change to it runs that test.
              - '.claude/settings.json'
              - '.golangci.yml'
              - 'Makefile'
              - 'LICENSE'
              - 'NOTICE'
            openapi:
              - 'api/**'
            db:
              - 'db/**'
              # The data catalogue is the schema's other half: PG-7 reconciles the two, so a change
              # to either one runs it.
              - 'docs/privacy/data-catalog.md'
            deploy:
              - 'deploy/**'
              - '.dockerignore'
            webapp:
              - 'apps/webapp/**'
              # The message catalogue is an input rather than documentation: the client renders
              # every code in it, and its test parses every message to prove the renderer can
              # (i18n-l10n.md §3). A construct nobody implemented has to turn this job red on the
              # day it is written, not on the day somebody reads Polish.
              - 'locales/en.json'
              - *workspace-manifests
            website:
              - 'apps/website/**'
              # The Makefile too, and only here among the packages: `make website` is what the
              # Website workflow publishes with, and this job is the only thing that runs it
              # before `main`. That target is a line of the Makefile, which otherwise reaches only
              # the `go` filter - so the one edit most able to break publishing again is the one
              # that would otherwise skip the job proving it.
              - 'Makefile'
              - *workspace-manifests
            design_system:
              - 'packages/design-system/**'
              # The specification is an input to the package's own tests, not documentation about
              # them: check-stories.js reads design-system.md §4 and refuses a component that
              # appears in no wave (ADR-0037). A §4 that stops parsing, or a component removed
              # from it, breaks `pnpm test` - so a change here has to run the package, exactly
              # like a change to its source.
              - 'docs/design/design-system.md'
              - *workspace-manifests
            api_client:
              - 'packages/api-client/**'
              - *workspace-manifests
            # The installed apps' shell renders the web app (ADR-0033), so what changes the web app
            # changes what the shell bundles: the app, what it is built from, and the shell itself.
            # A change elsewhere leaves the `shell` lane skipped, which is what keeps it cheap.
            shell:
              - 'apps/webapp/**'
              - 'packages/design-system/**'
              - 'packages/sync-engine/**'
              - 'packages/api-client/**'
              - 'locales/en.json'
              - *workspace-manifests
            n8n_node:
              - 'packages/n8n-nodes-hubtask/**'
            zapier_app:
              - 'packages/zapier-app/**'
            # The TypeScript SDK: a workspace member under sdk/ rather than packages/, because it
            # is Apache-2.0 and an island on the map (project-structure.md §2.1). Its client is
            # regenerated by `make generate`, so a contract change reaches it through `openapi`.
            sdk_typescript:
              - 'sdk/typescript/**'
              - *workspace-manifests
            sync_engine:
              - 'packages/sync-engine/**'
              # The contract is an input rather than documentation: the engine's store schema is
              # typed from the generated client, so a removed field is a type error here
              # (ADR-0033 §2).
              - 'packages/api-client/**'
              - 'api/openapi.yaml'
              - *workspace-manifests
            docs:
              - '**/*.md'
              - 'docs/**'
            ci:
              - '.github/**'
              - '.gitleaks.toml'
            # What the gates are made of: the linters' configuration, the gate scripts and tools,
            # the tests that hold the architecture and the privacy gates. `selftest` proves these
            # still bite, so it has something to say only when one of them changes (ADR-0089);
            # `main` runs it on every commit regardless.
            gates:
              - '.golangci.yml'
              - 'Makefile'
              - 'go.mod'
              - 'scripts/**'
              - 'tools/**'
              - 'test/architecture/**'
              - 'test/privacy/**'

  # Whether the repository setting "Allow select actions" lets every action of every workflow run
  # (ci-cd.md §4). GitHub resolves the action of every step at job set-up - a step that never runs
  # included, and the actions a composite action runs inside itself - and refuses one the setting
  # does not allow before any step starts. So this job names every `uses:` of every workflow, each
  # as a step that never runs: an action the setting lacks turns this pull request red, rather than
  # the release or the nightly that would have been the first to use it. A Dependabot bump that
  # brings a new nested action is the case nothing else sees.
  #
  # No `make` target: the check is GitHub's set-up, which nothing local can ask (tools/cilocal
  # lists it as CI only). test/architecture holds the steps equal to the other workflows' `uses:`,
  # pins included; Dependabot updates them together with the rest.
  actions-allowed:
    name: Allowed actions
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "every action the workflows use was allowed at job set-up"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ false }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ false }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ false }}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ false }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ false }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ false }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ false }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ false }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ false }}
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: ${{ false }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ false }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ false }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ false }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ false }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ false }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ false }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ false }}
      - uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ false }}
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ false }}
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ false }}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: ${{ false }}
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: ${{ false }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ false }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ false }}

  # ---------------------------------------------------------------------------
  # Always, whatever changed. A secret and a bad dependency get in through any
  # path - a stylesheet, a README, a lockfile - so nothing here is behind a filter.
  # ---------------------------------------------------------------------------

  secrets:
    name: Secret scanning
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0           # SG-7 scans the history, so the history has to be here
      # SG-7. Its own job rather than a step of the security gates, because those are behind a
      # filter and this must never be: the commit that adds a key is as likely to be a
      # documentation change as a Go change.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action compares a pull request against its base, so it has nothing to say on a push.
    # Skipped, never failed - `ci-required` counts a skip as a pass.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The same licence rule the Go side enforces (ADR-0080): a copyleft dependency would
          # change the terms on which an Apache-2.0 build may be passed on. It applies to the
          # JavaScript half too, which `go-licenses` cannot see.
          deny-licenses: GPL-1.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, AGPL-1.0-or-later, AGPL-3.0-or-later, LGPL-2.0-or-later, LGPL-2.1-or-later, LGPL-3.0-or-later, SSPL-1.0
          # Exactly these versions, not the crate: r-efi offers "MIT OR Apache-2.0 OR
          # LGPL-2.1-or-later" and is taken under MIT, which the action cannot tell from the
          # expression. apps/webapp/src-tauri/deny.toml records the same choice for cargo-deny.
          allow-dependencies-licenses: pkg:cargo/r-efi@5.3.0, pkg:cargo/r-efi@6.0.0
          fail-on-severity: high

  licences:
    name: Licences
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Only go-licenses, not the whole tool set. This job runs on every pull request including
      # a documentation-only one, and `make tools` took three minutes to prepare a check that
      # takes twenty seconds.
      - run: make tools-licenses
      - run: make gate-licenses

  # ---------------------------------------------------------------------------
  # The Go pipeline. Every job here hangs from `quick`, so gating `quick` gates
  # all of them - a skipped `needs` skips its dependents.
  # ---------------------------------------------------------------------------

  quick:
    name: Format, lint, generation
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062). `make tools` installs ten
      # tools, nine of them from source, which costs minutes in every job that needs them.
      # setup-go's own cache cannot pay for it: it saves only when the key is not yet present, so
      # the first job to finish wins it, and the first job to finish is the one that compiles
      # nothing.
      #
      # The key holds the Makefile, which is where every pin lives, and the Go that compiles them.
      # The restore key is the same without the Makefile's hash, so a moved pin starts from the
      # last set rather than from nothing - what makes that safe is that `tools-ensure` decides
      # from the stamp, not from the cache: anything that is not exactly the pinned set, built by
      # this Go, is installed again in full.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      - run: make tools-ensure
      - run: make gate-quick
      # The generated Python SDK, parsed. `make generate` writes it and the step above fails on a
      # drift, so what the contract produces is checked; this step checks that it is valid
      # Python. Python is on the runner image and is already what the Compose gate
      # reads JSON with.
      - run: make gate-sdk

  build:
    name: Build (${{ matrix.goarch }})
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make build

  unit:
    name: Unit and domain tests
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make gate-unit

  architecture:
    name: Architecture rules
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      # actionlint is one of the pinned tools now, because this gate also reads the workflows.
      - run: make tools-ensure
      # Checks: layer boundaries, the bare-goroutine ban, mandatory authorisation, use case
      # parity across REST/MCP/automation, observability and audit completeness, and that every
      # workflow expression parses.
      - run: make gate-architecture

  resilience:
    name: Resilience RT-1..RT-12
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      # goose, because the RT tests that need a database migrate their own container the way
      # production does - a schema loaded any other way would be a schema nobody deploys.
      - run: make tools-ensure
      # The RT series is a PR gate wherever it can be (observability-reliability.md §12), and
      # that is a measured decision rather than a habit: this job takes about four and
      # a half minutes beside jobs that take six and eight, so it costs no wall clock, and a
      # defect it finds reaches the run that reviews the diff that caused it (ci-cd.md §3.2). The
      # three that need hours of load - RT-6, RT-8, RT-11 - live in the load suite and stay
      # nightly, because a shared runner has no hour to give them.
      - run: make gate-resilience

  observability:
    name: Alert rules and runbooks
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # promtool only - the rest of the toolchain is not needed here, and this job exists to be
      # fast enough that nobody minds it running on documentation changes.
      - run: make tools-promtool
      - run: make gate-observability

  chart:
    name: Helm chart
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      # helm comes through the module proxy like every other tool, so the gate is the same
      # command here and on a laptop (ADR-0022, ci-cd.md).
      - run: make tools-ensure
      - run: make gate-chart

  # The contract against the last release (versioning-release.md §6): a breaking change since the
  # tag fails unless it is marked. The whole history, because the tag and the commits that may mark
  # a break are behind HEAD. Only the breaks this pull request adds are judged - on a push to main,
  # those of the pushed commit - and the title and description are read from the API, so a title
  # given its `!` afterwards counts when the failed job is re-run.
  api-compat:
    name: API compatibility with the last release
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      - run: make tools-ensure
      - name: The title and the description, as they stand now
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.title + "\n" + (.body // "")' > "${RUNNER_TEMP}/pull-request.txt"
      # API_BASE and API_TEXT travel in the environment, where make reads them as variables.
      - run: make gate-api-compat
        env:
          API_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          API_TEXT: ${{ github.event_name == 'pull_request' && format('{0}/pull-request.txt', runner.temp) || '' }}

  # This is also the container build. The image contains both halves now (ADR-0028), so a change
  # to the webapp or to what it is built from has to run it even when no Go file moved.
  compose:
    name: Self-hosting stack (Compose)
    needs: [changes, quick]
    if: |
      !cancelled() && needs.quick.result != 'failure' &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.db == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.webapp == 'true' || needs.changes.outputs.design_system == 'true' || needs.changes.outputs.api_client == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The Compose file is what a self-hoster runs, and the only deployment path nobody else
      # exercises. It builds the image from this commit rather than pulling a published one, so a
      # pull request that breaks the start of the stack is red before the release is.
      - run: make gate-compose

  e2e:
    name: The hubctl session (Compose)
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The other half of the Compose job. That one asks whether the stack starts; this one runs
      # a person's first hour through hubctl against it - sign in, build a hierarchy, complete,
      # delete, restore - which is the only check that the specification and the server agree
      # about the paths and fields a client actually uses.
      - run: make gate-e2e

  engine-session:
    name: The engine's session (Compose)
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: make tools-node
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # The client's half of the hubctl session's conformance section: the first-party sync
      # engine driven through its own API against the stack, each of offline-sync.md §9's eight
      # requirements answered by its number. Beside the hubctl session rather than inside
      # it - that session spends the rate limiter's burst in its own last sections, and a second
      # client on the same budget would make both flaky.
      - run: make gate-engine-conformance

  # Beside `quick` rather than after it: at about eight minutes it is the longest Go job, and behind
  # `quick` it set the whole pipeline's wall clock (ADR-0083). It needs nothing `quick` produces - it
  # lints its own deliberate violations. It proves the gates, not the product, so a pull request runs
  # it only when a gate changes (the `gates` filter, ADR-0089); every commit on `main` runs it.
  selftest:
    name: The gates catch their own violations
    needs: changes
    if: needs.changes.outputs.gates == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      - run: make tools-ensure
      # Writes a deliberate violation per configured rule and expects a red result. Without
      # this, a rule broken by a config change would simply stop reporting anything.
      - run: make gate-selftest

  integration:
    name: Integration (PostgreSQL)
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Object storage is deliberately not a service container: the storage and backup tests start
    # their own target through Testcontainers (engineering-guidelines.md §1), which also covers
    # the targets a service container cannot provide (SFTP, WebDAV, SMB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      - run: make tools-ensure
      - run: make migrate
      - run: make gate-integration
      - run: make gate-contract

  security:
    name: Security gates SG-1..SG-12
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No service container, deliberately: the suites here reach a database through test/dbtest,
    # which starts its own through Testcontainers, and `make verify` runs these same gates on a
    # laptop with no database at all. Only `integration` genuinely needs one, because `make
    # migrate` reads that DSN. A declared dependency nobody uses would read as a statement about
    # what these suites talk to, and it would not be true.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      - run: make tools-ensure
      # SG-7 is not here any more: secret scanning runs unconditionally in the `secrets` job,
      # because a key can be committed by a change that touches no Go file at all.
      - run: make gate-security
      # The privacy gates are not here: the `data` job runs on the same filters and its
      # `gate-privacy-full` runs every test of ./test/privacy, the ones without a database included.

  data:
    name: Data gates (migration, retention, backup, sync, privacy)
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No service container, deliberately: the suites here reach a database through test/dbtest,
    # which starts its own through Testcontainers, and `make verify` runs these same gates on a
    # laptop with no database at all. Only `integration` genuinely needs one, because `make
    # migrate` reads that DSN. A declared dependency nobody uses would read as a statement about
    # what these suites talk to, and it would not be true.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The pinned tool set, restored rather than compiled (ADR-0062, and the `quick` job above).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-go${{ env.GO_VERSION }}-
      - run: make tools-ensure
      # The backup targets come from Testcontainers, not from a service container - see the
      # integration job.
      - run: make gate-data
      # PG-2 and PG-7, the privacy gates that need a migrated database: the erasure sweeping every
      # storage location, and the schema reconciled against the data catalogue. On every pull
      # request rather than only in the nightly, so that a table merged without a catalogue row is
      # caught by the run that reviews it. Here, because this job already starts its database
      # through Testcontainers; the half without a database stays in `security`.
      - run: make gate-privacy-full

  docs:
    name: Documentation
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Behind no filter at all, like `secrets` and `licences`. It takes seconds and it is the only
    # thing standing behind three claims that a filter could skip: checkdocs reconciles the Go
    # version across go.mod, the workflows and the Dockerfile, reconciles the support matrix with
    # the nightly's jobs, and resolves ADR citations in every kind of source file and document
    # alike. Behind a filter, a change confined to `db/` or `deploy/` would skip the gate that
    # reads it. A job this cheap has no business having a filter to get wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # checkdocs is a program in this repository, not an installed tool, so `make tools` is not
      # needed - which is what keeps a documentation-only pull request cheap.
      - run: make gate-docs

  # Pull requests merge without catching up with main (ADR-0083), so two that each add migration
  # 0140 are both green alone and collide only on main. On a pull request this compares the numbers
  # it adds with every other open pull request's, and holds the merge with main to one file per
  # number; on main it holds the tree. Behind no filter: a number is taken in db/ or docs/adr/.
  numbers:
    name: Migration and ADR numbers
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The merge commit and its parents: the first parent is the base, so what the branch adds is
      # the diff from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make gate-numbers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          PR: ${{ github.event.pull_request.number }}
          OPEN: ${{ github.event_name == 'pull_request' && '1' || '0' }}

  pr-description:
    name: Pull request description
    # The description against the template: every section present and filled, n/a where one does
    # not apply, the issue it closes or why there is none, the use cases that exist, and the title
    # a Conventional Commit (tools/checkpr). Sessions wrote descriptions from scratch with `gh pr create --body`, which
    # never shows the template, and dropped the sections they judged irrelevant - "Does this need
    # an ADR?" among them, on a change to a gate (2026-09-30).
    #
    # Pull requests only, and never Dependabot's: it writes its own description, nobody reviews it
    # against this template, and a version bump settles nothing. Named by login, not by account
    # type: any other bot - a tool that steers the work under a GitHub App identity - is held to
    # the premises, the migration and use case rules like a person. The description is read from the API rather than from the
    # event, so re-running this job - which `pr-description-rerun.yml` does when the description
    # is edited - judges the description as it stands now, not as it was when the run began.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The whole history: the history rules read the branch's changes against its merge base
      # (tools/checkpr/rules.go).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The title too: it becomes the squash commit's title, from which release.yml writes the
      # changelog. Read like the description, so that an edited title is judged as it stands.
      - name: The description and the title, as they stand now
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.body // ""' > "${RUNNER_TEMP}/description.md"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.title' > "${RUNNER_TEMP}/title.txt"
      # TITLE travels in the environment rather than on make's command line, where a `$` in it
      # would be expanded by make.
      - run: TITLE="$(cat "${RUNNER_TEMP}/title.txt")" make gate-pr BODY="${RUNNER_TEMP}/description.md" BASE="${BASE}" HEAD_REF="${HEAD_SHA}" OPENED="${OPENED}"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENED: ${{ github.event.pull_request.created_at }}

  # ---------------------------------------------------------------------------
  # The JavaScript half: the two clients and the two packages they share.
  # ---------------------------------------------------------------------------

  node:
    name: Workspace (${{ matrix.package }})
    needs: changes
    # Every filter the matrix below tests, and `sync_engine` was missing from it: a change
    # confined to `packages/sync-engine/**` skipped the whole lane, so the package's own
    # tests never ran. It went unnoticed because that package had never changed alone -
    # every previous change to it came with `api/openapi.yaml`, which set `openapi`.
    if: needs.changes.outputs.webapp == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.design_system == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.sync_engine == 'true' || needs.changes.outputs.n8n_node == 'true' || needs.changes.outputs.zapier_app == 'true' || needs.changes.outputs.sdk_typescript == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One package per job, and one failure does not hide the others: a red typecheck in the
      # webapp says nothing about whether the design system still builds.
      fail-fast: false
      matrix:
        include:
          # `run` is what makes "the affected packages only" true. A package is affected when it
          # changed - and when something it consumes did, because that is how a renamed token
          # breaks the webapp while the design system stays green.
          #
          # It is a *boolean*, and every `if:` below tests it as one. An expression that is
          # the whole value of a matrix entry keeps its type, so these produce `true`/`false`
          # and not `"true"`/`"false"` - which is how `if: matrix.run == 'true'` came to be
          # false on every pull request, and how all four of these jobs reported green for
          # months without building, linting, typechecking or testing anything.
          - package: design-system
            run: ${{ needs.changes.outputs.design_system == 'true' || needs.changes.outputs.ci == 'true' }}
          - package: api-client
            run: ${{ needs.changes.outputs.api_client == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true' }}
          - package: sync-engine
            run: ${{ needs.changes.outputs.sync_engine == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true' }}
          # The connector packages are generated from the api-client's copy of the document
          # (ADR-0058), so a contract change is a change to each of them.
          # They are best effort on a pull request (ADR-0089): only a change to the connector
          # itself runs it there, so a contract change does not wait for them. `main` runs both on
          # every commit, so a connector the contract broke is seen on the day.
          - package: n8n-nodes-hubtask
            run: ${{ needs.changes.outputs.n8n_node == 'true' || needs.changes.outputs.ci == 'true' }}
          - package: zapier-app
            run: ${{ needs.changes.outputs.zapier_app == 'true' || needs.changes.outputs.ci == 'true' }}
          # The TypeScript SDK generates its own types from the contract and depends on no other
          # member, so only its own tree and the contract reach it.
          - package: sdk-typescript
            run: ${{ needs.changes.outputs.sdk_typescript == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true' }}
          - package: webapp
            run: ${{ needs.changes.outputs.webapp == 'true' || needs.changes.outputs.design_system == 'true' || needs.changes.outputs.sync_engine == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true' }}
          # The website renders the API reference from the api-client's copy of the document
          # (api-client's dist/), so a contract change is a website change.
          - package: website
            run: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.design_system == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - if: ${{ !matrix.run }}
        run: echo "nothing under this package or its dependencies changed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.run }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.run }}
        with:
          node-version-file: .nvmrc
      # The workspace map of ADR-0033, checked before anything is installed or built from it -
      # the pnpm counterpart of gate-architecture. Selftest first, per the gate-selftest habit:
      # a checker that cannot fail proves nothing by passing. Plain node, no dependencies, so it
      # runs before the install and fails fast.
      - if: ${{ matrix.run }}
        run: node build/lint-workspace-map.mjs --selftest && node build/lint-workspace-map.mjs
      # The same command a contributor runs, so the version of pnpm is pinned in exactly one
      # place - `packageManager` in package.json (ADR-0027).
      - if: ${{ matrix.run }}
        run: make tools-node
      - if: ${{ matrix.run }}
        run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - id: store
        if: ${{ matrix.run }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The pnpm store, cached separately from the Go module and build caches: the two halves of
      # this repository change at different rates, and one key for both would evict the other.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.run }}
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - if: ${{ matrix.run }}
        run: pnpm install --frozen-lockfile
      # `make website` is the command the Website workflow runs to produce what it publishes, and
      # it runs here so that it is proven before `main`: a post-merge workflow nobody watches is
      # where a broken publish would otherwise surface, while this job stays green.
      #
      # The position is the point. It runs before the builds below, so no `dist/` exists yet:
      # that is the condition the deploy gets and the one a developer's machine never has. Moving
      # it after them would make it pass on leftovers, which is exactly the way this broke.
      - name: The command that publishes the website builds it here first
        if: ${{ matrix.run && matrix.package == 'website' }}
        run: make website
      # `^...` is "everything this package depends on, but not the package itself". For a package
      # with no workspace dependencies the selection is empty and pnpm exits 0.
      - name: Build what this package consumes
        if: ${{ matrix.run }}
        run: pnpm --filter "@hubtask/${{ matrix.package }}^..." build
      - if: ${{ matrix.run }}
        run: pnpm --filter "@hubtask/${{ matrix.package }}" build
      - if: ${{ matrix.run }}
        run: pnpm --filter "@hubtask/${{ matrix.package }}" lint
      - if: ${{ matrix.run }}
        run: pnpm --filter "@hubtask/${{ matrix.package }}" typecheck
      - if: ${{ matrix.run }}
        run: pnpm --filter "@hubtask/${{ matrix.package }}" test

  # The browser job (ADR-0048, ADR-0089): the built bundle loaded in Chromium, and ADR-0044's
  # feature table asserted - a dialog traps focus and makes the page inert, the focus ring lands
  # where rule 5 puts it, a hidden label is in the tree and off the screen, anchor positioning
  # exists. Not a journey. It is what turns support-matrix.md §5's `supported` row for Chromium
  # from a claim into a job; and it gates through `CI required` below, because a browser job that
  # does not gate proves nothing about what is merged (ci-cd.md §3.2).
  #
  # The browser is pinned to the package's version and cached under it, so it moves when the
  # dependency is bumped and not when the runner image changes underneath.
  engines:
    name: The client runs in Chromium
    needs: changes
    if: needs.changes.outputs.webapp == 'true' || needs.changes.outputs.design_system == 'true' || needs.changes.outputs.sync_engine == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # The suite alone takes about sixteen minutes since the screen walks came in, and the apt
    # steps up to fifteen on a slow mirror: twenty minutes cancelled green runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: make tools-node
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @hubtask/webapp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The browser, keyed by the package version: a floating version would be a cache that misses
      # and a browser downloaded on every run (ADR-0048, consequences).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Both steps below run apt against the runner's mirror, which is sometimes slow (50 kB/s for
      # the 26 MB these steps fetch) and has hung outright. apt itself drops a connection that sends
      # nothing for 30 seconds and tries again; a download that is slow but moving is let finish.
      # A limit per try is what not to do: it cut such a download and started it again from zero,
      # three times, and turned a slow mirror into a red `main` (ADR-0089).
      - name: apt gives up on a stalled mirror and retries
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
      - if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: pnpm --filter @hubtask/webapp exec playwright install --with-deps chromium
      # The system packages the engine needs are installed either way; only the browser is cached.
      - if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: pnpm --filter @hubtask/webapp exec playwright install-deps chromium
      - run: pnpm --filter "@hubtask/webapp^..." build
      - run: pnpm --filter @hubtask/webapp build
      # The design system's workbench, which e2e/workbench-layout.test.mjs measures: a reason never
      # moves the page (UC-WRK-32). Built here, not in `pnpm -r build`, which never ships it.
      - run: pnpm --filter @hubtask/design-system workbench:build
      # Chromium only (ADR-0089): Firefox and WebKit failed here far more often by the runner than
      # by the client, and every such failure held every pull request. They are best effort, run by
      # hand with ENGINES=firefox,webkit.
      - run: pnpm --filter @hubtask/webapp test:engines
        env:
          ENGINES: chromium

  # The installed apps' shell (ADR-0031, UC-WRK-33/5): the Tauri project at apps/webapp/src-tauri/,
  # built on the two desktop systems it ships for (F7 Decision 9) - only here, never by `go` or the
  # pnpm workspace (ADR-0033). Rust comes from the runner's rustup, which installs the version
  # `rust-toolchain.toml` pins, so the lane needs no action beyond GitHub's own. The licences of
  # the crates are held by cargo-deny under the policy `go-licenses` holds the Go side to
  # (licensing-editions.md §1); once is enough, so the Linux leg runs it with the Rust tests.
  #
  # Each leg then walks its app (UC-SYN-07 check 9): the debug build with the `walk` feature against
  # a real server on the runner's own PostgreSQL, driven by the engine's own WebDriver - WebKitGTK's
  # WebKitWebDriver, the runner's msedgedriver for WebView2, its chromedriver for Android's system
  # WebView on an emulator (`apps/webapp/e2e/webview/smoke.mjs`). A failure in one engine fails
  # the lane; `fail-fast` stays off so the other two still say whether they pass.
  shell:
    name: Shell (${{ matrix.system }})
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-latest
            bundles: deb
          - system: Windows
            runner: windows-latest
            bundles: nsis
          # The Android app on the runner's own SDK, NDK and JDK: one ABI in debug, the emulator's,
          # to prove it builds and to walk it; the universal, signed APK is the release's (F7
          # Decision 9, versioning-release.md).
          - system: Android
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Not `make tools-node`: a Windows runner has no make. The same pin, read the same way.
      - name: pnpm, as package.json pins it
        run: |
          version=$(sed -n 's/.*"packageManager": "pnpm@\([^"]*\)".*/\1/p' package.json)
          corepack enable pnpm
          corepack prepare "pnpm@$version" --activate
          pnpm --version
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: The pinned Rust
        working-directory: apps/webapp/src-tauri
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny*
            apps/webapp/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/webapp/src-tauri/rust-toolchain.toml', 'apps/webapp/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # The walk's server, built from this commit.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The webview and the packaging tools Tauri's Linux build links against. apt can hang on the
      # runner's mirror, so the step has a limit of its own (see `engines`).
      - name: The system's webview
        if: matrix.system == 'Linux'
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev file \
            webkit2gtk-driver xvfb gnome-keyring
      # SQLCipher, the encrypted copy's cipher (ADR-0033 §4), links OpenSSL's libcrypto: Linux finds
      # libssl-dev's where the compiler looks, the Windows runner's has to be named.
      - name: The system's OpenSSL
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          found() { for root in "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64"; do
            [ -d "$root/include/openssl" ] && return 0; done; return 1; }
          found || { choco install openssl --no-progress -y && found; }
          # The import library for the dynamic runtime where the installer carries several.
          lib=$(find "$root/lib" -iname libcrypto.lib | grep -i 'x64/md/' | head -1)
          [ -n "$lib" ] || lib=$(find "$root/lib" -iname libcrypto.lib | head -1)
          test -n "$lib"
          echo "OPENSSL_LIB_DIR=$(cygpath -w "$(dirname "$lib")")" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$(cygpath -w "$root/include")" >> "$GITHUB_ENV"
          # The walk runs the app, which loads libcrypto's DLL from the path.
          cygpath -w "$root/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@hubtask/webapp^..." build
      # UC-WRK-33 check 5: the icons on every size from the mark's app-icon source, and the check
      # that the shell bundles exactly those - nothing committed by hand.
      - run: pnpm --filter @hubtask/webapp desktop:icons
      - name: The crates' licences
        if: matrix.system == 'Linux'
        working-directory: apps/webapp/src-tauri
        run: |
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked --version 0.19.0
          cargo deny --locked check licenses bans sources
      - name: Format, lint and test the shell
        if: matrix.system == 'Linux'
        working-directory: apps/webapp/src-tauri
        run: |
          pnpm --filter @hubtask/webapp build:desktop
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      # A debug build: the lane proves the shell builds and bundles on this system; the release
      # build with its signature is the release's (versioning-release.md). With the walk's stand-in
      # for the system's browser (`walk.rs`), which no release carries.
      - if: matrix.system != 'Android'
        run: pnpm --filter @hubtask/webapp desktop:build --debug --ci --bundles ${{ matrix.bundles }} --features walk
      # SQLCipher's libcrypto for Android, from OpenSSL's pinned release (`android-openssl.sh`).
      - name: The Android app
        if: matrix.system == 'Android'
        run: |
          (cd apps/webapp/src-tauri && rustup target add x86_64-linux-android)
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          pnpm --filter @hubtask/webapp android:openssl x86_64-linux-android
          pnpm --filter @hubtask/webapp android:build --debug --apk --ci --target x86_64 --features walk --config '{"version":"0.0.1"}'
      # UC-SYN-07 check 9 from here on. The walk's server and its database: the runner's own
      # PostgreSQL, a database of its own, and the server and its migrations built from this commit.
      - name: The walk's server
        timeout-minutes: 10
        run: |
          walk="$RUNNER_TEMP/walk" && mkdir -p "$walk"
          if [ "$RUNNER_OS" = Windows ]; then
            # The image ships the service disabled; its documented start sets the start type first.
            pwsh -NoProfile -Command 'Get-Service -Name postgresql* | Set-Service -StartupType Manual -PassThru | Start-Service'
            "$(cygpath -u "$PGBIN")/pg_isready.exe" -h 127.0.0.1 -t 60
            "$(cygpath -u "$PGBIN")/createdb.exe" hubtask
            echo "WALK_DB=postgres://$PGUSER:$PGPASSWORD@127.0.0.1:5432/hubtask?sslmode=disable" >> "$GITHUB_ENV"
            exe=.exe
          else
            sudo systemctl start postgresql.service
            sudo -u postgres psql -qc "ALTER USER postgres PASSWORD 'walk'"
            sudo -u postgres createdb hubtask
            echo "WALK_DB=postgres://postgres:walk@127.0.0.1:5432/hubtask?sslmode=disable" >> "$GITHUB_ENV"
            exe=
          fi
          go build -o "$walk/hubtask$exe" ./cmd/server
          go build -o "$walk/hubtask-migrate$exe" ./cmd/migrate
          echo "WALK_SERVER=$walk/hubtask$exe" >> "$GITHUB_ENV"
          echo "WALK_MIGRATE=$walk/hubtask-migrate$exe" >> "$GITHUB_ENV"
      # Android's system WebView on an emulator of the runner's SDK, with the KVM the runner offers.
      - name: The emulator
        if: matrix.system == 'Android'
        timeout-minutes: 25
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-35;google_apis;x86_64'
          "$tools/sdkmanager" --install emulator platform-tools "$image" < /dev/null > /dev/null
          # One place for the AVD, named to both tools: avdmanager and the emulator otherwise disagree
          # about the default directory on the runner.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force -n walk -k "$image" -d pixel_7 -p "$ANDROID_AVD_HOME/walk.avd"
          "$tools/avdmanager" list avd
          emulator="$ANDROID_HOME/emulator/emulator"
          "$emulator" -accel-check
          log="$RUNNER_TEMP/emulator.log"
          nohup "$emulator" -avd walk -no-window -no-audio -no-snapshot -no-boot-anim \
            -accel on -gpu swiftshader_indirect -memory 4096 -cores 4 -camera-back none > "$log" 2>&1 &
          pid=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          # Bounded: a dead emulator or a boot that never completes fails here with its log, rather
          # than hanging in an unbounded `adb wait-for-device` until the step's timeout.
          deadline=$((SECONDS + 1200))
          until [ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            if ! kill -0 "$pid" 2>/dev/null || [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the emulator did not boot"; tail -n 80 "$log"; exit 1
            fi
            sleep 5
          done
          "$adb" shell input keyevent 82
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: The smoke walk
        timeout-minutes: 15
        run: |
          walk=(node apps/webapp/e2e/webview/smoke.mjs --server "$WALK_SERVER" --migrate "$WALK_MIGRATE" --db "$WALK_DB" --out "$RUNNER_TEMP/walk/out")
          case "${{ matrix.system }}" in
            # The session lives in the system's keystore (UC-SYN-07 check 3): a Secret Service on a
            # bus of the walk's own, unlocked, as a person's desktop session has it.
            Linux) dbus-run-session -- bash -c 'echo -n walk | gnome-keyring-daemon --unlock --components=secrets >/dev/null; exec "$@"' walk \
              xvfb-run -a "${walk[@]}" --engine linux --app apps/webapp/src-tauri/target/debug/hubtask --driver WebKitWebDriver ;;
            Windows) "${walk[@]}" --engine windows --app "$(cygpath -w "$PWD/apps/webapp/src-tauri/target/debug/hubtask.exe")" \
              --driver "$(cygpath -u "${EDGEWEBDRIVER:-C:\\SeleniumWebDrivers\\EdgeDriver}")/msedgedriver.exe" ;;
            Android) "${walk[@]}" --engine android --driver "$CHROMEWEBDRIVER/chromedriver" \
              --app "$(find apps/webapp/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)" ;;
          esac

  tokens-drift:
    name: Design tokens are in step with the core
    needs: changes
    if: needs.changes.outputs.design_system == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: make tools-node
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: make tokens
      # The generated Go file is committed, so a drift between the design system and the domain
      # is a diff rather than a rendering bug found by a user (ADR-0029). This is the check that
      # says so. tokens.css and tokens.ts are regenerated too, but they are not committed - what
      # matters is that generating them succeeded.
      - name: The committed LabelTokens.go must match the source
        run: |
          if ! git diff --quiet -- core/domain/model/shared/LabelTokens.go; then
            echo "::error file=core/domain/model/shared/LabelTokens.go::regenerating the design tokens changes this file - run 'make tokens' and commit the result"
            git --no-pager diff -- core/domain/model/shared/LabelTokens.go
            exit 1
          fi
          echo "the committed label tokens match packages/design-system/tokens/tokens.json"

  api-client-drift:
    name: The API client still generates from the contract
    needs: changes
    if: needs.changes.outputs.openapi == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: make tools-node
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: make api-client
      # Nothing generated here is committed, so there is no diff to compare against - and none is
      # wanted: the output is reproducible from the specification and the lockfile, and committing
      # it would be a second description of the contract to keep in step (ADR-0004, ADR-0027).
      #
      # What is worth checking is the failure that actually happens: a change to openapi.yaml that
      # every consumer then stops typechecking against. So the client is regenerated and the whole
      # workspace is built and typechecked on top of it.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - name: Nothing generated may have been committed
        run: |
          if ! git diff --quiet; then
            echo "::error::regeneration changed a tracked file - generated output must not be committed"
            git --no-pager diff --stat
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The one required status check.
  #
  # Branch protection names this job and nothing else. Every other job is behind
  # an `if:`, and a required check that gets skipped is not green - it is pending,
  # forever, and the pull request can never merge. This job always runs, so it
  # always reports, and it decides what a skip means: skipped is fine, failed and
  # cancelled are not.
  # ---------------------------------------------------------------------------

  #
  # On a draft it runs too - every job it waits for was skipped - but under another name. A draft's
  # commit must not carry a `CI required` at all: a green one would satisfy branch protection without
  # a single gate having run, and GitHub drops it only once the next run's check suite exists, which
  # a probe measured as mergeable in the moment after *Ready for review* (ADR-0079). Named
  # this way, the required check can only come from a run that checked something.
  ci-required:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'CI not run (draft)' || 'CI required' }}
    # Not on a draft at all: a draft's run then starts no runner, and nothing waits for it.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs:
      - changes
      - actions-allowed
      - secrets
      - dependencies
      - licences
      - quick
      - build
      - unit
      - architecture
      - resilience
      - observability
      - chart
      - api-compat
      - compose
      - e2e
      - engine-session
      - selftest
      - integration
      - security
      - data
      - docs
      - numbers
      - pr-description
      - node
      - engines
      - shell
      - tokens-drift
      - api-client-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The guard below reads main's runs and the pull request's title and description.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Every job that ran must have passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a job ended as '$result'"
                exit 1
                ;;
            esac
          done
          echo "every job either passed or had nothing to do"
      # Pull requests merge without catching up (ADR-0083): while main's newest run is red, a pull
      # request that is not the fix waits. Last, because auto-merge acts seconds after this check
      # turns green. Never on the push to main itself, or main could never turn green again. The
      # script is run directly: this job has no Go, and make reads go.mod (`make gate-main-green`
      # runs the same locally).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        with:
          sparse-checkout: scripts/ci
      - name: Main is green, or this is its fix
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/ci/main-green.sh
