name: CI

on:
  pull_request:
  push:
    branches: [main]

# The principle from ADR-0022: minimal permissions, widened only where necessary.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  quick:
    name: Format, lint, generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      - run: make gate-quick

  build:
    name: Build (${{ matrix.goarch }})
    needs: quick
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make build

  unit:
    name: Unit and domain tests
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make gate-unit

  architecture:
    name: Architecture rules
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Checks: layer boundaries, the bare-goroutine ban, mandatory authorisation,
      # use case parity across REST/MCP/automation, observability and audit completeness.
      - run: make gate-architecture

  platforms:
    name: Toolchain (${{ matrix.os }})
    needs: quick
    # Contributors work on Windows, macOS and Linux, and every gate is a make target - which makes
    # the Makefile and the scripts as much a cross-platform artefact as the Go code, and one that
    # nothing else here exercises. Every other job runs on ubuntu, so a Windows-only or macOS-only
    # break is invisible until somebody hits it by hand: that is exactly how a `filepath.Clean`
    # that keeps backslashes, and a work tree checked out as CRLF, both reached main.
    #
    # Linux is deliberately absent - the jobs above already are the Linux run.
    strategy:
      # Both platforms report. Learning that Windows is red is not a reason to stop finding out
      # about macOS.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The recipes are bash everywhere; on the Windows runner this is Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Report the toolchain
        # In the log before anything can fail: which make, which bash, which shell utilities. A
        # platform break is usually a version difference, and this is the line that names it.
        run: make --version | head -1; bash --version | head -1; go env GOEXE GOOS
      - run: make tools
      - run: make gate-quick
      - run: make gate-architecture
      # Carries the race detector, so it also proves cgo is wired up on this platform.
      - run: make gate-unit

  resilience:
    name: Resilience RT-1..RT-12
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The RT series is a PR gate wherever it can be (observability-reliability.md §12); the
      # three that need hours of load - RT-6, RT-8, RT-11 - live in the load suite and stay
      # nightly.
      - run: make gate-resilience

  selftest:
    name: The gates catch their own violations
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      # Writes a deliberate violation per configured rule and expects a red result. Without
      # this, a rule broken by a config change would simply stop reporting anything.
      - run: make gate-selftest

  integration:
    name: Integration (PostgreSQL)
    needs: quick
    runs-on: ubuntu-latest
    # Object storage is deliberately not a service container: the storage and backup tests start
    # their own target through Testcontainers (engineering-guidelines.md §1), which also covers
    # the targets a service container cannot provide (SFTP, WebDAV, SMB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      - run: make migrate
      - run: make gate-integration
      - run: make gate-contract

  security:
    name: Security gates SG-1..SG-12
    needs: quick
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0           # SG-7 scans the history, so the history has to be here
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      # SG-7: secret scanning across the entire history.
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make gate-security

  data:
    name: Data gates (migration, retention, backup, sync)
    needs: quick
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      # The backup targets come from Testcontainers, not from a service container - see the
      # integration job.
      - run: make gate-data

  docs:
    name: Documentation
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make gate-docs
