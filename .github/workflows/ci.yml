name: CI

on:
  pull_request:
  push:
    branches: [main]

# The principle from ADR-0022: minimal permissions, widened only where necessary.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  quick:
    name: Format, lint, generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      - run: make gate-quick

  build:
    name: Build (${{ matrix.goarch }})
    needs: quick
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make build

  unit:
    name: Unit and domain tests
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make gate-unit

  architecture:
    name: Architecture rules
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Checks: layer boundaries, the bare-goroutine ban, mandatory authorisation,
      # use case parity across REST/MCP/automation, observability and audit completeness.
      - run: make gate-architecture

  integration:
    name: Integration (PostgreSQL, MinIO)
    needs: quick
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: hubtask
          MINIO_ROOT_PASSWORD: hubtask-dev-secret
        ports: ["9000:9000"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      - run: make migrate
      - run: make gate-integration
      - run: make gate-contract

  security:
    name: Security gates SG-1..SG-12
    needs: quick
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      # SG-7: secret scanning across the entire history.
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make gate-security

  data:
    name: Data gates (migration, retention, backup, sync)
    needs: quick
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hubtask
          POSTGRES_DB: hubtask_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: hubtask
          MINIO_ROOT_PASSWORD: hubtask-dev-secret
        ports: ["9000:9000"]
    env:
      HUBTASK_DB_DSN: postgres://postgres:hubtask@localhost:5432/hubtask_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make tools
      - run: make gate-data

  docs:
    name: Documentation
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make gate-docs
