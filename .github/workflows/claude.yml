# Claude Code as the assignee — switched off for the initial development phase.
#
# The scope was always deliberately narrow: Claude works only on branches and opens pull requests,
# and there is no path on which AI writes directly to main or triggers a release. What has changed
# is that the work is being done in a local session instead, so every task in the backlog is
# treated as [L] regardless of how it is marked (CLAUDE.md, "Automated review and delegation").
#
# The triggers stay, and the job answers instead of running. Removing them would mean that labelling
# an issue `claude:task` did nothing at all and said nothing about why - which is the failure this
# repository has already had once, when the review workflow reported green without reviewing.
#
# Re-enabling is not a matter of deleting the step below. The action's inputs have to be brought up
# to date first: `allowed_tools` and `disallowed_tools` were renamed into `claude_args` in the
# pinned version, and the ones written here are silently ignored today.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [assigned, labeled]

permissions:
  contents: read

jobs:
  claude:
    # Only on explicit request and only for authorised people.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude:task')
      ) && (
        github.event.sender.type != 'Bot'
      ) && (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Narrowed with the job: it answers, so it needs to write a comment and nothing else. The
    # branch, pull request and token rights come back when delegation does.
    permissions:
      contents: read
      issues: write            # reply in the issue
      pull-requests: write     # reply on a pull request
    # No checkout: the job reads nothing of the repository, and cloning it to leave a comment
    # would be a minute of a runner for nothing.
    steps:
      - name: Say that delegation is off
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          cat > reply.md <<'REPLY'
          **Delegation to Claude in CI is switched off** for the initial development phase.

          Every task in `docs/backlog/` is being worked on locally in a Claude Code session and is
          treated as **[L]**, whatever it is marked in the backlog — so nothing will happen on this
          issue as a result of the label or the mention. The `[G]` markers are a decision for later
          (CLAUDE.md, "Automated review and delegation").

          This reply exists so that the request is answered rather than silently dropped.
          REPLY

          jq -n --rawfile body reply.md '{body: $body}' > payload.json
          gh api -X POST "repos/${REPOSITORY}/issues/${TARGET}/comments" --input payload.json \
            --silent
