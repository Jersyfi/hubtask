name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    environment: production          # a protection rule with manual approval (ADR-0022)
    permissions:
      contents: write                # create the GitHub release
      packages: write                # push to ghcr.io
      id-token: write                # keyless signing through OIDC
      attestations: write            # Provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # for the changelog from Conventional Commits

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: The image name in lower case
        # A Docker reference must be lower case, and github.repository keeps the owner's spelling.
        # The push failed on that with an error about the repository name, not about the case.
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Whether this tag is a pre-release, and the tags that follow from it
        # A semver pre-release carries a hyphen: v0.2.0-rc.1. It is built, signed and published
        # like any other version, and it moves a floating tag — just not the same one.
        #
        # versioning-release.md §5: a pre-release is `X.Y.Z-rc.N` with the image tag `:rc`. The two
        # floating tags are two audiences. `latest` is what somebody gets who pins nothing
        # (deployment.md §1), and handing that person a release candidate is how an installation
        # ends up on a version nobody chose. `:rc` is what somebody asks for on purpose, and
        # leaving it unset would mean the convention exists on paper and nowhere else.
        run: |
          if [ "${GITHUB_REF_NAME#*-}" != "${GITHUB_REF_NAME}" ]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          {
            echo 'IMAGE_TAGS<<TAGS'
            echo "ghcr.io/${IMAGE_NAME}:${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF_NAME#*-}" = "${GITHUB_REF_NAME}" ]; then
              echo "ghcr.io/${IMAGE_NAME}:latest"
            else
              echo "ghcr.io/${IMAGE_NAME}:rc"
            fi
            echo TAGS
          } >> "$GITHUB_ENV"

      - name: Run the gates again
        run: make tools && make verify

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_TAGS }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Produce the SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Provenance-Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: The third-party licences of this release
        # Regenerated rather than taken from the repository: what ships has to be the list of what
        # this build actually links (ADR-0013, licensing-editions.md §3).
        run: make licenses

      - name: Package the Helm chart
        run: |
          .tools/helm package k8s --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" -d dist/
          .tools/helm push dist/*.tgz "oci://ghcr.io/${{ env.OWNER }}/charts"

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # Otherwise a release candidate appears on the repository front page as the current
          # version, which is the same mistake as the `latest` tag in a second place.
          prerelease: ${{ env.PRERELEASE }}
          files: |
            sbom.cdx.json
            dist/*.tgz
            THIRD-PARTY-LICENSES.md
