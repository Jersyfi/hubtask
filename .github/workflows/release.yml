name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production          # a protection rule with manual approval (ADR-0022)
    permissions:
      contents: write                # create the GitHub release
      packages: write                # push to ghcr.io
      id-token: write                # keyless signing through OIDC
      attestations: write            # Provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # for the changelog from Conventional Commits

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: The image name in lower case
        # A Docker reference must be lower case, and github.repository keeps the owner's spelling.
        # The push failed on that with an error about the repository name, not about the case.
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Whether this tag is a pre-release, and the tags that follow from it
        # A semver pre-release carries a hyphen: v0.2.0-rc.1. It is built, signed and published
        # like any other version, and it moves a floating tag — just not the same one.
        #
        # versioning-release.md §5: a pre-release is `X.Y.Z-rc.N` with the image tag `:rc`. The two
        # floating tags are two audiences. `latest` is what somebody gets who pins nothing
        # (deployment.md §1), and handing that person a release candidate is how an installation
        # ends up on a version nobody chose. `:rc` is what somebody asks for on purpose, and
        # leaving it unset would mean the convention exists on paper and nowhere else.
        run: |
          if [ "${GITHUB_REF_NAME#*-}" != "${GITHUB_REF_NAME}" ]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          {
            echo 'IMAGE_TAGS<<TAGS'
            echo "ghcr.io/${IMAGE_NAME}:${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF_NAME#*-}" = "${GITHUB_REF_NAME}" ]; then
              echo "ghcr.io/${IMAGE_NAME}:latest"
            else
              echo "ghcr.io/${IMAGE_NAME}:rc"
            fi
            echo TAGS
          } >> "$GITHUB_ENV"

      - name: Run the gates again
        run: make tools && make verify

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_TAGS }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Produce the SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Provenance-Attestation
        # `actions/attest` with no SBOM and no predicate input generates SLSA build provenance -
        # documented as its default mode, and all that `attest-build-provenance` does since its v4,
        # which is a composite forwarding every input to this action plus the header size below.
        #
        # Called directly, the commit our own pin gate checks is the commit that signs. Through the
        # wrapper it is not: the code doing the signing came from a pin inside somebody else's
        # action.yml, which `scripts/check-action-pins.sh` never reads because it only scans
        # `.github/workflows` (ci-cd.md §4).
        env:
          # The attestations API answers with headers larger than Node's default accepts; the
          # wrapper set this, and dropping the wrapper means carrying it.
          NODE_OPTIONS: "--max-http-header-size=32768"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: The third-party licences of this release
        # Regenerated rather than taken from the repository: what ships has to be the list of what
        # this build actually links (ADR-0080, licensing-editions.md).
        run: make licenses

      - name: The machine-readable advisories (CSAF 2.0, VEX)
        # security.md §14.2: one document per advisory in security/advisories/, each signed keyless
        # beside its hashes; with no advisory nothing is written and nothing attached.
        run: |
          make csaf CSAF_OUT=dist/csaf
          if [ -d dist/csaf ]; then
            find dist/csaf -name '*.json' -print0 | xargs -0 -I{} cosign sign-blob --yes --bundle {}.sigstore.json {}
            tar -czf csaf.tar.gz -C dist csaf
          fi

      - name: The release record
        # versioning-release.md §3: what this release is, named by hash and address, signed.
        run: |
          go run ./tools/releaserecord -version "${GITHUB_REF_NAME}" -commit "${GITHUB_SHA}" \
            -image "ghcr.io/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}" -digest "${{ steps.build.outputs.digest }}" \
            -run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -go "$(go env GOVERSION)" \
            sbom.cdx.json THIRD-PARTY-LICENSES.md > release-record.json
          cosign sign-blob --yes --bundle release-record.json.sigstore.json release-record.json

      - name: Package the Helm chart
        run: |
          .tools/helm package k8s --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" -d dist/
          .tools/helm push dist/*.tgz "oci://ghcr.io/${{ env.OWNER }}/charts"

      - name: The Compose files of this release
        # A self-hoster starts from these, so the example names this release, never a floating tag
        # (deployment.md §1); compose.yaml refuses an unset HUBTASK_VERSION.
        run: |
          mkdir -p dist/compose
          cp deploy/docker/compose.yaml dist/compose/compose.yaml
          sed "s/^HUBTASK_VERSION=.*/HUBTASK_VERSION=${GITHUB_REF_NAME}/" deploy/docker/.env.example > dist/compose/.env.example
          grep -qx "HUBTASK_VERSION=${GITHUB_REF_NAME}" dist/compose/.env.example
          tar -czf compose.tar.gz -C dist/compose compose.yaml .env.example

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # Otherwise a release candidate appears on the repository front page as the current
          # version, which is the same mistake as the `latest` tag in a second place.
          prerelease: ${{ env.PRERELEASE }}
          files: |
            sbom.cdx.json
            dist/*.tgz
            THIRD-PARTY-LICENSES.md
            release-record.json
            release-record.json.sigstore.json
            csaf.tar.gz
            compose.tar.gz

  integrations:
    # The n8n node and the Zapier app, generated from the contract at this tag (UC-INT-11 check 4).
    # Each step runs only when the owner's account secret is set, so a fork's tag publishes nothing.
    name: Publish the n8n node and the Zapier app
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write                # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: make tools-node
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Version the packages as the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for dir in packages/n8n-nodes-hubtask packages/zapier-app; do
            (cd "$dir" && npm pkg set version="$version")
          done
      - run: pnpm --filter @hubtask/api-client --filter @hubtask/n8n-nodes-hubtask --filter @hubtask/zapier-app build
      - run: pnpm --filter @hubtask/n8n-nodes-hubtask --filter @hubtask/zapier-app typecheck
      - name: Publish the n8n node to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/n8n-nodes-hubtask/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Push the Zapier app
        if: env.ZAPIER_DEPLOY_KEY != ''
        working-directory: packages/zapier-app/dist
        run: |
          npm install --no-save --ignore-scripts
          version="$(node -p "require('./package.json').zapier.convertedByCLIVersion")"
          npx --yes "zapier-platform-cli@${version}" push
