name: Task
description: A task of a milestone — a copy of its entry in docs/backlog/milestone-<X>.md, which stays the source.
title: "<ID> — "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        A task is written in its milestone file first (docs/backlog/README.md). This issue copies it;
        where the two differ, the file wins. A task of a released milestone carries only checks
        from the milestone's `Delivers`.

  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: "PH"
    validations:
      required: true

  - type: input
    id: usecases
    attributes:
      label: Use cases
      description: The checks this task carries, as in its `**Use cases:**` line.
      placeholder: "UC-PRV-01 (9, 10)"
    validations:
      required: true

  - type: textarea
    id: text
    attributes:
      label: The task
      description: What is built, and how it is proven (Acceptance) — copied from the milestone file.
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "nothing"

  - type: textarea
    id: read
    attributes:
      label: What to read
      description: Beyond the use cases above — the subject-document sections, ADRs and known traps a worker reads before the readiness record (AGENTS.md, "The loop for every task", step 1).
      placeholder: "data-protection.md §4.1; known-traps.md, Transactions and wiring"

  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      description: Tick what the work touches; the `area:` labels are applied from this.
      options:
        - label: "area:core — the domain, the application layer, the ports"
        - label: "area:api — the OpenAPI contract, REST, MCP, the generated client"
        - label: "area:webapp — the to-do application in the browser"
        - label: "area:website — the project website hubtask.eu"
        - label: "area:design-system — tokens, the CSS layer, the visual reference"
        - label: "area:infra — persistence, storage, mail, outbound adapters, deployment"
        - label: "area:ci — workflows, gates, release"
        - label: "area:docs — subject documents, ADRs, use cases, the backlog, the guides"
