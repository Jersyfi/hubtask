name: Bug
description: Report incorrect behaviour.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, request/response, and the `request_id` from the error response.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.3.1 (from /meta/capabilities)"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: ["Local (Compose)", "Integration", "Production", "Third-party self-hosting"]
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here** — use `SECURITY.md` for those.
        Do not include real user data or tokens.

  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      description: >
        This is a personal repository, so organisation-level issue types and fields are not
        available and the `area:` labels carry that dimension instead. Tick what the work touches;
        the labels are applied from this.
      options:
        - label: "area:core — the domain, the application layer, the ports"
        - label: "area:api — the OpenAPI contract, REST, MCP, the generated client"
        - label: "area:webapp — the to-do application in the browser"
        - label: "area:website — the project website hubtask.eu"
        - label: "area:design-system — tokens, the CSS layer, the visual reference"
        - label: "area:infra — persistence, storage, mail, outbound adapters, deployment"
        - label: "area:ci — workflows, gates, release"
        - label: "area:docs — arc42, ADRs, the backlog, the guides"
