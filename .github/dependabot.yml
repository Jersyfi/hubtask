version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Small updates are grouped, so that ten PRs do not appear every week.
      patch-and-minor:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One action can be several dependencies: `github/codeql-action/init`, `/autobuild`, `/analyze`
    # and `/upload-sarif` are four paths into one repository sharing one commit SHA, and Dependabot
    # bumps each on its own. Split across pull requests that is not four small changes but one
    # broken one - `init` at v4 beside `analyze` at v3 in the same job is a configuration error
    # (#16). Grouped, the family travels together, which is what security.md §11 asks for.
    #
    # The old limit of five was the second half of the same defect: with `init` and `upload-sarif`
    # taking two of the slots, the bumps for `autobuild` and `analyze` were never opened at all,
    # so nothing in the pull request list showed that the family had been broken apart.
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # The pnpm workspace, as ONE entry rooted at the repository root.
  #
  # `directories:` with the five manifest locations looked tidier and was wrong: Dependabot opens
  # a pull request per directory, so a single TypeScript bump arrived five times, each one editing
  # the same root pnpm-lock.yaml, each one conflicting with the other four (#108-#112). The npm
  # ecosystem understands a pnpm workspace from its root - it reads pnpm-workspace.yaml and updates
  # the member manifests together, in one pull request, against the one lockfile that exists.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouped for the same reason as the Go side: ten pull requests a week is a list nobody
      # reads. A major stays on its own, because a major is a decision.
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # `@types/node` describes a runtime, and this runtime is pinned: .nvmrc says 24 and
      # `engines.node` says >=24. Types ahead of the runtime make `pnpm -r typecheck` green about
      # APIs the image does not have (#143, #249), which is worse than no typecheck at all. Minor
      # and patch updates inside 24.x keep arriving; the major follows the Node line itself, and
      # that line waits for Node 26 to be declared LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # The base images follow the toolchain, they do not lead it. The UI stage is pinned to the
      # line in .nvmrc, and a major arriving here on its own would build the released interface
      # with a Node that CI never ran. node:26 also drops corepack, which that stage needs, so the
      # bump arrived broken as well as ahead of its source (#134). Moving the line is its own
      # change - .nvmrc, `engines`, the Dockerfile and the corepack install together - and it
      # waits for Node 26 to be declared LTS.
      #
      # `golang:` is deliberately not listed. Its line moves are minor updates, they keep arriving,
      # and each one is merged together with GO_VERSION in ci.yml and the `toolchain` directive.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
