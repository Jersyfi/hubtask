version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Small updates are grouped, so that ten PRs do not appear every week.
      patch-and-minor:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One action can be several dependencies: `github/codeql-action/init`, `/autobuild`, `/analyze`
    # and `/upload-sarif` are four paths into one repository sharing one commit SHA, and Dependabot
    # bumps each on its own. Split across pull requests that is not four small changes but one
    # broken one - `init` at v4 beside `analyze` at v3 in the same job is a configuration error
    # (#16). Grouped, the family travels together, which is what security.md §11 asks for.
    #
    # The old limit of five was the second half of the same defect: with `init` and `upload-sarif`
    # taking two of the slots, the bumps for `autobuild` and `analyze` were never opened at all,
    # so nothing in the pull request list showed that the family had been broken apart.
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
