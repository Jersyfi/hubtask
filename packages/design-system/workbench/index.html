<!DOCTYPE html>
<!-- No data-theme here: main.ts sets it for the workbench's own chrome, following the system
     preference. The generated stylesheet has no :root fallback on purpose (ADR-0029), so a boot
     path that forgets to set it shows itself immediately rather than picking a mode nobody chose.
     The stage sets its own data-theme per pane - that is the point of the theme axis. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hubtask Workbench</title>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <div id="workbench"></div>
  </body>
</html>
