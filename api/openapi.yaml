openapi: 3.1.0
info:
  title: Hubtask API
  version: 0.1.0
  summary: Task management with Hub / Collection / Task / Work Package / Activity
  description: |
    The skeleton of the API contract (API first). This file is the single source of truth:
    server interfaces and client SDKs are generated from it (`make generate`).

    For the conventions see docs/architecture/api-guidelines.md:
      * one major path `/api/v1`, additive changes without a version bump
      * errors per RFC 9457 with a stable `code`
      * cursor pagination, `Idempotency-Key`, `ETag`/`If-Match`
      * actions as a suffix (`POST /items/{id}:complete`)
      * no display text, only codes and parameters

    Not yet elaborated (deliberately open, to be added in phase 0/1): templates, views, jumble,
    reminders, recurrence, automation, webhooks, media, admin/tenants, search, SSE.
  license:
    name: BUSL-1.1
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:8080

security:
  - bearerAuth: []

tags:
  - name: meta
  - name: identity
  - name: auth
  - name: containers
  - name: items
  - name: structure
  - name: comments
  - name: reminders
  - name: recurrence
  - name: templates
  - name: media
  - name: audit
  - name: privacy
  - name: backup
  - name: retention
  - name: sync
  - name: views
  - name: calendar
  - name: webhooks
  - name: jobs

paths:
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      description: >
        The templates the caller may use, newest first. Naming a container answers the ones defined
        along that container's path - the collection's, its hub's and the workspace-wide ones -
        because that is the set a person picking a template in a collection can choose from.
        Naming none answers the workspace-wide ones alone.
      parameters:
        - name: container_id
          in: query
          required: false
          description: The container whose templates are wanted, together with the ones above it.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePage"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [templates]
      operationId: createTemplate
      description: >
        Defines a template: a name, a scope, and the tree it stamps out. The tree is validated here
        rather than at instantiation - a template that cannot produce anything is one nobody can
        fix from a failed instantiation - so the types have to be permitted under one another by
        this installation's capability profiles, and the tree has to stay inside the node cap in
        /meta/capabilities.

        A node's due date is relative: an ISO-8601 duration from the anchor of the instantiation,
        such as P3D for "three days in". Absolute dates are deliberately not stored: a template
        outlives the week it was written in.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "4XX":
          $ref: "#/components/responses/Problem"

  /templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [templates]
      operationId: getTemplate
      responses:
        "200":
          description: The template
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "4XX":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [templates]
      operationId: updateTemplate
      description: >
        Changes a template. A merge patch: a member that is not sent is not touched. The node tree
        is one member and travels whole - a tree is a shape rather than a list of settings, and
        half of one is a different shape.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: Changed
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [templates]
      operationId: deleteTemplate
      description: >
        Removes a template. A soft delete: the trees it has already stamped out are ordinary
        entries and outlive it, and a template defined later under the same name is a new template
        rather than the old one coming back.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /templates/{templateId}:instantiate:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      tags: [templates]
      operationId: instantiateTemplate
      description: >
        Stamps the template out into a collection: an entry tree whose relative dates have become
        absolute ones, anchored either at a date the request names or at the moment of the call.
        The anchor is a date rather than an instant - "+3 days for a project starting Monday" is
        about days - and it is read in the caller's own time zone.

        What the target collection cannot carry is reported rather than dropped silently: an
        assignee who cannot see it, a label it does not have. Idempotent under its Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInstantiation"
      responses:
        "201":
          description: The tree the template produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateInstance"
        "4XX":
          $ref: "#/components/responses/Problem"

  /views:
    get:
      tags: [views]
      operationId: listSavedViews
      description: >
        The saved views the caller may see. Naming a container answers the caller's own views plus
        what is shared into that container's path - the collection's, its hub's and the
        workspace-wide ones, computed in the query rather than filtered after a page. Naming none
        answers the caller's own views alone.
      parameters:
        - name: container_id
          in: query
          required: false
          description: >
            The container whose shared views are wanted, together with the caller's own. Omitted
            answers the caller's own alone.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedView"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [views]
      operationId: createSavedView
      description: >
        Saves a view: a query in the DSL of POST /items:query, the layout it is drawn in, and the
        fields the client shows. The query is validated here, against the same catalogue and the
        same bounds as an ad-hoc one and with the same codes - a saved view that failed at read
        time would be a broken bookmark nobody can repair. The layout is validated against the
        declared set (/meta/capabilities, view_layouts), stored, echoed back, and never consulted:
        what a layout looks like is the client's business, which is what makes new views possible
        without a backend change. The creator owns the view, and it starts PRIVATE unless sharing
        says otherwise, under the same rules as :share.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "4XX":
          $ref: "#/components/responses/Problem"

  /views/{viewId}:
    parameters:
      - $ref: "#/components/parameters/ViewId"
    get:
      tags: [views]
      operationId: getSavedView
      description: >
        One saved view. A view the caller may not see - another account's private view, or one
        shared into a scope the caller holds nothing on - is not found, in exactly the words a
        genuinely missing one produces.
      responses:
        "200":
          description: The view
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "4XX":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [views]
      operationId: updateSavedView
      description: >
        Changes a view's own fields. A field that is not sent is left alone. The scope and the
        sharing are not among them: where a view lives is decided when it is created, and sharing
        is :share - one decision with its own permission, not a field of an edit.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SavedViewUpdate"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [views]
      operationId: deleteSavedView
      description: >
        Deletes the view. A calendar feed that served it keeps its token and serves nothing,
        saying why - the feed's view reference nulls rather than cascading, because a feed is the
        subscriber's and a view is the workspace's.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /views/{viewId}:share:
    parameters:
      - $ref: "#/components/parameters/ViewId"
    post:
      tags: [views]
      operationId: shareSavedView
      description: >
        Decides who sees the view: PRIVATE keeps it the owner's, SCOPE shares it with everyone who
        may read the view's scope. Sharing publishes workspace furniture, so it asks the STRUCTURE
        permission on the scope's path - a view over a collection cannot be pushed onto people by
        somebody who may not shape that collection. An ACCOUNT-scoped view names no audience and
        cannot be shared. PUBLIC_LINK is declared and refused by name: the calendar feed is this
        version's only public reader and carries its own token, and a browsable public link is a
        product decision no task takes in passing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewShare"
      responses:
        "200":
          description: The view, sharing decided
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "4XX":
          $ref: "#/components/responses/Problem"

  /views/{viewId}:export:
    parameters:
      - $ref: "#/components/parameters/ViewId"
    post:
      tags: [views]
      operationId: exportView
      description: >
        The view's result, rendered whole, in one of three formats. A read with no side effect, and
        a POST for the reason POST /search is one: what a view selects is the caller's content, and
        a query string travels through access logs, proxies and browser history.

        The view executes under the **caller's** authorisation, exactly as reading it does - two
        people exporting one shared view export two different files, and neither gets a row their
        role hides (T-04, T-05).

        Synchronous and bounded rather than a job: the row cap is in /meta/capabilities as
        max_export_rows, and a result that reached it is answered whole up to the cap with the
        Export-Truncated header set. The guidelines' "202 plus /jobs/{id}" is what the cap stands
        in for while there is no /jobs resource - a truncation a caller is told about is honest,
        and a silent one is not.

        ICS renders the same document the calendar feed serves, from the same renderer: an entry
        with no due date is not a calendar entry and does not appear.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewExport"
      responses:
        "200":
          description: The rendered view
          headers:
            Export-Truncated:
              description: >
                Present and true when the result reached max_export_rows and the file is the first
                page of a larger answer. Absent otherwise.
              schema: { type: boolean }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                $ref: "#/components/schemas/ViewExportDocument"
            text/calendar:
              schema: { type: string }
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/rules:
    get:
      tags: [automation]
      operationId: listRules
      summary: The workspace's automation rules
      description: >
        Newest first, and only the rules the caller may see: a member manages their own rules, and
        an administrator the scope's (domain-model.md §3.2). Deleted rules are not among them - the
        deletion is soft so that the runs a rule produced stay readable, not so that the rule stays
        listed.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: enabled
          in: query
          required: false
          description: Narrow to the rules that are switched on, or to the ones that are not.
          schema: { type: boolean }
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRulePage"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [automation]
      operationId: createRule
      summary: Write a rule
      description: >
        A rule is created **switched off**. Enabling it is its own call and its own audit entry:
        writing what a rule would do and letting it loose on the workspace are two decisions, and
        a rule that ran the moment it was saved would give nobody the chance to read it back first.

        Writing a rule needs the automation permission at its scope **and** the rights its own
        actions need. Without the second half a member with automation rights and nothing else
        would write a rule that runs as a generously-scoped service account and does what they may
        not (automation.md §2).

        What this build refuses, and says so by code rather than by silence: a non-empty condition,
        until the expression language arrives with it; an action naming a kind automation.md §1.3
        documents and no release serves yet; a parameter the action's use case does not declare.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRuleCreate"
      responses:
        "201":
          description: Written, and switched off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    get:
      tags: [automation]
      operationId: getRule
      summary: One rule, as it stands
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "4XX":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [automation]
      operationId: updateRule
      summary: Change what a rule does
      description: >
        An omitted field is left alone. `enabled` is not among the fields: switching a rule on or
        off is its own call, so that the audit trail says which of the two somebody did rather than
        leaving it to be inferred from a change set.

        The same two-sided permission check as creating one, against the rule as it would be
        afterwards - a rule may not be edited into doing something its writer may not do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRuleUpdate"
      responses:
        "200":
          description: The rule as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [automation]
      operationId: deleteRule
      summary: Remove a rule
      description: >
        A soft delete. The rule stops matching anything at once and disappears from the listing,
        and the runs it produced stay readable: a run log whose rule vanished would be a record of
        actions nobody can account for.
      responses:
        "204":
          description: Removed
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/rules/{ruleId}:enable:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    post:
      tags: [automation]
      operationId: enableRule
      summary: Switch a rule on
      description: >
        Its own call and its own audit entry, on both sides. Letting a rule act on the workspace is
        the decision worth recording, and the permission is re-checked here rather than trusted
        from whenever the rule was written: the writer's rights may have narrowed since.

        Enabling also clears the failure counter, because a rule somebody has looked at and turned
        back on is a rule whose run of failures has been dealt with.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: On
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/rules/{ruleId}:disable:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    post:
      tags: [automation]
      operationId: disableRule
      summary: Switch a rule off
      description: >
        The rule stays, and stops acting. What a run of failures does automatically, a person can
        do deliberately - and the trail says which of the two it was.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/rules/{ruleId}:trigger:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    post:
      tags: [automation]
      operationId: triggerRuleManually
      summary: Run a rule now
      description: >
        The `MANUAL` trigger (automation.md §1.1): the one of the six a person pulls. It queues a
        run into the same engine every other trigger produces into - the conditions are evaluated,
        the actions dispatch as the rule's `run_as` account, and the loop bound and the throttle
        apply exactly as they do to an event's run.

        The run **records who pulled it**, which is the whole reason this is its own call rather
        than a flag on something else: a rule that acted because somebody asked and a rule that
        acted because a deadline passed are two different entries in the log.

        Only a rule whose trigger is `MANUAL` can be started this way, and only an enabled one.
        Both refusals name themselves rather than answering an empty success - a call that appears
        to work and does nothing is the failure `automation.md` §2.2 exists to avoid.

        The answer carries the identifier the run will have. It is a `202`: the run happens on a
        worker, so `GET /automation/runs/{runId}` answers `404` until it starts and the whole log
        afterwards.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Queued, with the identifier the run will carry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleRunAccepted"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/rules/{ruleId}:rotate-inbound-token:
    parameters:
      - $ref: "#/components/parameters/RuleId"
    post:
      tags: [automation]
      operationId: rotateInboundTrigger
      summary: Mint the address an inbound-webhook rule answers on
      description: >
        The `INBOUND_WEBHOOK` trigger's credential (automation.md §1.1): a token-protected URL per
        rule, minted here and answered **once**. It is stored hashed under its own purpose label,
        so no later read can produce it.

        Rotating is how one is revoked. There is exactly one address per rule and the replacement
        happens in a single statement, so the old token and the new one never both open the rule -
        which is what "revocable by rotating" has to mean. Somebody who wants to revoke without a
        replacement switches the rule off.

        Only a rule whose trigger is `INBOUND_WEBHOOK`. An address on any other rule would be a
        credential that opens nothing, handed out as though it worked.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Minted, with the token shown for the only time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundTriggerToken"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/inbound/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: >
          The rule's inbound token, which is the whole credential: this route carries no bearer
          authentication, and the URL is what the calling system stores. It names the tenant in
          clear inside itself because the lookup needs one before it can happen - the table is
          behind row level security like every other, and a tenant taken from a header or a query
          would be a way around it (multi-tenancy.md §2.2).
        schema: { type: string }
    post:
      tags: [automation]
      operationId: startInboundRun
      security: []
      summary: Start a rule from outside
      description: >
        The other half of the `INBOUND_WEBHOOK` trigger: an external system posts here and the
        rule's run begins, in the same engine every other trigger produces into.

        **This authenticates the rule, never a person.** There is no account behind the token and
        it grants nothing beyond starting that one rule - the run carries no actor, because naming
        one would invent an author for something nobody did. What the run may then do is its
        `run_as` account's business, checked per action exactly as it is for every other trigger.

        The body is a JSON object and enters the condition language as `payload`, as **data**: it is
        never rendered as an instruction to anything. It is bounded well below the request limit,
        because what bounds a transfer and what bounds an evaluation are two different numbers -
        anything larger is refused rather than truncated.

        An unknown token, a rotated one, a rule that has been deleted, a rule that is switched off
        and a rule whose trigger is no longer an inbound webhook all answer the same `404` with the
        same body. Distinguishing them would answer questions to whoever is trying tokens.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >
                Whatever the calling system sends, as an object. Free-form on purpose: this is the
                other system's vocabulary, and a schema here would be this system claiming to know
                it.
      responses:
        "202":
          description: Queued, with the identifier the run will carry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleRunAccepted"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/runs:
    get:
      tags: [automation]
      operationId: listRuleRuns
      summary: What the rules have done
      description: >
        Every run, newest first: which rule, which event started it, how its conditions answered,
        what each action did, and what went wrong if anything did. This is the log
        `automation.md` §2 promises - retrievable, filterable, and the only place a person can find
        out why a rule did or did not act.

        A run outlives the rule that produced it. Deleting a rule is soft for exactly this reason:
        a record of actions nobody can account for would be worse than the rule staying visible.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: rule_id
          in: query
          required: false
          description: Narrow to one rule.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: >
            Narrow to one outcome. `FAILED` and `ABORTED_LOOP` are the two an operator usually
            wants; `THROTTLED` and `SKIPPED` are the ordinary answers of a rule that is working.
          schema:
            type: string
            enum: [RUNNING, SUCCEEDED, SKIPPED, FAILED, ABORTED_LOOP, THROTTLED]
        - name: trigger
          in: query
          required: false
          description: >
            Narrow to one way of starting. "Did the schedule fire last night" and "did anybody
            press the button" are two questions about the same rule.
          schema:
            type: string
            enum: [EVENT, SCHEDULE, RELATIVE_DATE, INBOUND_WEBHOOK, MANUAL, JUMBLE_ENTRY]
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleRunPage"
        "4XX":
          $ref: "#/components/responses/Problem"

  /automation/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [automation]
      operationId: getRuleRun
      summary: One run, with every condition and every action
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleRun"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhookSubscriptions
      summary: The workspace's webhook subscriptions
      description: >
        Every subscription in the workspace, newest first, with its state and how many consecutive
        failures it has seen. The secret is not among the fields: it is answered once, at creation
        and at each rotation, and stored sealed - there is no read that can produce it again.
      responses:
        "200":
          description: The subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSubscription"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [webhooks]
      operationId: createWebhookSubscription
      summary: Subscribe an external system to the event stream
      description: >
        The `subscribe` half of the REST hooks pattern: an integration platform creates its own
        subscription through this route and deletes it again when the user turns the automation
        off.

        What arrives at the target is the CloudEvent, identical to the one this system uses
        internally - there is no feature available only internally or only externally - signed
        with a secret generated here, answered once in this response, and never readable
        afterwards.

        The target is an egress channel and is treated as one: it goes through the guarded client,
        so a private range or the cloud metadata address is refused unless the installation has
        deliberately released private networks (T-07).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionCreate"
      responses:
        "201":
          description: Subscribed, with the signing secret shown for the only time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionSecret"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [webhooks]
      operationId: getWebhookSubscription
      summary: One webhook subscription
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "4XX":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [webhooks]
      operationId: updateWebhookSubscription
      summary: Change a subscription
      description: >
        The target, the event types, the filter and the state. Re-enabling a subscription that was
        disabled for sustained unreachability is a write like any other and is audited as one -
        somebody decided the target is reachable again, and the trail says who.

        An omitted field is left alone. The secret is not changeable here; rotation has its own
        route, because handing a new secret to a subscriber is a different act from editing one.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionUpdate"
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [webhooks]
      operationId: deleteWebhookSubscription
      summary: Unsubscribe
      description: >
        The `unsubscribe` half of the REST hooks pattern. The deliveries go with the subscription:
        a delivery log for a subscription nobody can reach any more is a record of attempts against
        an address the workspace no longer knows.
      responses:
        "204":
          description: Unsubscribed
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: What was delivered, and what happened to it
      description: >
        Every attempt with its status, the response the target gave and when the next attempt is
        due. A run of eight failures ends in `DEAD_LETTER`, which is where an operator looks and
        what a replay acts on.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: Narrow to one outcome - `DEAD_LETTER` is the one an operator usually wants.
          schema:
            type: string
            enum: [PENDING, SUCCEEDED, FAILED, DEAD_LETTER]
      responses:
        "200":
          description: The deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryPage"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/webhooks/{webhookId}/deliveries/{deliveryId}:replay:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
      - $ref: "#/components/parameters/DeliveryId"
    post:
      tags: [webhooks]
      operationId: replayWebhookDelivery
      summary: Send a dead-lettered delivery again
      description: >
        The same event, sent again by hand after whatever made it fail has been fixed. The event
        identifier is the one it always had, so a subscriber that deduplicates on
        `X-Hubtask-Event-Id` sees the repeat for what it is; the attempt counter carries on rather
        than resetting, so the delivery log stays a true account of how many times this event was
        sent.
      responses:
        "202":
          description: Queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/webhooks/{webhookId}:rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Issue a new signing secret
      description: >
        Answers the new secret once, and keeps the old one verifying for a grace period. That
        overlap is the whole point of the route: a subscriber cannot deploy atomically, and a
        rotation that took effect instantly would drop every event arriving between the call and
        the deployment.

        Signatures are computed with the current secret from this moment on. What the grace period
        buys is the subscriber's side of the check, not ours.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSecretRotation"
      responses:
        "200":
          description: Rotated, with the new secret shown for the only time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionSecret"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/triggers/{eventType}:
    parameters:
      - $ref: "#/components/parameters/EventType"
    get:
      tags: [webhooks]
      operationId: pollTriggerEvents
      summary: The pull half of the event stream
      description: >
        Events of one type, oldest first, for a platform that has no address a webhook could
        reach - an n8n instance behind NAT, a Zapier polling trigger (automation.md §3.2). The
        body of each entry is the same CloudEvent a webhook subscription would have been POSTed:
        one schema, two transports, and `id` is the same value `X-Hubtask-Event-Id` carries, so a
        consumer that already deduplicates on it needs to learn nothing new.

        The cursor is opaque, signed and derived from the outbox's own ordering, so it survives a
        restart and a failover. Two polls with it neither repeat an event nor step over one.

        The window is the outbox's retention period, and a cursor older than it is refused with
        `410 gone` rather than silently answered from the beginning. A poller that missed more
        than the window has to be told that it missed - one that was quietly restarted would go
        on reporting a consistency it does not have.

        A replayed event - one a restore wrote rather than one somebody did - is not answered
        here, exactly as it is not delivered to a webhook.
      parameters:
        - name: since
          in: query
          required: false
          description: >
            Where the last poll stopped. Absent starts at the oldest event still inside the
            retention window, which is what lets a poller that has never called before catch up
            rather than begin with a gap it cannot see.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: The events, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEventPage"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/calendar-feeds:
    get:
      tags: [calendar]
      operationId: listCalendarFeeds
      description: >
        The caller's own calendar feeds, newest first - never anybody else's, whatever the role: a
        feed is a credential its owner holds, and an administrator who could list them could
        subscribe to them.

        The token is not among the fields. It is shown once, when the feed is created, and stored
        only as its hash; a feed whose token was lost is revoked and made again.
      responses:
        "200":
          description: The feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarFeed"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [calendar]
      operationId: createCalendarFeed
      description: >
        Mints a feed over one saved view, and answers its token and its URL - once. The token is
        stored as a hash keyed on the installation secret under its own purpose label, so it can
        never be replayed as a page cursor, a media token or a personal access token, and the
        stored value cannot be turned back into the token.

        The feed reads as its owner reads, evaluated at every fetch: an owner who loses access to
        half the view sees the feed narrow with them, and a revoked membership is not survived by
        a token that remembers better days.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarFeedCreate"
      responses:
        "201":
          description: Created, with the token shown for the only time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeedSecret"
        "4XX":
          $ref: "#/components/responses/Problem"

  /integrations/calendar-feeds/{feedId}:
    parameters:
      - $ref: "#/components/parameters/FeedId"
    delete:
      tags: [calendar]
      operationId: revokeCalendarFeed
      description: >
        Revokes the feed. The row stays with the moment it was revoked - which is what makes
        "this token was revoked on Tuesday" answerable - and every fetch from that moment on is a
        404 in exactly the words an unknown token produces.

        Somebody else's feed is not found rather than forbidden, for the reason every other read
        of somebody else's thing is (T-04).
      responses:
        "204":
          description: Revoked
        "4XX":
          $ref: "#/components/responses/Problem"

  /calendar/{token}.ics:
    parameters:
      - name: token
        in: path
        required: true
        description: >
          The feed's token, which is the whole credential: this route carries no bearer
          authentication, and the URL is what a calendar client stores. It names the tenant in
          clear inside itself because the lookup needs one before it can happen - the table is
          behind row level security like every other, and a tenant taken from a header or a query
          would be a way around it (multi-tenancy.md §2.2).
        schema: { type: string }
    get:
      tags: [calendar]
      operationId: getCalendarFeedDocument
      security: []
      description: >
        The calendar, as RFC 5545. Gregorian whatever the subscriber's display calendar, with an
        all-day due date as a VALUE=DATE entry and a timed one carrying its own zone so that it
        stays put across a daylight saving transition.

        Minimal by default: the title, the dates and a link back, never the notes - the restraint
        data-protection.md §9 puts on email applies here for the same reason, since a calendar
        entry is read on devices and screens nobody in this workspace controls.

        An unknown token, a revoked one, a feed whose view has been deleted and a feed whose owner
        has lost the view all answer the same 404 with the same body. Distinguishing them would
        answer questions to whoever is trying tokens.
      responses:
        "200":
          description: The calendar
          content:
            text/calendar:
              schema: { type: string }
        "4XX":
          $ref: "#/components/responses/Problem"

  /meta/capabilities:
    get:
      tags: [meta]
      operationId: getCapabilities
      summary: Self-description of the installation
      description: |
        Item types, capability profiles, field types, enum values, limits, supported locales,
        layout hints, automation triggers and actions, and event types.
        Clients configure themselves from this instead of hard-coding values.
      security: []
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /meta/health:
    get:
      tags: [meta]
      operationId: getHealthReport
      summary: Deep self-diagnosis of the installation
      description: |
        The state of every dependency, the active feature restrictions, the backlogs, and the
        configuration warnings. Deliberately answers `200` even when `status` is `degraded` -
        the HTTP status describes whether the endpoint is reachable, the `status` field
        describes the system. Requires `admin:read`; the unauthenticated probes `/healthz`,
        `/startupz` and `/readyz` live outside `/api/v1` and return only status codes.
      responses:
        "200":
          description: The diagnostic report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "403":
          $ref: "#/components/responses/Problem"


  /audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: Query audit entries
      description: |
        Requires the `audit:read` scope. Who sees what is audit.md §5 rather than the ordinary
        role matrix: an `OWNER`, an `ADMIN` or an `AUDITOR` reads the whole trail of their own
        tenant, and everybody else reads their own events - transparency towards the employee
        rather than a lesser administrator's view. A request that names somebody else's
        `actor_id` without the right to the whole trail is refused, and the refusal is itself an
        entry. Filtering by period, action, actor, target, and outcome; cursor pagination.

        A read that succeeds is not itself recorded. A trail that grew by being read would bury
        what it is for - the second page would contain the reading of the first - and §4 does not
        list reading among the mandatory events. What is recorded is the refusal, and the export.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: action, in: query, schema: { type: string }, description: "A prefix filter, e.g. auth. or membership.role_changed" }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_type, in: query, schema: { type: string }, description: "The kind of object the entry is about, e.g. container or legal_hold" }
        - { name: target_id, in: query, schema: { type: string, format: uuid }, description: "One object's whole history, whatever was done to it" }
        - { name: outcome, in: query, schema: { type: string, enum: [SUCCESS, DENIED, FAILED] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          description: The matches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Problem" }

  /audit:verify:
    post:
      tags: [audit]
      operationId: verifyAuditChain
      summary: Verify the integrity of the audit chain
      description: |
        Checks the hash chain and the absence of gaps over a period. Requires the `audit:read`
        scope and the right to the whole trail: a chain checked over one actor's entries would be
        a chain with every other entry missing, and would answer "broken" for a trail that is
        intact.

        A clean check records nothing. A break is recorded as a critical entry of its own,
        because an auditor reading the trail months later has to be able to see that somebody
        noticed, and when.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        "200":
          description: The verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  checked: { type: integer }
                  first_broken_seq:
                    type: [integer, "null"]
                    description: >
                      Where the first entry that does not hold sits. The first rather than all of
                      them, because that is where an investigation starts.
                  gaps:
                    type: array
                    items: { type: integer }
                    description: >
                      The missing sequence numbers, cut at a hundred. A chain with a hole of a
                      million entries would otherwise answer with a million integers.
                  gap_count:
                    type: integer
                    description: How many are missing in total, which may be more than `gaps` lists.
                  sealed_until:
                    type: [string, "null"]
                    format: date-time
                    description: >
                      When this tenant's chain was last anchored outside the database, and null
                      when it never was - which is every installation until external anchoring
                      exists (audit.md §3). The check proves the chain intact *inside* the
                      database; only an anchor says anything against somebody who can rewrite all
                      of it.
        "403": { $ref: "#/components/responses/Problem" }

  /audit:export:
    post:
      tags: [audit]
      operationId: exportAuditTrail
      summary: Export the audit trail over a period
      description: |
        Requires the `audit:export` scope and the right to the whole trail. The archive is
        written to a backup target - JSON Lines or CSV, with a checksum manifest and the period
        it covers - because an export over four hundred days is not something a request can
        hold; this answers a `JobRef` and the work happens in the background.

        The export produces an audit entry of its own (audit.md §5). A copy of the evidence
        leaving the installation is itself an event an auditor asks about, and it is the first
        `audit.*` action the system records about itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditExport" }
      responses:
        "202":
          description: The export was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /backup-targets:
    get:
      tags: [backup]
      operationId: listBackupTargets
      summary: List the backup targets
      responses:
        "200":
          description: The targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupTarget" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [backup]
      operationId: createBackupTarget
      summary: Create a backup target
      description: |
        Requires instance administrator rights (tenant-owned targets only when enabled).
        Credentials are stored encrypted and never returned. An unencrypted backup and the
        FTP protocol both require `insecure_acknowledged: true`.
        Auditable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /backup-targets/{targetId}:test:
    post:
      tags: [backup]
      operationId: testBackupTarget
      summary: Test the connection to the target
      description: A write/read/delete probe. Runs through the GuardedClient (SSRF protection).
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetProbe" }
        "4XX": { $ref: "#/components/responses/Problem" }

  /backup-targets/{targetId}/backups:
    get:
      tags: [backup]
      operationId: listBackupsAtTarget
      summary: List the backups present at the target
      description: |
        Reads the manifests **at the target**, not from the database. That means the listing
        works even after a total loss, as long as the target credentials are known.
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: refresh, in: query, schema: { type: boolean, default: false }, description: Bypass the cache and read again }
      responses:
        "200":
          description: The archives at the target
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupArchive" }
        "403": { $ref: "#/components/responses/Problem" }

  /backup-schedules:
    post:
      tags: [backup]
      operationId: createBackupSchedule
      summary: Create a backup schedule
      description: RRULE-based (RFC 5545), with generational retention and a `min_keep` floor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSchedule" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "400": { $ref: "#/components/responses/Problem" }

  /backups:
    post:
      tags: [backup]
      operationId: startBackup
      summary: Start a backup immediately
      description: |
        The run is a job: this answers a `JobRef` whose `result_url` is the backup run, and the
        run's id is also the archive's id in the manifest at the target. One identifier for both,
        so that a caller who has a run has an archive and needs no mapping in between.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupStart" }
      responses:
        "202":
          description: The job was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /backups/{backupId}:
    get:
      tags: [backup]
      operationId: getBackupRun
      summary: What one backup run did
      description: |
        The resource a started backup's `result_url` points at: what was written, where, how much
        of it, and whether it has been verified since. It is read from the database rather than
        from the target, so it is what a caller polls while the run is still going -
        `/backup-targets/{targetId}/backups` is the reading that survives losing the database.
      parameters:
        - { name: backupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /backups/{backupId}:verify:
    post:
      tags: [backup]
      operationId: verifyBackup
      summary: Verify an archive at the target
      description: |
        Check the checksums and decryptability without restoring. The result is recorded on the
        run as `verified_at` and `verify_ok`.
      parameters:
        - { name: backupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: The job was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /restores:
    post:
      tags: [backup]
      operationId: startRestore
      summary: Start a restore
      description: |
        A dry run (`dry_run: true`) with a report by default. Destructive modes
        (`REPLACE_TENANT`, `INSTANCE`) additionally require step-up authentication and the
        tenant name typed into `confirmation`. A restore fires no automation, sends no
        notifications, and restores no tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "202":
          description: The job was accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /restores/{restoreId}:
    get:
      tags: [backup]
      operationId: getRestoreRun
      summary: What one restore did, or is about to do
      description: |
        The resource a started restore's `result_url` points at. It carries the report of the dry
        run - how many objects are new, overwritten, skipped and in conflict - which is what
        §8.3 asks a caller to read *before* asking for the same restore without `dry_run`. It also
        names the safety copy taken before a destructive mode, so that the way back is a run
        identifier rather than a search at the target.
      parameters:
        - { name: restoreId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreRun" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: How a piece of background work is getting on
      description: >
        What a `202 Accepted` handed back is polled here. The answer is the status, how far along
        it is where the job can say so, where the result will be, and the code of the last failure
        - and nothing else the queue row holds.

        A job belongs to the tenant that asked for it and is answered to that tenant only. A job
        that belongs to no tenant - the queue's own housekeeping - is answered to nobody here, and
        is indistinguishable from one that never existed.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "4XX":
          $ref: "#/components/responses/Problem"

  /jobs/{jobId}:cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Stop a piece of background work
      description: >
        Cooperative, not a kill: it moves the job to `CANCELLED`, and a pass that is under way
        finds at its next write that the job is no longer its own and leaves nothing behind. What
        a pass already put outside the database - bytes at a backup target, a message handed to a
        mail server - a cancellation cannot take back.

        A job that has already finished, failed or been cancelled answers `409`: there is nothing
        left to stop, and pretending otherwise would let a client believe it had prevented
        something that had already happened.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The job, now cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "4XX":
          $ref: "#/components/responses/Problem"

  /trash:
    get:
      tags: [items, containers]
      operationId: listTrash
      summary: What is in the trash
      description: >
        One entry per deletion, newest first - not one per deleted row. A hub with two hundred
        entries under it went into the trash as one act and comes back as one act, so what is listed
        is the root of each deletion: the thing somebody deleted. The batch beside it is what took
        the rest, and restoring the root brings all of it back.

        The list spans hubs, so it is narrowed to what the caller may see rather than refused: an
        entry deleted out of a hub the caller has no access to is not in the page. Pages can
        therefore be shorter than the requested size; walk on until has_more is false.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPage"
        "4XX":
          $ref: "#/components/responses/Problem"

  /trash:empty:
    post:
      tags: [items, containers]
      operationId: emptyTrash
      summary: Remove everything in the trash for good
      description: >
        Irreversible, and it reaches hubs and collections as readily as entries - which is why it
        needs the owner's right to delete a container rather than the right to write entries.

        Anything under a legal hold stays, and is counted in the answer rather than failing the call.
        A large trash takes more than one pass: `matched` says how many rows this pass considered, and
        calling again continues where it left off.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: What the pass removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeSummary"
        "4XX":
          $ref: "#/components/responses/Problem"

  /legal-holds:
    get:
      tags: [retention]
      operationId: listLegalHolds
      summary: The legal holds in force
      description: |
        A hold overrides every retention rule and every deletion a person asks for, so who placed
        one and why is part of what it is. Released holds are shown too when asked for: a hold that
        has been lifted is what an auditor reads to see that it was.
      parameters:
        - { name: include_released, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The holds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LegalHold" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [retention]
      operationId: placeLegalHold
      summary: Place a legal hold
      description: |
        Stops anything under it being deleted: a retention rule, a person emptying their own trash,
        a hard delete somebody asked for. It outranks the workspace's own configured periods, which
        is why placing one is not an ordinary member's power. Auditable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalHoldCreate" }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /legal-holds/{holdId}:release:
    post:
      tags: [retention]
      operationId: releaseLegalHold
      summary: Lift a legal hold
      description: |
        Records who lifted it, when, and why. Lifting is the moment the data under it becomes
        deletable again, so the reason is required rather than optional - "released" with no reason
        is the entry an auditor cannot act on. Auditable.
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalHoldRelease" }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /retention-policies:
    get:
      tags: [retention]
      operationId: listRetentionPolicies
      summary: List the retention rules
      parameters:
        - { name: container_id, in: query, schema: { type: string, format: uuid } }
        - { name: effective, in: query, schema: { type: boolean, default: false }, description: Only the rules actually in force, including inheritance }
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RetentionPolicy" }
    post:
      tags: [retention]
      operationId: createRetentionPolicy
      summary: Create a retention rule
      description: |
        New rules start in notify-only mode if their first run would affect more than 5% of
        the holdings. Extending beyond the data kind's upper bound requires a
        `justification`. Auditable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPolicy" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
        "400": { $ref: "#/components/responses/Problem" }

  /retention-policies/{policyId}:preview:
    post:
      tags: [retention]
      operationId: previewRetentionPolicy
      summary: Determine the effect of a rule without executing it
      parameters:
        - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: integer }
                  blocked:
                    type: object
                    additionalProperties: { type: integer }
                    description: "The reasons for blocking, e.g. legal_hold, restriction, tombstone_window"
                  share_of_scope: { type: number, description: The share of the holdings (0..1) }
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        effective_at: { type: string, format: date-time }

  /items/{itemId}:retain:
    post:
      tags: [retention]
      operationId: retainItem
      summary: Take an object out of the running retention period
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItem" }
        "404": { $ref: "#/components/responses/Problem" }

  /sync:pull:
    post:
      tags: [sync]
      operationId: syncPull
      summary: Fetch the changes since the cursor
      description: |
        Returns upserts, tombstones, and revocations in a stable order. The cursor is opaque.
        If it is older than the minimum tombstone period, the server answers
        `sync.cursor_too_old`; the client must then resynchronise completely.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPullRequest" }
      responses:
        "200":
          description: The changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "409":
          $ref: "#/components/responses/Problem"

  /sync:push:
    post:
      tags: [sync]
      operationId: syncPush
      summary: Transmit local mutations
      description: |
        Idempotent through `op_id`. Merging happens per field; set fields as OR-sets and
        positions as fractional indices. Partial success is the normal case: rejected
        mutations do not block the others.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: The result per mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "400": { $ref: "#/components/responses/Problem" }

  /sync/devices:
    get:
      tags: [sync]
      operationId: listSyncDevices
      summary: List your own devices
      responses:
        "200":
          description: The devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncDevice" }

  /accounts:invite:
    post:
      tags: [identity]
      operationId: inviteAccount
      summary: Invite a person into this workspace
      description: |
        Creates an account in `INVITED` status. Permissions can be granted to it immediately;
        it cannot act until the invitation is accepted, which needs the sign-in flow (`0.6.0`).
        The notification is queued as a job — this call does not wait for an email.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInvite"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "4XX":
          $ref: "#/components/responses/Problem"

  /accounts/{accountId}/preferences:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    patch:
      tags: [identity]
      operationId: updateAccountPreferences
      summary: Set how the product speaks to an account
      description: |
        Locale, time zone and the first day of the week. An empty value clears the preference,
        which means the workspace default applies again — the second link of the resolution chain
        request → account → tenant → installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPreferences"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "4XX":
          $ref: "#/components/responses/Problem"

  /auth/tokens:
    get:
      tags: [auth]
      operationId: listAccessTokens
      summary: The caller's own personal access tokens
      description: >
        One's own tokens, newest first, with the scopes each carries, when it expires, when it was
        last used and whether it was revoked. Never anybody else's: a token is a credential its
        holder holds, and an administrator who could list one could not use it but could learn
        exactly which of somebody's automations to attack.

        The token itself is not among the fields. It is answered once, at creation, and stored
        only as a hash keyed on the installation secret; a token that was lost is revoked and
        minted again.

        A service account's tokens are listed here too, by naming it - which is the one exception,
        and needs the permission that manages members, because a service account is nothing but
        access and somebody has to answer for it.
      parameters:
        - name: account_id
          in: query
          required: false
          description: >
            Whose tokens. Omitted means the caller's own. Naming a service account answers its
            tokens and needs the member management permission; naming another person is refused,
            whatever the role.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [auth]
      operationId: createAccessToken
      summary: Mint a personal access token
      description: >
        Answers the credential, in clear, for the only time. What is stored is its hash keyed on
        the installation secret under its own purpose label, so a hash from here can never be
        replayed as a signed cursor or a calendar feed token, and nothing can turn the stored
        value back into the token.

        The expiry is mandatory and at most a year out. There is no default: a caller has to say
        how long the credential should live, because the alternative is a credential nobody ever
        revokes.

        The scopes are requested explicitly and are never defaulted to everything. Each has to be
        one the installation declares - the manifest at `/meta/capabilities` lists them - and a
        token can never do more than its holder may, whatever it asks for: the scope is a second
        bound on top of the role, not a grant.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenCreate"
      responses:
        "201":
          description: Minted, with the credential shown for the only time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenSecret"
        "4XX":
          $ref: "#/components/responses/Problem"

  /auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [auth]
      operationId: revokeAccessToken
      summary: Revoke a personal access token
      description: >
        Takes effect on the next call: the hash is checked against the row on every request, so a
        revoked token refuses immediately rather than at the end of some cache's life.

        The row stays, stamped with the moment it was withdrawn, and that stamp is separate from
        the expiry - "it ran out" and "somebody pulled it" are different answers to "why did this
        stop working", and a reader of the trail is owed both.

        Revoking twice is not an error; somebody else's token is not found rather than forbidden.
      responses:
        "204":
          description: Revoked
        "4XX":
          $ref: "#/components/responses/Problem"

  /auth/service-accounts:
    get:
      tags: [auth]
      operationId: listServiceAccounts
      summary: The workspace's service accounts
      description: >
        The accounts that exist only to be acted through: an integration, a script, a rule that
        has to keep running after the person who wrote it has left. Needs the permission that
        manages members, because that is the person who answers for who holds access.
      responses:
        "200":
          description: The service accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [auth]
      operationId: createServiceAccount
      summary: Create a service account
      description: >
        Creates an account of kind `SERVICE_ACCOUNT`: no mail address, no sign-in anywhere, and
        tokens as its only credential. It holds rights the way a person does - through
        memberships granted to it - and it is what an automation rule runs as, so that a rule
        does not die with its author's departure.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAccountCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "4XX":
          $ref: "#/components/responses/Problem"

  /privacy/requests:
    get:
      tags: [privacy]
      operationId: listDataSubjectRequests
      summary: The data subject requests this workspace is handling
      description: |
        Newest first, the open ones by default. A right somebody exercised is a case with a
        statutory deadline, and this is the list whoever answers for it reads - which is why the
        overdue ones can be asked for on their own (`data-protection.md` §4).
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DataSubjectRequestStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/DataSubjectRequestKind" } }
        - name: due_within_days
          in: query
          schema: { type: integer }
          description: Only the requests whose deadline falls inside that many days, overdue ones included.
        - { name: include_closed, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: One page of the cases
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DataSubjectRequest" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [privacy]
      operationId: createDataSubjectRequest
      summary: Record a right somebody has exercised
      description: |
        Opens the case with its statutory deadline - thirty days from receipt unless the caller
        names a different one, because the period is a legal matter and an installation may have
        to answer sooner. Nothing is collected, exported or erased by this call: what happens next
        is the controller's decision, taken by moving the case to `IN_PROGRESS`.

        `RECTIFICATION` is accepted as a tracked case although a correction is an ordinary write:
        the schema has allowed the kind since phase 0, and a deadline somebody is answerable for is
        worth recording whether or not the work needs a special path.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSubjectRequestCreate" }
      responses:
        "201":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "4XX":
          $ref: "#/components/responses/Problem"

  /privacy/requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [privacy]
      operationId: updateDataSubjectRequest
      summary: Move a case along
      description: |
        The state machine is `RECEIVED → IN_PROGRESS → COMPLETED | REJECTED`, and an illegitimate
        transition is refused by name rather than ignored. Moving an `ACCESS`, `PORTABILITY` or
        `ERASURE` case to `IN_PROGRESS` is what starts the work: the archive or the erasure runs as
        a job, and the case is completed by that job rather than by a second call.

        An erasure needs its mode before it can start - `ANONYMIZE` keeps the authorship as a
        former user and the workspace's content with it, `FULL_DELETE` takes the person's own
        contributions too. The choice rests with the controller, because tenant data touches third
        parties' rights (ADR-0018).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSubjectRequestUpdate" }
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "4XX":
          $ref: "#/components/responses/Problem"

  /accounts/{accountId}:restrict:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [privacy]
      operationId: restrictProcessing
      summary: Restrict the processing of an account's data (Art. 18)
      description: |
        A technical state rather than a lock: the account stays readable and its content stays
        where it is, and what stops is *processing* - automation rules and AI leave the record
        alone (`data-protection.md` §4, arc42 §8.15). Lifting it is the same call with
        `restricted: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessingRestriction" }
      responses:
        "200":
          description: The state that was set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingState" }
        "4XX":
          $ref: "#/components/responses/Problem"

  /privacy/consents:withdraw:
    post:
      tags: [privacy]
      operationId: withdrawConsent
      summary: Withdraw consent for an optional processing purpose (Art. 21)
      description: |
        Objection, as the one thing it can technically be: the optional processing stops and the
        core features keep working. A withdrawal is recorded rather than deleted - the record that
        somebody consented, and when they took it back, is what an operator needs in order to show
        which processing was lawful when.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentWithdrawal" }
      responses:
        "200":
          description: The consent record after the withdrawal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentRecord" }
        "4XX":
          $ref: "#/components/responses/Problem"

  /memberships:
    post:
      tags: [identity]
      operationId: grantMembership
      summary: Grant a role at a scope
      description: |
        To an account or to a group, never both. The role applies downwards from the scope:
        a role at a hub applies to its collections and their items.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipGrant"
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "4XX":
          $ref: "#/components/responses/Problem"

  /memberships/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/MembershipId"
    delete:
      tags: [identity]
      operationId: revokeMembership
      summary: Take a role away
      description: |
        Takes effect on the next request. What the account holds through a group is unaffected —
        that is the group's membership, revoked separately.
      responses:
        "204":
          description: Revoked
        "4XX":
          $ref: "#/components/responses/Problem"

  /groups:
    post:
      tags: [identity]
      operationId: createGroup
      summary: Create a group
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "4XX":
          $ref: "#/components/responses/Problem"

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    patch:
      tags: [identity]
      operationId: updateGroup
      summary: Rename a group or change its description
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: The group
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [identity]
      operationId: deleteGroup
      summary: Delete a group
      description: |
        Its memberships go with it: what the group granted, nobody holds afterwards. Members of
        the group keep whatever they hold in their own right.
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers:
    get:
      tags: [containers]
      operationId: listContainers
      parameters:
        - $ref: "#/components/parameters/ContainerTypeFilter"
        - $ref: "#/components/parameters/ParentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200":
          description: A page of containers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerPage"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [containers]
      operationId: createContainer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    get:
      tags: [containers]
      operationId: getContainer
      responses:
        "200":
          description: The container
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [containers]
      operationId: renameContainer
      description: >
        Changes a container's own descriptive fields. A field that is not sent is left alone;
        sending description, icon or color_token as null clears it. The name stays unique among the
        containers at the same level. The policies are not here - they are their own sub-resource,
        so that a rename and a change of the way a collection works are two operations with two
        audit entries.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ContainerUpdate"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [containers]
      operationId: trashContainer
      description: >
        A soft delete: the hub or collection and everything under it move to the trash under one
        deletion - a hub takes its collections, and every collection takes its entries. It all stays
        for the tenant's trash retention period, 30 days by default, and comes back as one act
        through :restore until the retention job removes it for good. Anything already in the trash
        from an earlier deletion keeps that deletion rather than joining this one. Needs the owner's
        right to delete a container. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Moved to the trash
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}/policies:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    put:
      tags: [containers]
      operationId: updateContainerPolicies
      description: >
        Replaces a collection's policies - the way it works, as opposed to what it is called. A key
        that is not sent falls back to its default rather than keeping the stored value: this is a
        PUT, and a document that partly remembers what it replaced is one nobody can reason about.
        A hub carries no policies and is refused.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerPolicies"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}:move:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    post:
      tags: [containers]
      operationId: moveContainer
      description: >
        Moves a collection into another hub, and ranks it there. The name has to be free at the
        destination; a collision is refused rather than resolved. A hub sits in nothing and cannot
        be moved.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_parent_id]
              properties:
                target_parent_id:
                  type: string
                  format: uuid
                  description: The hub the collection moves into. Naming the one it is in reorders it there.
                before_container_id:
                  type: [string, "null"]
                  format: uuid
                  description: >
                    The sibling to place this collection before at the destination. Null or omitted
                    appends to the end of the level.
      responses:
        "200":
          description: Moved
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}:restore:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    post:
      tags: [containers]
      operationId: restoreContainer
      description: >
        Takes one container deletion back out of the trash, whole: the hub, its collections, and
        every entry that went in with them. Exactly what went in together comes back - a separate,
        younger deletion inside the same subtree stays where it is, because a restore is keyed on the
        deletion rather than on the subtree. A container archived when it was deleted comes back
        archived. Needs the same right as the deletion, which is the owner's. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Restored
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}:archive:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    post:
      tags: [containers]
      operationId: archiveContainer
      description: >
        Archives the container. An archived container is read-only, and everything below it inherits
        that: a collection in an archived hub refuses writes without being archived itself, which is
        what effective_archived reports. Idempotent - archiving an archived container changes
        nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Archived
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}:unarchive:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    post:
      tags: [containers]
      operationId: unarchiveContainer
      description: >
        Makes the container writable again. A collection that was archived in its own right stays
        archived when its hub is unarchived - unarchiving restores what was archived, not what was
        merely covered by it. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unarchived
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items:
    get:
      tags: [items]
      operationId: listWorkItems
      description: |
        The items of one level, in their manual order: the items directly in the collection when
        `parent_id` is omitted, and the children of that item when it is given. A whole subtree,
        and every other filter, is what `POST /items:query` is for.
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/ParentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IncludeArchived"
        - $ref: "#/components/parameters/Expand"
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemPage"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [items]
      operationId: createWorkItem
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: getWorkItem
      parameters:
        - $ref: "#/components/parameters/Expand"
      responses:
        "200":
          description: The item
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [items]
      operationId: updateWorkItem
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/WorkItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "409":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [items]
      operationId: trashWorkItem
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Moved to the trash
        "4XX":
          $ref: "#/components/responses/Problem"

  /items:query:
    post:
      tags: [items]
      operationId: queryItems
      summary: The generic query - the basis for list, kanban, and timeline
      description: |
        One filter grammar behind every view. A `POST` because the query is a document rather than
        a set of parameters, and it reads: nothing is written, and the same request may be repeated.

        The query is always anchored to a scope the caller names, and the permission is checked
        against that scope once - a refusal is a refusal rather than an empty result. Which fields
        may be filtered, sorted and grouped, and with which operators, is answered by
        `GET /meta/capabilities` under `query_fields`; a field that is not in that list is refused
        with `query.field_unknown` rather than ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemQuery"
      responses:
        "200":
          description: The result, optionally grouped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemQueryResult"
        "422":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /search:
    post:
      tags: [items]
      operationId: searchItems
      summary: Full-text search over the entries a caller may see
      description: |
        Finds entries by the words in their titles and notes, best match first. A `POST` for the
        reason the query is one - the request is a document rather than a set of parameters - and
        it reads: nothing is written, and the same request may be repeated.

        Two languages are in play and they are different questions. An entry is indexed under the
        language it was written in (`content_language`), so a German entry is found by an inflected
        German word and an English one by a stemmed English word. The *query* is read under the
        caller's language, which is this request's `language` or the caller's locale. An entry that
        states no language is matched word by word and is found by any caller. Which languages this
        installation can index at all is answered by `GET /meta/capabilities` under
        `text_languages`; a language it has no configuration for searches word by word rather than
        failing.

        A script without word boundaries - Japanese, Chinese, Korean, Thai - additionally matches on
        substrings, because a run of such characters is one token and no word search can find part
        of it.

        Unanchored unless a container is named, and this is the one read of the API that is: it
        answers what the caller may see rather than refusing what they may not, so a page can be
        shorter than the size asked for. Walk on until `has_more` is false rather than stopping at
        the first short page. Naming a hub is the exception - a client that named a hub it cannot
        read is told so.

        A `POST` and no `GET`. What somebody is looking for is their content, and a query string
        travels through access logs, proxies and browser history; the same words in a body do not
        (security.md §9, ADR-0018). What is searched today is entries - tasks, work packages and
        activities - which is what `searchItems` says; a later milestone that makes containers or
        comments searchable widens this operation rather than adding a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemSearchQuery"
      responses:
        "200":
          description: The hits, best match first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemPage"
        "422":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:complete:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: completeWorkItem
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cascade_children:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Completed
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:reopen:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: reopenWorkItem
      description: >
        Marks a completed item open again. Idempotent: reopening an item that is already open
        succeeds and changes nothing. Where the collection's completion policy rolls up, reopening an
        item also reopens the completed items above it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reopened
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:assign:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: assignWorkItem
      description: >
        Gives the entry an assignee. Every type carries one, an activity exactly this and no member
        list. The account has to be able to see the entry - it has to hold a membership somewhere on
        the path above it - and one that cannot is refused rather than stored, with the same answer
        for an account of another tenant and one that does not exist. Idempotent: assigning the
        person who is already assigned succeeds and announces nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
      responses:
        "200":
          description: Assigned
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:unassign:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: unassignWorkItem
      description: >
        Takes the assignee off the entry. Idempotent: an entry nobody is assigned to succeeds and
        announces nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Unassigned
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:auto-assign:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: autoAssignWorkItem
      description: >
        Hands the entry out by the collection's assignment policy - FIXED, RANDOM_MEMBER,
        RANDOM_GROUP_MEMBER, ROUND_ROBIN or LEAST_LOADED - instead of naming a person. Refused
        when the collection has no policy configured. Candidates who cannot see the entry are
        skipped; a policy with nobody eligible leaves the entry as it is and says so in the
        response's auto_assign object rather than failing. An explicit call uses the policy
        whether or not it is enabled - enabled decides only whether it applies itself on create.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Handed out by policy, or left as it was with the reason in auto_assign
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:purge:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: purgeWorkItem
      description: >
        Removes an entry in the trash and everything under it for good, before its retention period
        is up. Irreversible: no restore brings it back, and a backup taken before it does not either
        - the deletion journal sees to that. Refused for an entry that is not in the trash; delete
        it first, which is reversible. Refused while a legal hold is in force over it, and the answer
        says at which level.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Removed for good
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:restore:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: restoreWorkItem
      description: >
        Takes one deletion back out of the trash, whole. Exactly the entries that went in together
        come back: a separate, younger deletion inside the same subtree stays where it is, because a
        restore is keyed on the deletion rather than on the subtree. An entry that was archived when
        it was deleted comes back archived - restoring undoes the deletion and nothing else. Refused
        while the entry above it, or its collection, is still in the trash; the answer names what to
        restore first. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Restored
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:archive:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: archiveWorkItem
      description: >
        Archives the entry: it is kept and becomes read-only. Distinct from the trash, which is a
        deletion with a retention period running against it - an archived entry stays until somebody
        says otherwise. Nothing below it is archived with it: an entry's children are entries in
        their own right, unlike the collections of a hub. Idempotent - archiving an archived entry
        succeeds and changes nothing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Archived
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:unarchive:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: unarchiveWorkItem
      description: >
        Makes an archived entry writable again. Refused for an entry in the trash: restore it first,
        and the answer says so. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unarchived
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:reorder:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: reorderWorkItem
      description: >
        Moves the item within its own level. The position is given as the item to place it before;
        omitting it appends to the end. The rank is a fractional index, so an insertion between two
        neighbours renumbers nothing else and two offline devices can insert into the same list without
        either one's order being discarded.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before_item_id:
                  type: [string, "null"]
                  format: uuid
                  description: >
                    The sibling to place this item before. Null or omitted appends to the end of the
                    level.
      responses:
        "200":
          description: Reordered
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:move:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: moveWorkItem
      description: Moves the item and its subtree; checks the capability profile and reference resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_parent_id:
                  type: [string, "null"]
                  format: uuid
                  description: >
                    The item to move this one under. Null moves it to the top level of a collection,
                    which then has to be named by target_collection_id.
                target_collection_id:
                  type: string
                  format: uuid
                  description: >
                    The destination collection. May be omitted when target_parent_id is given: an
                    item's collection is the one its parent is in.
                target_bucket_id:
                  type: [string, "null"]
                  format: uuid
                before_item_id:
                  type: [string, "null"]
                  format: uuid
                  description: >
                    The sibling to place this item before at the destination. Null or omitted appends.
      responses:
        "200":
          description: Moved
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveResult"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}:duplicate:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: duplicateWorkItem
      description: >
        Copies the entry, and everything below it when `include_subtree` is set. The copy is a new
        entry rather than a fork of a conversation: the description travels - the notes, the labels,
        the members, the assignee, the attachments and the custom field values, as far as the
        capability profile of each type allows - and the comments and the history do not.


        What the destination cannot resolve is reported rather than dropped in silence, exactly as a
        move reports it (invariant I-W6): a copy into another collection leaves behind the labels of
        the vocabulary it came from, the column of the board it sat on, and the values of custom
        fields that collection does not define.


        The copy is open and carries fresh ranks at the end of its level; an entry that was archived
        below the copied one stays archived in the copy, and trashed entries are not copied at all.
        The title is copied unchanged - a server that invented "Copy of …" would be writing display
        text (ADR-0011) - so a client that wants a different one sends it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_subtree:
                  type: boolean
                  default: false
                  description: >
                    Whether everything below the entry is copied with it. Omitted copies the entry
                    alone, and its children stay where they are.
                target_parent_id:
                  type: [string, "null"]
                  format: uuid
                  description: >
                    The entry the copy sits under. Null puts it at the top level of a collection,
                    which then has to be named by target_collection_id; omitted puts the copy beside
                    the original.
                target_collection_id:
                  type: string
                  format: uuid
                  description: >
                    The destination collection. May be omitted when target_parent_id is given: an
                    entry's collection is the one its parent is in.
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: The title of the copy. Omitted keeps the original's.
      responses:
        "201":
          description: Duplicated
          headers:
            ETag:
              schema: { type: string }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateResult"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items:bulk:
    post:
      tags: [items]
      operationId: bulkUpdateWorkItems
      description: |
        Up to 500 operations, each of them one of the operations this API offers on an entry
        singly, applied in the order they are sent. The answer is HTTP 200 with a result per
        operation, and the status of each operation is in that result: a bulk that half succeeded
        is not a failed request, and a client reads what happened per operation rather than from
        one status covering 500 of them.

        An operation applies exactly as it would on its own - its own permission check, its own
        event, its own entry in the item's history and its own per-field records for offline
        clients. One event covering 500 entries would break a merge in a way nothing downstream
        recovers from, and one history entry for a bulk hides what the history exists to show.

        `atomic: true` makes it all or nothing: the first refusal rolls the whole bulk back and
        every result reports what happened, the refusal in its place and the rest as not applied.
        Without it, the operations that succeeded stay applied and the ones that failed carry their
        problem.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                atomic:
                  type: boolean
                  default: false
                  description: >
                    All or nothing. Without it a bulk applies what it can and reports the rest.
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/BulkOperation"
      responses:
        "200":
          description: >
            The result per operation, in the order the operations were sent. HTTP 200 says the bulk
            was carried out, never that every operation in it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkResult"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/comments:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [comments]
      operationId: listComments
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The comments, oldest first - a conversation reads top down. Deleted ones
            are in it as tombstones with a null body, so a reply never dangles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [comments]
      operationId: addComment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
                parent_comment_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [comments]
      operationId: editComment
      description: >
        Rewrites a comment's text. Only its author or an administrator may; anybody else is
        refused exactly as any other missing permission is. The displaced text is not preserved -
        an edit is last writer wins over the body - and a deleted comment cannot be edited back
        into existence.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
      responses:
        "200":
          description: Edited
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [comments]
      operationId: deleteComment
      description: >
        Removes a comment's text and marks it deleted, keeping the thread readable: the comment
        still answers with its identifier, author and timestamps, so a reply does not dangle. Only
        the author or an administrator may. Idempotent - deleting a deleted comment succeeds and
        announces nothing.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/activity:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: listActivity
      description: >
        The entry's own history, newest first: who did what, and when. It is the product's record
        and not the audit trail - it is readable by whoever may read the entry, and it is deleted
        with the entry (audit.md §1). Each step carries a message code rather than a sentence, and
        the client renders it (ADR-0011). For an activity the history is compact: the code, the
        actor and the time, without the fields that moved.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}/buckets:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    get:
      tags: [structure]
      operationId: listBuckets
      responses:
        "200":
          description: The collection's buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bucket"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [structure]
      operationId: createBucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}/buckets/{bucketId}:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
      - $ref: "#/components/parameters/BucketId"
    patch:
      tags: [structure]
      operationId: updateBucket
      description: >
        Changes a column's own fields. A field that is not sent is left alone; sending color_token
        as null clears it, and sending wip_limit as null or 0 removes the limit. The name stays
        unique in the collection. Where the column sits is not here - that is :reorder, so that a
        rename and a rearrangement are two operations with two audit entries.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/BucketUpdate"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [structure]
      operationId: deleteBucket
      description: >
        Takes the column off the board. Its entries are not deleted with it: they move to the
        leftmost remaining column, or out of any column when this was the last one. What became of
        them is in the answer rather than left to be discovered.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Deleted, with what became of the entries that were in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketDeletion"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}/buckets/{bucketId}:reorder:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
      - $ref: "#/components/parameters/BucketId"
    post:
      tags: [structure]
      operationId: reorderBucket
      description: >
        Moves a column along its board. An absent before_bucket_id moves it to the right hand end.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before_bucket_id:
                  type: [string, "null"]
                  format: uuid
                  description: The column this one goes to the left of. Absent is the right hand end.
      responses:
        "200":
          description: Moved
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}/labels:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
    get:
      tags: [structure]
      operationId: listLabels
      responses:
        "200":
          description: The collection's labels, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [structure]
      operationId: createLabel
      description: >
        Adds a label to a collection's vocabulary. The name has to be free in the collection,
        compared without regard to case or accents. The colour is required: a label is rendered as
        a chip and nothing else, so with none a client would have to invent one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "4XX":
          $ref: "#/components/responses/Problem"

  /containers/{containerId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/ContainerId"
      - $ref: "#/components/parameters/LabelId"
    patch:
      tags: [structure]
      operationId: updateLabel
      description: >
        Changes a label's own fields. A field that is not sent is left alone; sending description as
        null clears it. The colour cannot be cleared - a label is rendered as a chip and nothing
        else. The name stays unique in the collection.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/LabelUpdate"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [structure]
      operationId: deleteLabel
      description: >
        Takes the label out of the collection's vocabulary. The entries that carried it are not
        rewritten: they stop showing it because it is gone, which is what makes the deletion
        undoable without having to remember who wore it.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/LabelId"
    put:
      tags: [items]
      operationId: addLabel
      description: >
        Puts a label on an entry. Idempotent: an entry that already carries it succeeds. The label
        has to belong to the entry's own collection - a label is a vocabulary one collection agreed
        on - and the entry's type has to carry the LABELS capability.
      responses:
        "200":
          description: The labels the entry now carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLabels"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [items]
      operationId: removeLabel
      description: >
        Takes a label off an entry. Idempotent: an entry that does not carry it succeeds.
      responses:
        "200":
          description: The labels the entry now carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLabels"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/members/{accountId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/AccountId"
    put:
      tags: [items]
      operationId: addMember
      description: >
        Puts an account on an entry's member list. Idempotent: an entry that already carries it
        succeeds. The account has to be able to see the entry - it has to hold a membership somewhere
        on the path above it - and the entry's type has to carry the MEMBERS capability, which an
        activity does not: an activity has one assignee and no member list.
      responses:
        "200":
          description: The members the entry now carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMembers"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [items]
      operationId: removeMember
      description: >
        Takes an account off an entry's member list. Idempotent: an entry that does not carry it
        succeeds.
      responses:
        "200":
          description: The members the entry now carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMembers"
        "4XX":
          $ref: "#/components/responses/Problem"

  /custom-fields:
    get:
      tags: [structure]
      operationId: listCustomFields
      description: >
        The custom field definitions in force, by key. Naming a collection answers the ones that
        apply inside it: its own, and the workspace-wide ones above it. Naming none answers the
        workspace-wide ones alone. Deleted definitions are not in the answer - their values stay in
        the entries and stop being visible, which is what makes the deletion undoable.
      parameters:
        - name: collection_id
          in: query
          required: false
          description: >
            The collection whose definitions are wanted, together with the workspace-wide ones.
            Omitted answers the workspace-wide ones alone.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomFieldDefinition"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [structure]
      operationId: defineCustomField
      description: >
        Defines a custom field. The key has to be free in its scope - a collection's keys are free
        of each other's and of the workspace-wide ones - and it is an identifier rather than a
        label: lower case, digits and underscores, and it never changes afterwards. Which types
        carry the field is `applies_to`, bounded by the CUSTOM_FIELDS capability: an activity has
        no custom fields, so naming one is refused.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFieldDefinitionCreate"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDefinition"
        "4XX":
          $ref: "#/components/responses/Problem"

  /custom-fields/{fieldId}:
    parameters:
      - $ref: "#/components/parameters/CustomFieldId"
    patch:
      tags: [structure]
      operationId: updateCustomField
      description: >
        Changes what a definition permits. A field that is not sent is left alone. The key and the
        kind are not among them: a key that moved would orphan every value stored under it, and a
        kind that changed would reinterpret them - both are a new definition rather than an edit.
        Narrowing the options of a SELECT does not rewrite the entries that hold a value which is
        no longer offered; they keep it until somebody sets the field again.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CustomFieldDefinitionUpdate"
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDefinition"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [structure]
      operationId: deleteCustomField
      description: >
        Takes the definition out of use. A soft delete: the values stay in the entries and stop
        being visible, because rewriting `custom_fields` across every entry in a collection would
        be an unbounded write from one request. A definition recreated under the same key is a new
        definition and shows none of what the old one held.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/custom-fields/{key}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/CustomFieldKey"
    put:
      tags: [items]
      operationId: setCustomField
      description: >
        Writes one custom field on an entry. The value is validated against the definition in force
        - a SELECT value outside its options, a NUMBER arriving as a string, a USER pointing at an
        account of another workspace are each `validation_failed` with the field path, never a
        stored value. Sending null clears the key. One key per call, because the merge rule is per
        key: two devices setting two different keys converge to both.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFieldValue"
      responses:
        "200":
          description: The entry, the field written
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/cover:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [items]
      operationId: setCover
      description: >
        Puts a cover on the entry: a colour token, or an image by its media identifier. Only a
        type whose profile carries the COVER capability has one - by default a task, and neither
        a work package nor an activity. An image has to be a READY media object of usage COVER in
        this workspace. Replacing a cover is this call again; the displaced image loses a
        reference and is cleaned up by the reconciliation job once nothing points at it.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverInput"
      responses:
        "200":
          description: The entry, cover set
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [items]
      operationId: clearCover
      description: >
        Takes the cover off the entry. Idempotent: an entry with no cover succeeds and announces
        nothing.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The entry, cover cleared
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/due:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      tags: [items]
      operationId: setDueDate
      description: >
        Puts a due date on the entry: the instant, the all-day flag, and the IANA zone, written
        together because the three describe one date (i18n-l10n.md §4). An all-day due date is a
        date in the given zone, never a midnight that shifts with the viewer. A zone that is not
        an IANA name is refused. Moving a due date is this call again. The same three fields on
        the create and update paths dispatch into this writer, so a due date means the same thing
        whichever door it came through.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DueDateInput"
      responses:
        "200":
          description: The entry, due date set
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [items]
      operationId: clearDueDate
      description: >
        Takes the due date off the entry - the instant, the all-day flag and the zone together,
        because none of them means anything alone. Idempotent: an entry with no due date succeeds
        and announces nothing.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The entry, due date cleared
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/recurrence:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [recurrence]
      operationId: getRecurrence
      description: >
        The entry's series, or 404 when it has none. The resource table of api-guidelines.md §2
        named only the writers; a rule a client can set and never read back is one it cannot show,
        so the read is here and the table says so too (D-04).
      responses:
        "200":
          description: The rule
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "4XX":
          $ref: "#/components/responses/Problem"
    put:
      tags: [recurrence]
      operationId: setRecurrence
      description: >
        Puts a series on the entry, or changes the one it has - the same call for both, because a
        rule is one thing an entry either carries or does not. Only a TASK may carry one: a series
        applies to the whole subtree, so a work package or an activity is refused with
        capability_not_supported.

        The rule is RFC 5545 and needs its IANA zone: daylight saving is resolved through the zone
        and never through an offset, which is what keeps 09:00 at 09:00 across a transition. A rule
        the library cannot parse, a rule without a zone, and a rule whose expansion inside its own
        horizon exceeds the bound in /meta/capabilities are each refused with a field error rather
        than stored and discovered by the scheduler.

        Nothing is materialised here. The occurrences follow in a later version of this
        installation; what this call does is store the rule.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrenceInput"
      responses:
        "200":
          description: The rule, set or changed
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [recurrence]
      operationId: removeRecurrence
      description: >
        Takes the series off the entry. Occurrences that were already materialised stay exactly
        where they are: they are ordinary entries the moment they exist, and deleting somebody's
        next three weeks because they stopped a series would be a deletion nobody asked for.
        Idempotent - an entry with no series succeeds and announces nothing.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Removed
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/recurrence:skip:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [recurrence]
      operationId: skipOccurrence
      description: >
        Skips the next occurrence the series has not produced yet: the one after the last one
        materialised, or - for a series that has produced none - the first one after the entry's
        own due date. Nothing that already exists is touched, because a materialised occurrence is
        an ordinary entry and skipping it would be deleting somebody's work.

        Idempotent under its Idempotency-Key, and repeatable without one: calling it twice skips
        two occurrences, which is what "skip the next one" means said twice. The answer is the rule
        with its bookkeeping moved on.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The rule, its next occurrence skipped
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recurrence"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/reminders:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [reminders]
      operationId: listReminders
      description: >
        The entry's reminders, oldest first. Readable by whoever may read the entry, and unpaged:
        an entry carries at most max_reminders_per_item of them, which is the bound that makes a
        page unnecessary rather than an omission.
      responses:
        "200":
          description: The entry's reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "4XX":
          $ref: "#/components/responses/Problem"
    post:
      tags: [reminders]
      operationId: createReminder
      description: >
        Puts a reminder on the entry. offset_spec has two forms and no third: REL:<duration> is an
        ISO-8601 duration counted from the due date, so the entry needs one - without it there is
        no moment to fire at - and ABS:<instant> is a fixed moment no due date moves. A preset is
        a client's vocabulary for a common offset; what travels is the offset itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/reminders/{reminderId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/ReminderId"
    patch:
      tags: [reminders]
      operationId: updateReminder
      description: >
        Changes a reminder. A merge patch: a field that is not sent is not touched, and each field
        that moves is its own change log entry, so two devices editing the offset and the channels
        converge to both (offline-sync.md §4.2). Recipients and channels are chosen whole - the
        list sent replaces the list stored.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Changed
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [reminders]
      operationId: deleteReminder
      description: >
        Removes the reminder. A hard delete of one row: a reminder is created and deleted whole,
        and what a person deleted is gone rather than kept as a tombstone with a state - so a
        second deletion answers 404, the same answer any other missing sub-resource gives, rather
        than pretending to have removed something twice.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/attachments:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: listAttachments
      description: >
        The entry's attachments as media objects, oldest first. Readable by whoever may read the
        entry.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "4XX":
          $ref: "#/components/responses/Problem"

  /items/{itemId}/attachments/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/MediaId"
    put:
      tags: [items]
      operationId: attachMedia
      description: >
        Attaches a media object to the entry. Idempotent: an entry that already carries it
        succeeds. The object has to be READY, of usage ATTACHMENT and of this workspace, and the
        entry's type has to carry the ATTACHMENTS capability - an activity does not. Attaching
        raises the object's reference count; the bytes are shared, never copied.
      responses:
        "200":
          description: The attachments the entry now carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemAttachments"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [items]
      operationId: detachMedia
      description: >
        Takes a media object off the entry. Idempotent: an entry that does not carry it succeeds.
        The object itself stays; once nothing references it, the reconciliation job removes it.
      responses:
        "200":
          description: The attachments the entry now carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemAttachments"
        "4XX":
          $ref: "#/components/responses/Problem"

  /media:
    post:
      tags: [media]
      operationId: requestMediaUpload
      description: >
        Stages an upload: declares what is coming - its purpose, size and claimed type - and
        receives where to put the bytes. The answer's upload object carries a URL the client PUTs
        the bytes to directly (presigned object storage, or this server's token-protected content
        route on a local-storage installation) and the moment it expires. The object stays
        PENDING until confirmed; abandoned stagings are cleaned up by the reconciliation job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadRequest"
      responses:
        "201":
          description: The staged object, upload target included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "4XX":
          $ref: "#/components/responses/Problem"

  /media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      tags: [media]
      operationId: getMedia
      description: >
        The media object's record, with a download target when it is READY. Readable by its
        uploader, and by anybody who can read an entry it is attached to or covers.
      responses:
        "200":
          description: The media object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "4XX":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [media]
      operationId: deleteMedia
      description: >
        Removes an unreferenced media object: the record now, the bytes through the
        reconciliation job. Refused while anything references it - detach it or clear the cover
        first. Only the uploader or an administrator may.
      responses:
        "204":
          description: Removed
        "4XX":
          $ref: "#/components/responses/Problem"

  /media/{mediaId}:confirm:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    post:
      tags: [media]
      operationId: confirmMediaUpload
      description: >
        Seals the upload: the server reads the object's head back from storage, sniffs it, checks
        the size against what was declared and against the installation's limit, and marks the
        object READY with the judged content type - never the claim (T-11). A refusal removes the
        staged bytes. Idempotent: confirming a READY object succeeds and changes nothing, which
        is what makes an upload confirmed twice one media object.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The object, READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "4XX":
          $ref: "#/components/responses/Problem"

  /media/{mediaId}:content:
    parameters:
      - $ref: "#/components/parameters/MediaId"
      - name: token
        in: query
        required: true
        description: >
          The capability: a signed, expiring token minted by requestMediaUpload or getMedia. The
          URL is the credential, exactly as a presigned object-storage URL is - which is why
          these two operations carry no bearer requirement.
        schema: { type: string }
    put:
      tags: [media]
      operationId: uploadMediaContent
      security: []
      description: >
        The upload target of a local-storage installation: the bytes, streamed, judged by the
        upload guard as they pass. On an object-storage installation the upload goes to the
        presigned URL instead and this route answers that the token is not one it minted.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored, awaiting confirmation
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      tags: [media]
      operationId: downloadMediaContent
      security: []
      description: >
        The download target of a local-storage installation: the bytes, streamed, as a download -
        `Content-Disposition: attachment` and a sandboxing content security policy, never a
        rendering path for what somebody uploaded (T-11).
      responses:
        "200":
          description: The bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "4XX":
          $ref: "#/components/responses/Problem"

  /stream:
    get:
      tags: [sync]
      operationId: streamChanges
      summary: The change stream, as server-sent events
      description: |
        The same change records `:pull` returns, pushed as they happen. An **accelerator, not a
        second source of truth** (ADR-0021): a client that loses this connection catches up by
        cursor rather than by anything being replayed from memory, and a client that never opens it
        is not missing anything a pull would not give it.

        `text/event-stream`. Each event carries `id` (the cursor), `event` (the entity), and `data`
        (one change record). The `id` is what a browser's `EventSource` sends back as
        `Last-Event-ID` on its own reconnect, and what a client that manages its own connection
        should send explicitly — either resumes exactly where the stream stopped, with no gap and no
        duplicate.

        A cursor older than the tombstone period is refused with `sync.cursor_too_old`, exactly as
        `:pull` refuses one: a delta across a gap would be silently wrong, so the only safe answer
        is a full resynchronisation (offline-sync.md §7). A cursor this installation did not mint is
        `sync.cursor_invalid`.

        The stream carries everything the caller may read in their workspace, and there is no
        subscription filter: what a client wants to see is a question about its own screen, and a
        filter here would be a second answer to a question the authorisation already answers.
        Records are filtered by what the caller may read, per record and at the moment the record is
        sent, rather than by anything the subscription was trusted to state. Permission lost while
        the connection is open therefore stops the records for that container without the client
        having to do anything, and a client is never handed a record for a container it may not see.

        The stream is capped per tenant and per credential, because a long-lived connection is a
        resource a stateless, horizontally scaled role has to bound. Over the cap, or while the
        process is shedding load, the answer is `503` with `Retry-After` — the connection is refused,
        never a record dropped.

        A comment line is sent as a heartbeat so that proxies do not close an idle stream, and
        `SIGTERM` closes every stream inside the grace period rather than cutting them: a client
        reconnects to another pod and resumes from its cursor.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            The cursor to resume from, as the stream last sent it. Absent means "from now": a client
            with no cursor is starting fresh and should pull rather than ask the stream for history.
          schema: { type: string }
      responses:
        "200":
          description: The stream, until the client or the server closes it
          content:
            text/event-stream:
              schema:
                type: string
        "4XX":
          $ref: "#/components/responses/Problem"
        "503":
          description: Over the stream cap, or the process is shedding load
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "An OIDC access token, hbt_pat_…, or a service account token"

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }

    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }

    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }

    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ContainerId:
      name: containerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomFieldId:
      name: fieldId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViewId:
      name: viewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeedId:
      name: feedId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomFieldKey:
      name: key
      in: path
      required: true
      description: The definition's key. An identifier, never a label.
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,49}$" }
    LabelId:
      name: labelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BucketId:
      name: bucketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionId:
      name: collection_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    ParentId:
      name: parent_id
      in: query
      schema: { type: string, format: uuid }
    ContainerTypeFilter:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/ContainerType"
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    EventType:
      name: eventType
      in: path
      required: true
      description: >
        The type to poll, in full - `de.hubtask.work.item.created.v1`. A type this build does not
        declare is refused by name rather than answered with an empty page: a trigger configured
        against a typo would otherwise poll forever and report nothing wrong.
      schema: { type: string }
    PageSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IncludeArchived:
      name: include_archived
      in: query
      schema: { type: boolean, default: false }
    Expand:
      name: expand
      in: query
      description: >
        Relations to include, e.g. children:1, labels, assignee, cover. A relation this
        installation does not serve is refused by name rather than ignored: an entry that came back
        without its labels because they were not implemented is indistinguishable from one that
        carries none.
      schema:
        type: array
        items: { type: string }
      style: form
      explode: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A UUID; identical requests return the same result for 24 h.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the state last read (optimistic locking).
      schema: { type: string }

  responses:
    Problem:
      description: An error per RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: A stable, machine-readable error code (part of the contract).
          examples: [capability_not_supported, version_conflict, rate_limited]
        detail_code:
          type: string
          description: The message code for localisation in the client.
        params:
          type: object
          additionalProperties: true
        field_errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              code: { type: string }
              params:
                type: object
                additionalProperties: true
        request_id: { type: string }
        docs: { type: string, format: uri }

    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          description: >
            The cursor for the next page, null on the last one. Opaque and signed: it is produced by
            the server and is neither to be constructed nor parsed by a client.
        has_more: { type: boolean }

    ContainerPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Container"
        page:
          $ref: "#/components/schemas/PageInfo"

    ItemSearchQuery:
      type: object
      required: [q]
      description: >
        One full-text search. Everything but `q` narrows or pages it; there is no filter grammar
        here, because a search that also filtered would be `POST /items:query` with a `MATCHES`
        condition - which is the same index and is what that endpoint is for.
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            What to look for. Quoted phrases, `or` between words and a leading minus for exclusion
            work as they do in a web search box; anything else is read as words to find.
        container_id:
          type: [string, "null"]
          format: uuid
          description: >
            The hub or collection to search in. Omitted searches everything the caller may see.
        language:
          type: [string, "null"]
          description: >
            BCP-47. The language the *words* are in, not the entries: it decides how the query is
            read. Omitted takes the caller's locale.
        include_archived: { type: boolean, default: false }
        include_trashed: { type: boolean, default: false }
        page:
          type: object
          properties:
            cursor: { type: [string, "null"] }
            size: { type: integer, minimum: 1, maximum: 200, default: 50 }

    WorkItemPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
        page:
          $ref: "#/components/schemas/PageInfo"

    ContainerType:
      type: string
      enum: [HUB, COLLECTION]

    ItemType:
      type: string
      description: Extensible; /meta/capabilities returns the valid values.
      enum: [TASK, WORK_PACKAGE, ACTIVITY]

    Account:
      type: object
      required: [id, kind, display_name, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [USER, SERVICE_ACCOUNT] }
        email: { type: [string, "null"], format: email }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        status:
          type: string
          description: |
            `RESTRICTED` is Art. 18 as a technical state (E-10): the account works and its content
            stays, and what stops is this system deciding anything about the person by machine.
            `ANONYMIZED` is an erasure carried out in the mode that keeps the authorship - the row
            stays so that the workspace's own content is still readable, and everything of the
            person's in it is gone.
          enum: [ACTIVE, INVITED, DISABLED, RESTRICTED, ANONYMIZED]
        locale: { type: [string, "null"] }
        time_zone: { type: [string, "null"] }
        week_start: { type: [string, "null"], enum: [MONDAY, SUNDAY, SATURDAY, null] }

    AccountInvite:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: [string, "null"], maxLength: 200 }

    AccountPreferences:
      type: object
      description: |
        Every field is optional, and an empty string clears the preference rather than setting it
        to nothing — the workspace default applies again.
      properties:
        locale: { type: [string, "null"] }
        time_zone: { type: [string, "null"] }
        week_start: { type: [string, "null"], enum: [MONDAY, SUNDAY, SATURDAY, null] }

    ServiceAccountCreate:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            What the audit trail records next to the identifier. Name it after what it does -
            "the nightly export", not "svc1" - because it is what a reader of the trail sees.

    AccessToken:
      type: object
      description: >
        A minted credential as it is listed afterwards. The token itself is not a member: it
        exists in the answer to the call that minted it and nowhere else.
      required: [id, account_id, name, scopes, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id:
          type: string
          format: uuid
          description: Whose credential it is, and therefore whose rights bound it.
        name: { type: string, minLength: 1, maxLength: 200 }
        scopes:
          type: array
          items: { type: string }
          description: >
            The second bound on what the token may do, on top of the role its holder carries.
            Both have to allow an operation.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: >
            When a request last presented it, to the minute rather than to the request - the
            value exists so an owner can spot a credential nobody uses, and writing it on every
            call would be a write per request.
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: >
            When it was withdrawn. Separate from the expiry on purpose: "it ran out" and
            "somebody pulled it" are different answers.

    AccessTokenCreate:
      type: object
      required: [name, scopes, expires_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            What this token is for, in the owner's own words. It is what they will read in a year
            when deciding whether it is still needed.
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: >
            Requested explicitly, never defaulted to everything. Each has to be one the
            installation declares; one it does not is refused as a field error naming it.
        expires_at:
          type: string
          format: date-time
          description: >
            Mandatory, in the future, and at most a year out. There is no default - a caller has
            to choose.
        account_id:
          type: [string, "null"]
          format: uuid
          description: >
            Whose token. Omitted means the caller's own. A service account's needs the member
            management permission; another person's is refused, whatever the role.

    AccessTokenSecret:
      allOf:
        - $ref: "#/components/schemas/AccessToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >
                The credential, in clear, for the only time. Store it or lose it: what is kept is
                a hash, and nothing can turn that back into this.

    Group:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        version: { type: integer }

    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        members:
          type: array
          description: Accounts to put in the group straight away.
          items: { type: string, format: uuid }

    GroupUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        members:
          type: array
          description: The complete membership after the change; omitted leaves it as it is.
          items: { type: string, format: uuid }

    MembershipScope:
      type: string
      enum: [TENANT, HUB, COLLECTION, ITEM]

    MembershipRole:
      type: string
      description: |
        `AUDITOR` is the one that is not a rung on the same ladder: it reads the audit trail and
        the configuration and no content at all (audit.md §5). It exists because the
        alternative, in practice, is giving an auditor administrator rights - a permissions
        problem that arises precisely where evidence is being demanded. Somebody who needs both
        holds two memberships; the rights add up rather than the stronger one winning.
      enum: [OWNER, ADMIN, MEMBER, CONTRIBUTOR, VIEWER, GUEST, AUDITOR]

    Membership:
      type: object
      required: [id, scope_type, role]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: [string, "null"], format: uuid }
        group_id: { type: [string, "null"], format: uuid }
        scope_type: { $ref: "#/components/schemas/MembershipScope" }
        scope_id: { type: [string, "null"], format: uuid }
        role: { $ref: "#/components/schemas/MembershipRole" }

    MembershipGrant:
      type: object
      required: [scope_type, role]
      description: |
        Exactly one of `account_id` and `group_id`. Neither grants to nobody; both would leave no
        answer to whose right it is when one of the two is removed.
      properties:
        account_id: { type: [string, "null"], format: uuid }
        group_id: { type: [string, "null"], format: uuid }
        scope_type: { $ref: "#/components/schemas/MembershipScope" }
        scope_id: { type: [string, "null"], format: uuid }
        role: { $ref: "#/components/schemas/MembershipRole" }

    Container:
      type: object
      required: [id, type, name, version]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ContainerType" }
        parent_id: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        color_token: { type: [string, "null"] }
        order_key: { type: string }
        policies:
          $ref: "#/components/schemas/ContainerPolicies"
        archived_at: { type: [string, "null"], format: date-time }
        effective_archived:
          type: boolean
          description: >
            Whether this container is read-only: archived itself, or sitting in an archived hub
            (I-C3). archived_at says which of the two - it is null for a collection that only
            inherits it.
        deleted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ContainerCreate:
      type: object
      required: [type, name]
      properties:
        type: { $ref: "#/components/schemas/ContainerType" }
        parent_id: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        color_token: { type: [string, "null"] }

    ContainerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        color_token: { type: [string, "null"] }

    ContainerPolicies:
      type: object
      description: >
        How a collection works, as opposed to what it is called. Two keys today; the others the
        data model names - the default bucket, capability overrides - arrive with the use cases
        that own them, and a key nothing reads would be a promise nothing keeps. This document is
        replaced whole (PUT): a key that is not sent falls back to its default - MANUAL for the
        completion policy, no automatic assignment for auto_assign.
      properties:
        completion_policy: { $ref: "#/components/schemas/CompletionPolicy" }
        auto_assign:
          oneOf:
            - $ref: "#/components/schemas/AutoAssignPolicy"
            - type: "null"
          description: >
            How what is created in this collection is handed out, absent (or null) for not at
            all. Sending null - or omitting the key - removes the policy.

    CompletionPolicy:
      type: string
      description: >
        Whether a child's completion propagates upwards. MANUAL leaves the parent alone; ROLLUP
        completes it when its last open child is completed and reopens it when any child is
        reopened. /meta/capabilities returns the valid values.
      enum: [MANUAL, ROLLUP]
      default: MANUAL

    AutoAssignPolicy:
      type: object
      description: >
        A collection's rule for handing out what is created in it. An enabled policy applies
        itself to everything created in the collection; one that is not enabled waits to be asked
        for, with auto_assign on the create request. The rotation state of ROUND_ROBIN is the
        server's bookkeeping and is not in this document.
      required: [strategy, candidates]
      properties:
        strategy: { $ref: "#/components/schemas/AutoAssignStrategy" }
        candidates:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AutoAssignCandidate" }
          description: >
            The pool the strategy draws from, in the order that matters to ROUND_ROBIN. FIXED
            takes exactly one ACCOUNT; RANDOM_GROUP_MEMBER takes GROUP candidates; every other
            strategy takes ACCOUNT candidates.
        enabled:
          type: boolean
          default: true
          description: >
            Whether the policy applies itself to everything created in the collection. A policy
            that is not enabled is applied only to a create that asks with auto_assign.

    AutoAssignOutcome:
      type: object
      description: >
        What one run of automatic assignment did. assigned says whether anybody got the entry;
        strategy is the policy's strategy that ran; code is the stable reason when nobody did -
        items.auto_assign_no_candidate when no candidate was eligible.
      required: [assigned, strategy]
      properties:
        assigned: { type: boolean }
        strategy: { $ref: "#/components/schemas/AutoAssignStrategy" }
        code: { type: [string, "null"] }

    AutoAssignStrategy:
      type: string
      description: >
        How a candidate is picked. FIXED always assigns the one configured account.
        RANDOM_MEMBER draws uniformly from the candidate accounts. RANDOM_GROUP_MEMBER draws a
        group first and one of its members second, so each group carries an equal share of the
        work regardless of its size. ROUND_ROBIN walks the candidate list in order. LEAST_LOADED
        picks the candidate with the fewest open entries. /meta/capabilities returns the valid
        values.
      enum: [FIXED, RANDOM_MEMBER, RANDOM_GROUP_MEMBER, ROUND_ROBIN, LEAST_LOADED]

    AutoAssignCandidate:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [ACCOUNT, GROUP]
        id: { type: string, format: uuid }

    Completion:
      type: object
      properties:
        is_completed: { type: boolean }
        completed_at: { type: [string, "null"], format: date-time }
        completed_by: { type: [string, "null"], format: uuid }

    Cover:
      type: object
      properties:
        kind:
          type: string
          enum: [COLOR, IMAGE]
        color_token: { type: [string, "null"] }
        media_id: { type: [string, "null"], format: uuid }

    CoverInput:
      type: object
      description: >
        What the cover shall be: a colour token from the design system's vocabulary, or an image
        by its media identifier - exactly one of the two, matching the kind.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [COLOR, IMAGE]
        color_token: { type: [string, "null"] }
        media_id: { type: [string, "null"], format: uuid }

    DueDateInput:
      type: object
      description: >
        What the due date shall be. The instant is required; the flag and the zone qualify it and
        cannot be stored without it. An all-day due date carries due_date_only true and is read as
        a date in due_time_zone - the stored instant answers identically to every reader, and
        nothing the server emits renders it as a moment (i18n-l10n.md §4).
      required: [due_at]
      properties:
        due_at: { type: string, format: date-time }
        due_date_only: { type: boolean, default: false }
        due_time_zone:
          type: [string, "null"]
          description: An IANA time zone, such as Europe/Berlin. Anything else is refused.

    SavedView:
      type: object
      description: >
        A saved query with the layout it is drawn in. The server stores the query, validates it
        against the same catalogue as POST /items:query, and interprets neither the layout nor the
        visible fields - both are the client's vocabulary, echoed back exactly as stored.
      required: [id, scope_type, owner_id, name, layout, query, grouping, visible_fields, sharing, version]
      properties:
        id: { type: string, format: uuid }
        scope_type:
          type: string
          enum: [TENANT, HUB, COLLECTION, ACCOUNT]
          description: >
            Where the view lives, which is who it can be shared with: a container's members, the
            workspace, or - for ACCOUNT - nobody but its owner.
        scope_id:
          type: [string, "null"]
          format: uuid
          description: >
            The container the scope names, the owner's account for ACCOUNT, and null for TENANT.
        owner_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        layout:
          type: string
          description: >
            One of the declared set (/meta/capabilities, view_layouts). Stored and echoed, never
            consulted.
        query:
          type: object
          additionalProperties: true
          description: The query document of POST /items:query, stored as sent.
        grouping:
          type: object
          additionalProperties: true
        visible_fields:
          type: array
          items: { type: string }
        sharing:
          type: string
          enum: [PRIVATE, SCOPE, PUBLIC_LINK]
        created_at: { type: string, format: date-time }
        version: { type: integer }

    SavedViewCreate:
      type: object
      required: [scope_type, name, layout, query]
      properties:
        scope_type:
          type: string
          enum: [TENANT, HUB, COLLECTION, ACCOUNT]
        scope_id:
          type: [string, "null"]
          format: uuid
          description: >
            The container for HUB and COLLECTION. Omitted for TENANT, and for ACCOUNT - an
            account-scoped view is always the caller's own.
        name: { type: string, minLength: 1, maxLength: 200 }
        layout: { type: string }
        query:
          type: object
          additionalProperties: true
        grouping:
          type: object
          additionalProperties: true
        visible_fields:
          type: array
          items: { type: string }
        sharing:
          type: string
          enum: [PRIVATE, SCOPE, PUBLIC_LINK]
          default: PRIVATE
          description: >
            SCOPE at creation asks the same permission :share does. PUBLIC_LINK is refused by
            name.

    SavedViewUpdate:
      type: object
      description: >
        JSON Merge Patch; a field that is not sent is left alone. The scope and the sharing are
        not here - where a view lives is decided at creation, and sharing is :share.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        layout: { type: string }
        query:
          type: object
          additionalProperties: true
        grouping:
          type: object
          additionalProperties: true
        visible_fields:
          type: array
          items: { type: string }

    SavedViewShare:
      type: object
      required: [sharing]
      properties:
        sharing:
          type: string
          enum: [PRIVATE, SCOPE, PUBLIC_LINK]

    ViewExport:
      type: object
      required: [format]
      description: >
        What to render and how. The view decides which rows; the format decides what they become.
      properties:
        format:
          type: string
          enum: [CSV, JSON, ICS]
          description: >
            CSV for a spreadsheet, JSON for a script, ICS for a calendar. ICS renders only the
            entries that have a due date, because an entry with no date is not a calendar entry.
        time_zone:
          type: string
          description: >
            The zone the dates are written in. Defaults to the caller's own. It decides how a
            timestamp reads, never which rows are selected.
          example: "Europe/Berlin"

    ViewExportDocument:
      type: object
      description: >
        The JSON rendering - the view's rows, and what the export knows about itself.
      required: [view_id, generated_at, count, truncated, rows]
      properties:
        view_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        count:
          type: integer
          description: How many rows are in this document.
        truncated:
          type: boolean
          description: >
            True when the result reached max_export_rows. The same statement the Export-Truncated
            header makes, in the one format that can carry it in the body.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"

    WebhookSubscription:
      type: object
      description: >
        One external system's standing request to be told what happens here. The signing secret is
        not a member: it is answered once, at creation and at each rotation, and stored sealed.
      required: [id, target_url, event_types, state, failure_count, created_at, version]
      properties:
        id: { type: string, format: uuid }
        target_url:
          type: string
          format: uri
          description: >
            Where the CloudEvent is POSTed. An egress channel, so it goes through the guarded
            client: a private range or the cloud metadata address is refused unless the
            installation has deliberately released private networks (T-07).
        event_types:
          type: array
          minItems: 1
          items: { type: string }
          description: >
            The types this subscription wants, as `/meta/capabilities` lists them. A type this
            build does not emit is refused rather than stored, so a subscription cannot quietly
            wait for something that will never arrive.
        filter:
          type: [string, "null"]
          description: >
            A CEL expression narrowing the subscription further. Refused until the expression
            engine lands, and refused rather than stored and ignored: a filter that is accepted
            and does nothing is a subscriber receiving events they asked not to receive.
        state:
          type: string
          enum: [ACTIVE, PAUSED, DISABLED]
          description: >
            `DISABLED` is what sustained unreachability produces, with a notification to the owner.
            Re-enabling is an ordinary write and is audited as one.
        failure_count:
          type: integer
          description: >
            Consecutive failed deliveries. Reset by the first success, and what the auto-disable
            counts against.
        last_error:
          type: [string, "null"]
          description: A message code for the last failure, never a response body from the target.
        created_at: { type: string, format: date-time }
        version: { type: integer }

    WebhookSubscriptionCreate:
      type: object
      required: [target_url, event_types]
      properties:
        target_url: { type: string, format: uri, maxLength: 2000 }
        event_types:
          type: array
          minItems: 1
          items: { type: string }
        filter:
          type: [string, "null"]
          description: Refused until the expression engine lands.

    WebhookSubscriptionUpdate:
      type: object
      description: Every field optional; an omitted one is left alone.
      properties:
        target_url: { type: [string, "null"], format: uri, maxLength: 2000 }
        event_types:
          type: [array, "null"]
          minItems: 1
          items: { type: string }
        filter: { type: [string, "null"] }
        state:
          type: [string, "null"]
          enum: [ACTIVE, PAUSED, null]
          description: >
            `DISABLED` is not settable by hand: it is what the system concludes from a run of
            failures. Pausing is how somebody stops deliveries deliberately, and the two say
            different things to whoever reads the list.

    WebhookSubscriptionSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookSubscription"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >
                The signing secret, in clear, for the only time. Store it or rotate it: what is
                kept is sealed under the installation's key, and no read answers it again.

    WebhookSecretRotation:
      type: object
      properties:
        grace_seconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 604800
          description: >
            How long the previous secret keeps verifying, so a subscriber can deploy the new one
            without dropping what arrives in between. Zero retires the old secret at once, which is
            what a leak calls for. At most seven days.

    WebhookDelivery:
      type: object
      description: One attempt at one event against one subscription.
      required: [id, subscription_id, event_id, attempt, status, created_at]
      properties:
        id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        event_id:
          type: string
          format: uuid
          description: >
            The event's own identifier, which travels as `X-Hubtask-Event-Id`. A replay carries the
            same one, so a subscriber that deduplicates on it recognises the repeat.
        attempt:
          type: integer
          description: Which attempt this is, from one. It carries on across a replay rather than resetting.
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, DEAD_LETTER]
        response_status:
          type: [integer, "null"]
          description: What the target answered, where it answered at all.
        error_code:
          type: [string, "null"]
          description: A message code, never the target's response body.
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: When the next attempt is due; null once there will not be one.
        created_at: { type: string, format: date-time }

    RuleScope:
      type: object
      description: >
        Where the rule applies: the whole workspace, one hub, or one collection - the three levels
        `automation_rule.scope_type` has carried since the first migration. Descendants are included
        by the ordinary rule rather than by a flag: a permission held at a hub applies downwards
        (domain-model.md §3.2), and a rule scoped to a hub sees what happens in its collections.
      required: [type]
      properties:
        type:
          type: string
          enum: [TENANT, HUB, COLLECTION]
        id:
          type: string
          format: uuid
          description: The hub or the collection. Absent for `TENANT`, and required for the others.

    RuleTrigger:
      type: object
      description: >
        What starts a run (automation.md §1.1). Six kinds, each with the fields its kind needs and
        no others - a trigger carrying a cron expression and an event type would be a rule nobody
        can read.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [EVENT, SCHEDULE, RELATIVE_DATE, INBOUND_WEBHOOK, MANUAL, JUMBLE_ENTRY]
        event_type:
          type: string
          description: >
            `EVENT` only, and required there: the full type, `de.hubtask.work.item.overdue.v1`. One
            this build does not publish is refused by name.
        changed_fields:
          type: array
          description: >
            `EVENT` only, optional. Narrows an `item.updated` trigger to the fields that moved, so
            that a rule about deadlines does not fire on a rename.
          items: { type: string }
        rrule:
          type: string
          description: "`SCHEDULE` only, and required there: an RFC 5545 RRULE."
        timezone:
          type: string
          description: >
            `SCHEDULE` only, and required there: an IANA zone. A schedule without one is a schedule
            that means something different in summer.
        anchor:
          type: string
          enum: [DUE_DATE, CREATED_AT]
          description: "`RELATIVE_DATE` only, and required there: which instant the offset is from."
        offset:
          type: string
          description: >
            `RELATIVE_DATE` only, and required there: a signed ISO 8601 duration, `-PT24H` for
            "24 hours before".

    RuleAction:
      type: object
      description: >
        One step of a run. The kind is a use case name in SCREAMING_SNAKE_CASE and the list grows
        with the catalogue rather than with a table somebody maintains (automation.md §1.3), so a
        new use case becomes an action without anybody editing anything.
      required: [kind]
      properties:
        kind:
          type: string
          description: >
            `ADD_LABEL`, `ASSIGN`, `CREATE_ITEM`, … A kind automation.md §1.3 documents and no
            release serves yet is refused by name rather than stored to be ignored.
        params:
          type: object
          additionalProperties: true
          description: >
            The action's parameters. A key the use case behind the kind does not declare is
            refused, exactly as it would be on the call itself.

    RuleThrottle:
      type: object
      description: >
        What bounds a storm. Both are optional, and both are stored rather than enforced here: the
        engine that runs a rule is what observes them (automation.md §2).
      properties:
        max_runs_per_hour:
          type: integer
          minimum: 1
          maximum: 10000
        dedupe_key_expr:
          type: string
          description: >
            An expression whose value collapses runs that mean the same thing. Refused while it is
            non-empty, with the conditions and for their reason: the language arrives with the
            engine that evaluates it.

    AutomationRule:
      type: object
      required:
        [id, name, scope, enabled, run_as, trigger, conditions, actions, on_error,
         failure_count, created_by, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { $ref: "#/components/schemas/RuleScope" }
        enabled:
          type: boolean
          description: >
            Switched off when the rule is written. `:enable` and `:disable` are what move it, so
            that the trail says which of the two somebody did.
        run_as:
          type: string
          format: uuid
          description: >
            The account the rule acts as. It can never do more than that account may
            (automation.md §2), which is why the writer has to hold those rights too.
        trigger: { $ref: "#/components/schemas/RuleTrigger" }
        conditions:
          type: array
          description: >
            Empty in this release. A non-empty condition is refused until the expression language
            that evaluates it arrives - stored and ignored is the one thing it must not be.
          items: { $ref: "#/components/schemas/RuleCondition" }
        actions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RuleAction" }
        throttle: { $ref: "#/components/schemas/RuleThrottle" }
        on_error:
          type: string
          enum: [STOP, CONTINUE, RETRY]
        failure_count:
          type: integer
          description: >
            Consecutive failed runs. A run of them disables the rule by itself, and enabling it by
            hand clears the count.
        next_run_at:
          type: [string, "null"]
          format: date-time
          description: >
            When a `SCHEDULE` rule next fires. Absent for every other kind, and for a schedule whose
            recurrence is exhausted - such a rule stays, visible and editable, and fires no more.
        inbound_rotated_at:
          type: [string, "null"]
          format: date-time
          description: >
            When an `INBOUND_WEBHOOK` rule's address was last minted, and absent for a rule that has
            none. The moment and nothing else: a prefix or a masked value beside it would be a
            credential whose guessing space has been narrowed for whoever reads the listing.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    RuleCondition:
      type: object
      required: [expr]
      properties:
        expr:
          type: string
          description: A CEL expression (ADR-0009). Refused while it is non-empty in this release.

    AutomationRuleCreate:
      type: object
      required: [name, scope, run_as, trigger, actions]
      properties:
        name: { type: string, maxLength: 200 }
        scope: { $ref: "#/components/schemas/RuleScope" }
        run_as: { type: string, format: uuid }
        trigger: { $ref: "#/components/schemas/RuleTrigger" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/RuleCondition" }
        actions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RuleAction" }
        throttle: { $ref: "#/components/schemas/RuleThrottle" }
        on_error:
          type: string
          enum: [STOP, CONTINUE, RETRY]
          default: STOP

    AutomationRuleUpdate:
      type: object
      description: >
        An omitted field is left alone. `enabled` is deliberately absent: it moves through `:enable`
        and `:disable`, which are audited as the decisions they are.
      properties:
        name: { type: string, maxLength: 200 }
        scope: { $ref: "#/components/schemas/RuleScope" }
        run_as: { type: string, format: uuid }
        trigger: { $ref: "#/components/schemas/RuleTrigger" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/RuleCondition" }
        actions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RuleAction" }
        throttle: { $ref: "#/components/schemas/RuleThrottle" }
        on_error:
          type: string
          enum: [STOP, CONTINUE, RETRY]
        expected_version:
          type: integer
          description: The version last read. A mismatch is a conflict rather than an overwrite.

    AutomationRulePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AutomationRule" }
        page: { $ref: "#/components/schemas/PageInfo" }

    RuleRunStatus:
      type: string
      description: >
        How a run ended. `RUNNING` is a run in flight or one whose process died - the engine writes
        it when the run starts, so a row left in it is a crash rather than a state anything reaches
        deliberately.
      enum: [RUNNING, SUCCEEDED, SKIPPED, FAILED, ABORTED_LOOP, THROTTLED]

    RuleConditionResult:
      type: object
      description: >
        How one condition answered, in the order the rule declares them. A run that was skipped
        shows which condition stopped it, which is the question somebody asks first.
      required: [index, matched]
      properties:
        index: { type: integer }
        matched: { type: boolean }
        error_code:
          type: string
          description: >
            Present when the condition could not be evaluated at all - a timeout, or a value the
            engine could not read. Distinct from `matched: false`, which is the condition working.

    RuleActionResult:
      type: object
      description: One action's outcome, in the order the rule declares them.
      required: [index, kind, status]
      properties:
        index: { type: integer }
        kind: { type: string }
        status:
          type: string
          enum: [SUCCEEDED, FAILED, SKIPPED]
          description: >
            `SKIPPED` is an action the run never reached - `on_error: STOP` ended the run at an
            earlier failure. It is not the same as an action that ran and did nothing.
        error_code:
          type: string
          description: >
            The code the use case refused with, unchanged. A `run_as` account that may not do what
            the action asks shows the authoriser's own refusal here, which is what makes the run
            log answer "why did this not happen".
        idempotency_key:
          type: string
          description: >
            Derived from the rule, the event and the action's index (automation.md §2), so a
            redelivered event re-runs into the stored result rather than acting twice.

    RuleRun:
      type: object
      required:
        [id, rule_id, trigger, status, condition_results, action_results, started_at,
         causation_depth]
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }
        trigger:
          type: string
          enum: [EVENT, SCHEDULE, RELATIVE_DATE, INBOUND_WEBHOOK, MANUAL, JUMBLE_ENTRY]
          description: >
            Which of the rule's six ways of starting produced this run (automation.md §1.1). On the
            run rather than read from the rule, because a rule can be edited from one kind into
            another and the log has to keep saying what actually happened.
        triggered_by:
          type: [string, "null"]
          format: uuid
          description: >
            Who pulled the trigger, for the one kind a person pulls: `MANUAL`. Absent for every
            other kind - a schedule, a due date and an inbound delivery have no actor, and naming
            one would be inventing an author for something nobody did.
        subject_id:
          type: [string, "null"]
          format: uuid
          description: >
            The entry the run is about when no event names it - a `RELATIVE_DATE` run measured from
            one entry's due date. Absent where the event carries the subject, which is where a
            reader should look for it.
        event_id:
          type: [string, "null"]
          format: uuid
          description: The event that started the run. Absent for a run nothing published started.
        status: { $ref: "#/components/schemas/RuleRunStatus" }
        condition_results:
          type: array
          items: { $ref: "#/components/schemas/RuleConditionResult" }
        action_results:
          type: array
          items: { $ref: "#/components/schemas/RuleActionResult" }
        error_code:
          type: string
          description: Why the run as a whole ended badly, when it did.
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        causation_depth:
          type: integer
          description: >
            How far this run is from the act a person performed. A run at the limit is
            `ABORTED_LOOP` and did nothing, which is the loop protection automation.md §2 names.

    InboundTriggerToken:
      type: object
      description: >
        A freshly minted inbound address. The token exists in this answer and nowhere else
        afterwards: it is stored hashed, and every later read of the rule shows only when it was
        minted.
      required: [rule_id, token, rotated_at]
      properties:
        rule_id: { type: string, format: uuid }
        token:
          type: string
          description: >
            The credential, prefixed `hbt_hook_`. The prefix is public by design, so that secret
            scanning finds a leaked URL before somebody else does.
        rotated_at: { type: string, format: date-time }

    RuleRunAccepted:
      type: object
      description: >
        A run that has been queued and has not started. The identifier is the one the run will
        carry, so a caller can watch for it - `GET /automation/runs/{runId}` answers `404` until a
        worker claims the job.
      required: [run_id, rule_id]
      properties:
        run_id: { type: string, format: uuid }
        rule_id: { type: string, format: uuid }

    RuleRunPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/RuleRun" }
        page: { $ref: "#/components/schemas/PageInfo" }

    WebhookDeliveryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        page: { $ref: "#/components/schemas/PageInfo" }

    TriggerEvent:
      type: object
      description: >
        One event as a subscriber receives it: the CloudEvents 1.0 structured-JSON document itself,
        unwrapped - `specversion`, `id`, `source`, `type`, `time`, `data`, and the extension
        attributes that carry the tenant, the actor and the causal chain.

        The same bytes a webhook delivery would have POSTed, which is what makes the two transports
        one contract. `id` is the value `X-Hubtask-Event-Id` names on the push side, so a consumer
        deduplicates on it either way.

        Free-form here on purpose. The document's shape is owned by the schemas under `api/events/`
        and by the CloudEvents specification, and a second list of its properties in this file would
        be a copy that drifts - and one that silently drops an extension attribute the day one is
        added.
      additionalProperties: true

    TriggerEventPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TriggerEvent" }
        page: { $ref: "#/components/schemas/PageInfo" }

    CalendarFeed:
      type: object
      description: >
        One subscription: a token its owner holds, over one saved view, revocable. The token
        itself is not a member - it exists in the answer to the call that minted it and nowhere
        else afterwards.
      required: [id, account_id, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id:
          type: string
          format: uuid
          description: The owner, whose authorisation the feed reads with at every fetch.
        view_id:
          type: [string, "null"]
          format: uuid
          description: >
            The view the feed serves, or null once that view has been deleted. Null rather than
            the row going with it: a feed is the subscriber's and a view is the workspace's, so a
            deleted view leaves a feed that serves nothing and says so.
        created_at: { type: string, format: date-time }
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: >
            When the token stopped working. Kept rather than deleted, so that "this token was
            revoked on Tuesday" is answerable.

    CalendarFeedCreate:
      type: object
      required: [view_id]
      properties:
        view_id:
          type: string
          format: uuid
          description: The saved view to serve. It has to be one the caller may read.

    CalendarFeedSecret:
      allOf:
        - $ref: "#/components/schemas/CalendarFeed"
        - type: object
          required: [token, url]
          properties:
            token:
              type: string
              description: >
                The credential, in clear, for the only time. Store it or lose it: what is kept is
                a hash, and nothing can turn that back into this.
            url:
              type: string
              format: uri
              description: >
                The address to hand a calendar client, which is the token in its place. It carries
                the credential, so it is treated as one - not pasted into a chat, not put in a
                ticket.

    CustomFieldDefinition:
      type: object
      description: >
        One field a workspace or a collection adds to its entries. The values live on the entry
        itself, in `custom_fields`; this is what says which keys exist, what they may hold and
        which types carry them.
      required: [id, collection_id, key, kind, options, is_required, applies_to, version]
      properties:
        id: { type: string, format: uuid }
        collection_id:
          type: [string, "null"]
          format: uuid
          description: >
            The collection the definition belongs to, or null for the whole workspace. Always
            present: absent would say this server does not know about scopes, which is a different
            statement from "this one is workspace-wide".
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,49}$"
          description: >
            The identifier the value is stored under, unique in its scope and fixed once defined.
            An identifier rather than a label: it appears in `custom_fields.<key>` filters, and a
            key that could be renamed would orphan every value stored under it.
        kind:
          $ref: "#/components/schemas/CustomFieldKind"
        options:
          type: array
          description: >
            The permitted values of a SELECT or a MULTI_SELECT, and empty for every other kind.
            Values rather than labels: what a person sees is the client's to render.
          items: { type: string, minLength: 1, maxLength: 200 }
        is_required:
          type: boolean
          description: >
            Whether the field has to hold a value. Enforced when the field is written, not
            retroactively: making a field required does not make the entries that predate it
            invalid.
        applies_to:
          type: array
          description: >
            The item types that carry the field, bounded by the CUSTOM_FIELDS capability. Never
            empty - a definition no type carries is one nothing could ever hold.
          minItems: 1
          items: { $ref: "#/components/schemas/ItemType" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version:
          type: integer
          description: The optimistic lock, returned as the ETag and sent back as If-Match.

    CustomFieldKind:
      type: string
      description: >
        What a value for the field looks like. The eight the schema has carried since the first
        migration; validation against them is domain code (domain-model.md §6).
      enum: [TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, BOOL, USER, URL]

    CustomFieldDefinitionCreate:
      type: object
      required: [key, kind]
      properties:
        collection_id:
          type: [string, "null"]
          format: uuid
          description: Omitted or null defines the field for the whole workspace.
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,49}$" }
        kind: { $ref: "#/components/schemas/CustomFieldKind" }
        options:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        is_required: { type: boolean, default: false }
        applies_to:
          type: array
          description: Omitted means TASK alone, which is the column's default.
          items: { $ref: "#/components/schemas/ItemType" }

    CustomFieldDefinitionUpdate:
      type: object
      description: >
        JSON Merge Patch. The key and the kind are not in it: a key that moved would orphan every
        value stored under it, and a kind that changed would reinterpret them.
      properties:
        options:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        is_required: { type: boolean }
        applies_to:
          type: array
          items: { $ref: "#/components/schemas/ItemType" }

    CustomFieldValue:
      type: object
      description: >
        One value for one key. `value` is required and may be null, which clears the key - the two
        are different requests, and a body that left the field out would be neither.
      required: [value]
      properties:
        value:
          description: >
            The value, shaped by the definition's kind: a string for TEXT, SELECT and URL, a number
            for NUMBER, a boolean for BOOL, an ISO-8601 date for DATE, an account identifier for
            USER, and an array of strings for MULTI_SELECT. Null clears the key.

    MediaObject:
      type: object
      required: [id, usage, status, content_type, size, ref_count, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        file_name:
          type: [string, "null"]
          description: The name the file arrived under, for the download - never a storage path.
        content_type:
          type: string
          description: >
            While PENDING, the claim the upload declared; once READY, the judged type - sniffed
            from the bytes, never the claim (T-11). Delivery decides from this.
        size:
          type: integer
          format: int64
          description: Declared while PENDING, measured once READY.
        checksum: { type: [string, "null"] }
        usage:
          type: string
          enum: [COVER, ATTACHMENT]
        status:
          type: string
          enum: [PENDING, READY]
          description: >
            PENDING between staging and confirmation; READY once the bytes were read back,
            judged and sealed. Only READY objects can cover or be attached.
        ref_count:
          type: integer
          description: >
            How many covers and attachments point at the object. Zero and READY means the
            reconciliation job will remove it after its grace period; deletion by hand is only
            possible at zero.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        upload:
          oneOf:
            - $ref: "#/components/schemas/MediaTransfer"
            - type: "null"
          description: >
            Where to put the bytes, present in the answer that staged the upload and on a GET
            while the object is PENDING and the target has not expired.
        download:
          oneOf:
            - $ref: "#/components/schemas/MediaTransfer"
            - type: "null"
          description: Where to fetch the bytes, present on a GET once the object is READY.

    MediaTransfer:
      type: object
      required: [url, method, expires_at]
      description: >
        One side of the byte transfer: the URL is the capability - a presigned object-storage
        URL, or this server's token-protected content route - and it expires.
      properties:
        url: { type: string }
        method:
          type: string
          enum: [PUT, GET]
        expires_at: { type: string, format: date-time }

    MediaUploadRequest:
      type: object
      required: [usage, size]
      properties:
        file_name:
          type: [string, "null"]
          maxLength: 255
        content_type:
          type: [string, "null"]
          description: The claim. Reconciled against the bytes at confirmation; a lie about a
            renderable type is refused there (T-11).
        size:
          type: integer
          format: int64
          minimum: 1
          description: The exact size in bytes. Bounded by the installation's upload limit.
        usage:
          type: string
          enum: [COVER, ATTACHMENT]

    MediaPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MediaObject"
        page:
          $ref: "#/components/schemas/PageInfo"

    ItemAttachments:
      type: object
      description: >
        The attachments one entry carries. Returned by attaching and detaching rather than the
        entry itself, for the reason ItemMembers is: neither touches the entry's own row.
      required: [item_id, media_ids]
      properties:
        item_id: { type: string, format: uuid }
        media_ids:
          type: array
          items: { type: string, format: uuid }

    WorkItem:
      type: object
      required: [id, type, collection_id, title, completion, version]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ItemType" }
        collection_id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        path: { type: string }
        depth: { type: integer }
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: [string, "null"] }
        completion: { $ref: "#/components/schemas/Completion" }
        bucket_id: { type: [string, "null"], format: uuid }
        order_key: { type: string }
        start_at: { type: [string, "null"], format: date-time }
        due_at: { type: [string, "null"], format: date-time }
        due_date_only: { type: boolean, default: false }
        due_time_zone: { type: [string, "null"], description: An IANA time zone }
        label_ids:
          type: array
          items: { type: string, format: uuid }
        member_ids:
          type: array
          items: { type: string, format: uuid }
        assignee_id: { type: [string, "null"], format: uuid }
        auto_assign:
          oneOf:
            - $ref: "#/components/schemas/AutoAssignOutcome"
            - type: "null"
          description: >
            What automatic assignment did, present only in the response of an operation that ran
            it - autoAssignWorkItem, or a create that a policy applied to. Absent everywhere else.
        cover: { $ref: "#/components/schemas/Cover" }
        custom_fields:
          type: object
          additionalProperties: true
        recurrence_rule_id: { type: [string, "null"], format: uuid }
        content_language:
          type: [string, "null"]
          description: >
            BCP-47, and null for an entry whose language nobody stated. It decides the text search
            configuration the entry is indexed under (i18n-l10n.md §5, ADR-0034).
        archived_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        retention:
          oneOf:
            - $ref: "#/components/schemas/RetentionState"
            - type: "null"
          description: Set for as long as a retention rule applies to this object.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        hlc: { type: string, description: The hybrid logical clock of the last change; the basis of offline merging. }
        version: { type: integer }
        children:
          type: array
          description: Only with expand=children:N
          items: { $ref: "#/components/schemas/WorkItem" }

    WorkItemCreate:
      type: object
      required: [type, title]
      properties:
        type: { $ref: "#/components/schemas/ItemType" }
        collection_id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: [string, "null"] }
        bucket_id: { type: [string, "null"], format: uuid }
        before_item_id: { type: [string, "null"], format: uuid }
        start_at: { type: [string, "null"], format: date-time }
        due_at: { type: [string, "null"], format: date-time }
        due_date_only: { type: boolean, default: false }
        due_time_zone:
          type: [string, "null"]
          description: >
            An IANA time zone. Stored beside the instant, never folded into it: an all-day due
            date (due_date_only) is a date in this zone, not a midnight that shifts with the
            viewer (i18n-l10n.md §4). Refused without a due_at.
        label_ids:
          type: array
          items: { type: string, format: uuid }
        member_ids:
          type: array
          items: { type: string, format: uuid }
        assignee_id: { type: [string, "null"], format: uuid }
        auto_assign: { type: boolean, default: false }
        cover: { $ref: "#/components/schemas/Cover" }
        custom_fields:
          type: object
          additionalProperties: true
        content_language:
          type: [string, "null"]
          description: >
            BCP-47. The language the title and the notes are written in, which decides the text
            search configuration this entry is indexed under (i18n-l10n.md §5, ADR-0034). Omitted
            takes the creator's locale; a language this installation cannot index is stored and
            indexed word by word rather than refused. `/meta/capabilities` lists the ones it can
            under `text_languages`.

    WorkItemUpdate:
      type: object
      description: JSON Merge Patch; null deletes a field.
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: [string, "null"] }
        bucket_id: { type: [string, "null"], format: uuid }
        start_at: { type: [string, "null"], format: date-time }
        due_at:
          type: [string, "null"]
          format: date-time
          description: >
            null clears the due date, the all-day flag and the zone together - the three fields
            describe one date and none of them means anything alone.
        due_date_only: { type: boolean }
        due_time_zone: { type: [string, "null"], description: An IANA time zone. Refused without a due_at. }
        assignee_id: { type: [string, "null"], format: uuid }
        cover: { $ref: "#/components/schemas/Cover" }
        custom_fields:
          type: object
          additionalProperties: true
        content_language:
          type: [string, "null"]
          description: >
            BCP-47, and null clears it. The entry is re-indexed under the new language on this
            write; earlier entries are not, because their language did not change.

    MoveResult:
      type: object
      required: [item, dropped_references]
      properties:
        item: { $ref: "#/components/schemas/WorkItem" }
        dropped_references:
          type: array
          description: >
            Labels, buckets, members or custom fields that could not be resolved in the destination
            collection and were therefore removed (invariant I-W6: unresolvable references are reported
            back, never silently dropped). Always present; empty when nothing was lost.
          items:
            $ref: "#/components/schemas/DroppedReference"

    DroppedReference:
      type: object
      required: [kind, id, code]
      properties:
        item_id:
          type: string
          format: uuid
          description: >
            The entry that lost it. A move carries a whole subtree, so one operation can drop
            references from several entries at once.
        kind: { type: string, enum: [LABEL, BUCKET, MEMBER, ASSIGNEE, ATTACHMENT, CUSTOM_FIELD] }
        id:
          type: string
          description: >
            The reference that could not be carried over: an identifier for a label, a column or an
            account, and the key itself for a custom field, which has no identifier in a collection
            that does not define it.
        code: { type: string, description: A stable message code saying why. }

    FilterNode:
      type: object
      required: [op]
      description: |
        Either a leaf (`field`, `op`, `value`) or a combination (`op` of `AND`, `OR`, `NOT` with
        `nodes`). A node is one or the other: a combination carrying a `field`, or a leaf carrying
        `nodes`, is refused rather than half-read.

        Combinations nest at most five deep and a filter holds at most fifty nodes in total - the
        bound that keeps a query's cost a function of the data rather than of the request.
      properties:
        op:
          type: string
          enum: [AND, OR, NOT, EQ, NEQ, IN, NOT_IN, LT, LTE, GT, GTE, BETWEEN, IS_NULL, CONTAINS, CONTAINS_ANY, CONTAINS_ALL, STARTS_WITH, MATCHES]
        field:
          type: string
          description: >
            On a leaf, the field to compare. One of the names `GET /meta/capabilities` lists under
            `query_fields`; anything else is `query.field_unknown`. Absent on a combination.
        value:
          description: >
            On a leaf, what to compare against - a scalar for most operators, an array for `IN`,
            `NOT_IN`, `CONTAINS_ANY`, `CONTAINS_ALL` and `BETWEEN` (two elements, the bounds), and
            absent for `IS_NULL`. A string beginning with `@` is a placeholder resolved on the
            server in the caller's time zone: `@me`, `@now`, `@today`, `@end_of_day`,
            `@start_of_week`, `@end_of_week`, `@start_of_month`, `@end_of_month`, each but `@me`
            optionally with a signed ISO 8601 offset (`@today+P3D`, `@start_of_week-P1W`). An end
            is the last instant of its period, so `LTE @end_of_month` means what it says.
        nodes:
          type: array
          description: On a combination, the nodes it joins. `NOT` takes exactly one.
          items: { $ref: "#/components/schemas/FilterNode" }

    ItemQuery:
      type: object
      required: [scope]
      properties:
        scope:
          type: object
          description: >
            Where to look. Exactly one of `container_id` and `item_id`, and it is required: an
            unanchored query is a scan of the whole tenant, and the permission is checked against
            this scope once for the whole result.
          properties:
            container_id:
              type: string
              format: uuid
              description: >
                A collection, or a hub - with `include_descendants`, a hub covers the items of
                every collection in it.
            item_id:
              type: string
              format: uuid
              description: An entry, whose subtree is searched with `include_descendants`.
            include_descendants:
              type: boolean
              default: true
              description: >
                False narrows the scope to one level: the entries directly in the collection, or
                the direct children of the entry. Ignored for a hub, whose items always sit at
                least one collection down.
        filter: { $ref: "#/components/schemas/FilterNode" }
        sort:
          type: array
          maxItems: 4
          description: >
            Ordered, most significant first, and always completed by `id ASC` so that a cursor is
            unambiguous. Defaults to the manual order (`order_key ASC`).
          items:
            type: object
            required: [field]
            properties:
              field: { type: string }
              dir: { type: string, enum: [ASC, DESC], default: ASC }
              nulls: { type: string, enum: [FIRST, LAST], default: LAST }
        group_by:
          type: object
          required: [field]
          description: >
            The board projection: one group per distinct value, each with its own rows and its own
            cursor. A group's cursor continues that group and is sent back with the group's key as
            a filter.
          properties:
            field: { type: string }
            limit_per_group: { type: integer, minimum: 1, maximum: 200, default: 50 }
        expand:
          type: array
          description: >
            Relations to include, as on `GET /items`. `labels` is served; anything else is
            `items.expand_not_supported`.
          items: { type: string }
        page:
          type: object
          properties:
            cursor: { type: [string, "null"] }
            size: { type: integer, minimum: 1, maximum: 200, default: 50 }
        include_archived: { type: boolean, default: false }
        include_trashed: { type: boolean, default: false }
        count:
          type: string
          enum: [none, estimated, exact]
          default: none
          description: >
            `exact` counts the whole result with a second query and answers `total`; it is opt-in
            because it costs a second pass. `estimated` is not served and is refused by name rather
            than answered with a null total.

    ItemQueryGroup:
      type: object
      required: [key, count, data, page]
      description: >
        One column of a grouped result. Its `page` continues this group and nothing else: a client
        pages a column by asking again for that column - the key as a filter, this cursor as the
        cursor.
      properties:
        key:
          type: [string, "null"]
          description: The grouping value, null for the entries that have none.
        count:
          type: [integer, "null"]
          description: How many entries the group holds in total, with `count=exact`.
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkItem" }
        page: { $ref: "#/components/schemas/PageInfo" }

    ItemQueryResult:
      type: object
      required: [data, groups, page, total]
      description: >
        `data` carries the rows of an ungrouped query and `groups` those of a grouped one. Both are
        always present, so that a client reads them unconditionally; the one that does not apply is
        empty. `page` is the walk of an ungrouped query - a grouped one has no single walk, so it
        then reports no successor and each group carries its own.
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkItem" }
        groups:
          type: array
          description: >
            One entry per distinct value of the grouping field, in the field's own order with the
            group of entries that have no value last. Empty without `group_by`.
          items: { $ref: "#/components/schemas/ItemQueryGroup" }
        page: { $ref: "#/components/schemas/PageInfo" }
        total:
          type: [integer, "null"]
          description: The size of the whole result with `count=exact`, null otherwise.

    BulkOperation:
      type: object
      description: >
        One operation of a bulk: which of the single-entry operations to carry out, on which entry,
        with the body that operation takes on its own.
      required: [op]
      properties:
        op:
          type: string
          description: >
            The operation. Each one is the same operation the route of the same name performs -
            CREATE_ITEM is POST /items, MOVE_ITEM is POST /items/{itemId}:move, ADD_LABEL is
            PUT /items/{itemId}/labels/{labelId}, and so on - so what a bulk may do is what a
            caller may do one entry at a time, never more.
          enum: [CREATE_ITEM, UPDATE_ITEM, COMPLETE_ITEM, REOPEN_ITEM, MOVE_ITEM, TRASH_ITEM, ADD_LABEL, REMOVE_LABEL, ASSIGN]
        item_id:
          type: string
          format: uuid
          description: >
            The entry the operation is about. Required by every operation except CREATE_ITEM, which
            has no entry yet.
        payload:
          type: object
          additionalProperties: true
          description: >
            What the single-entry operation takes in its body, by the field names it takes there. A
            field the operation does not know is refused by name rather than ignored.

    BulkResult:
      type: object
      description: >
        What one operation of a bulk did. Exactly one of `item` and `problem` is present, except
        for an operation that never ran because an atomic bulk was rolled back - which carries
        neither and says so by its status.
      required: [index, status]
      properties:
        index:
          type: integer
          description: The position of the operation in the request, counted from zero.
        status:
          type: integer
          description: >
            The status this operation would have answered on its own: 200 or 201 for one that was
            applied, the refusal's status for one that failed, and 409 for an operation of an
            atomic bulk that was rolled back because another one failed.
        item: { $ref: "#/components/schemas/WorkItem" }
        problem: { $ref: "#/components/schemas/Problem" }

    DuplicateResult:
      type: object
      description: >
        What a duplicate produced: the copy, what it could not carry over, and how big it was.
      required: [item, dropped_references, copied]
      properties:
        item: { $ref: "#/components/schemas/WorkItem" }
        dropped_references:
          type: array
          description: >
            Labels, buckets, members or custom fields the destination collection could not resolve
            and that the copy therefore does not carry (invariant I-W6: unresolvable references are
            reported back, never silently dropped). Always present; empty when nothing was lost.
          items:
            $ref: "#/components/schemas/DroppedReference"
        copied:
          type: integer
          description: How many entries the copy consists of, the copied entry itself included.

    Bucket:
      type: object
      description: >
        A column of a collection's board - the "list" of the requirements. It belongs to exactly one
        collection, and its name is unique there, compared without regard to case or accents.
      required: [id, collection_id, name, order_key, wip_limit, is_done_bucket, color_token, version]
      properties:
        id: { type: string, format: uuid }
        collection_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        order_key:
          type: string
          description: >
            The rank on the board - a fractional index rather than a number (offline-sync.md §4.2).
        wip_limit:
          type: [integer, "null"]
          minimum: 1
          description: >
            How many entries the people using this board agreed to have in the column at once.
            Advisory: nothing refuses the drop that exceeds it, because the requirement is that the
            column turns red rather than that the work becomes impossible. Null is no limit.
        is_done_bucket: { type: boolean, default: false }
        color_token:
          type: [string, "null"]
          description: >
            Always present, as null when unset - like wip_limit. A board renders both, and a field
            that appeared only once somebody had set it is one a client cannot read unconditionally.
        version:
          type: integer
          description: The optimistic lock, returned as the ETag and sent back as If-Match.

    BucketCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        before_bucket_id: { type: [string, "null"], format: uuid }
        wip_limit: { type: [integer, "null"] }
        is_done_bucket: { type: boolean, default: false }
        color_token: { type: [string, "null"] }

    BucketUpdate:
      type: object
      description: JSON Merge Patch; null deletes a field.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        wip_limit:
          type: [integer, "null"]
          minimum: 0
          description: >
            Null and 0 both remove the limit. Zero is not a limit anybody could satisfy, so nothing
            is lost by reading it that way, and it saves a client from a second field beside the
            number.
        is_done_bucket: { type: boolean }
        color_token: { type: [string, "null"] }

    BucketDeletion:
      type: object
      description: >
        What became of the entries that were in a deleted column. Reported rather than left to be
        discovered: a board that silently reassigned a person's cards would be indistinguishable
        from one that lost them.
      required: [bucket_id, target_bucket_id, moved_items]
      properties:
        bucket_id: { type: string, format: uuid }
        target_bucket_id:
          type: [string, "null"]
          format: uuid
          description: >
            The column the entries moved to - the leftmost remaining one. Null when this was the
            last column on the board, in which case the entries now carry none.
        moved_items:
          type: integer
          description: How many entries were moved.

    Label:
      type: object
      description: >
        A tag a collection defines and its entries carry. Defined on the collection rather than on
        the workspace: a label is a vocabulary the people working in one collection agree on, and a
        workspace-wide list would make every collection pay for every other's.
      required: [id, collection_id, name, color_token, description, version]
      properties:
        id: { type: string, format: uuid }
        collection_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        color_token:
          type: string
          minLength: 1
          description: >
            A theme token rather than a colour value, so clients render it in their own palette.
            Required: a label is rendered as a chip and nothing else.
        description:
          type: [string, "null"]
          description: Always present, as null when unset.
        version:
          type: integer
          description: The optimistic lock, returned as the ETag and sent back as If-Match.

    LabelCreate:
      type: object
      required: [name, color_token]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        color_token: { type: string, minLength: 1 }
        description: { type: [string, "null"] }

    ItemLabels:
      type: object
      description: >
        The labels one entry carries. Returned by adding and removing rather than the entry itself,
        because neither touches the entry's own row: a label lives beside it, and an entry whose
        version had moved would tell a client its title had changed too.
      required: [item_id, label_ids]
      properties:
        item_id: { type: string, format: uuid }
        label_ids:
          type: array
          items: { type: string, format: uuid }

    ItemMembers:
      type: object
      description: >
        The members one entry carries. Returned by adding and removing rather than the entry itself,
        for the reason ItemLabels is: neither touches the entry's own row, and an entry whose version
        had moved would tell a client its title had changed too.
      required: [item_id, member_ids]
      properties:
        item_id: { type: string, format: uuid }
        member_ids:
          type: array
          items: { type: string, format: uuid }

    Assignment:
      type: object
      description: Who the entry is assigned to.
      required: [account_id]
      properties:
        account_id:
          type: string
          format: uuid
          description: >
            The account to assign. It has to hold a membership on the path above the entry; one that
            does not is refused with the same answer as an account that does not exist.

    LabelUpdate:
      type: object
      description: JSON Merge Patch; null deletes a field.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        color_token:
          type: string
          minLength: 1
          description: >
            Cannot be cleared. A label is rendered as a chip and nothing else, so with no colour a
            client would have to invent one.
        description: { type: [string, "null"] }

    Comment:
      type: object
      required: [id, item_id, author_id, body, created_at, version]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        parent_comment_id: { type: [string, "null"], format: uuid }
        body:
          type: [string, "null"]
          description: >
            Null exactly when deleted_at is set: a deleted comment still answers with its
            identifier, author and timestamps, so a reply does not dangle - but its text is gone,
            not hidden.
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        version: { type: integer }


    Recurrence:
      type: object
      required: [id, item_id, rrule, time_zone, mode, horizon_days, created_at, version]
      properties:
        id: { type: string, format: uuid }
        item_id:
          type: string
          format: uuid
          description: The entry the series belongs to - the one the occurrences are copied from.
        rrule:
          type: string
          maxLength: 1024
          example: "FREQ=WEEKLY;BYDAY=MO"
          description: >
            An RFC 5545 recurrence rule, stored as it was given. The DTSTART is the entry's own
            due date rather than part of this string: a series is when this entry repeats, and two
            starts would be two answers to that.
        time_zone:
          type: string
          example: "Europe/Berlin"
          description: >
            The IANA zone the rule is read in, required. Daylight saving is resolved through it and
            never through a UTC offset, which is what keeps 09:00 at 09:00 across a transition
            (i18n-l10n.md §4).
        mode:
          $ref: "#/components/schemas/RecurrenceMode"
        horizon_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: >
            How far ahead occurrences are materialised, in days. A rolling window rather than the
            whole series: a rule with no end would otherwise be an infinite list of entries.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: When the series stops. At most one of ends_at and max_count.
        max_count:
          type: [integer, "null"]
          minimum: 1
          description: How many occurrences the series produces at most. At most one of the two.
        last_materialized_at:
          type: [string, "null"]
          format: date-time
          description: >
            How far the materialisation has come. The server's own bookkeeping - a client reads it
            and never writes it.
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        version: { type: integer }

    RecurrenceMode:
      type: string
      enum: [ON_SCHEDULE, ON_COMPLETION]
      description: >
        ON_SCHEDULE puts the next occurrence in place at its time, whether or not the last one was
        done - a rent payment does not wait. ON_COMPLETION creates the next one only once its
        predecessor is completed - a task that means "again, two weeks after I last did it"
        (arc42 §6.3).

    RecurrenceInput:
      type: object
      required: [rrule, time_zone, mode]
      properties:
        rrule: { type: string, maxLength: 1024, example: "FREQ=WEEKLY;BYDAY=MO" }
        time_zone: { type: string, example: "Europe/Berlin" }
        mode:
          $ref: "#/components/schemas/RecurrenceMode"
        horizon_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
        ends_at: { type: [string, "null"], format: date-time }
        max_count: { type: [integer, "null"], minimum: 1 }

    Template:
      type: object
      required: [id, scope_type, name, root_type, nodes, created_at, version]
      properties:
        id: { type: string, format: uuid }
        scope_type:
          $ref: "#/components/schemas/TemplateScope"
        scope_id:
          type: [string, "null"]
          format: uuid
          description: The container the template is defined in. Null for a workspace-wide one.
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        root_type:
          $ref: "#/components/schemas/ItemType"
        nodes:
          type: array
          description: >
            The tree, roots first. Each node carries its own children, so the document is the shape
            the template stamps out rather than a flat list with parent pointers.
          items:
            $ref: "#/components/schemas/TemplateNode"
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        version: { type: integer }

    TemplateScope:
      type: string
      enum: [TENANT, HUB, COLLECTION]
      description: >
        Where the template is defined and therefore who can use it: the whole workspace, one hub
        and everything under it, or one collection. Defining one workspace-wide is an
        administrator's act; defining one in a container follows the role matrix there.

    TemplateNode:
      type: object
      required: [type, title]
      properties:
        type:
          $ref: "#/components/schemas/ItemType"
        title: { type: string, maxLength: 500 }
        notes: { type: [string, "null"] }
        due_offset:
          type: [string, "null"]
          example: "P3D"
          description: >
            An ISO-8601 duration from the instantiation's anchor - P3D is "three days in", -P1D is
            "the day before". Absent for a node with no due date. Years and months are refused for
            the reason a reminder refuses them: they are calendar arithmetic rather than a length
            of time.
        due_date_only:
          type: boolean
          default: false
          description: True for a node whose due date is a day rather than a moment.
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: >
            Who this step always belongs to. The assignment rule a template can carry: a fixed
            person, because the collection's own policy already applies when an entry is created
            and naming it here would name what happens anyway. Reported and dropped when the
            person cannot see the target collection (I-W6).
        children:
          type: array
          items:
            $ref: "#/components/schemas/TemplateNode"

    TemplateInput:
      type: object
      required: [scope_type, name, root_type, nodes]
      properties:
        scope_type:
          $ref: "#/components/schemas/TemplateScope"
        scope_id: { type: [string, "null"], format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        root_type:
          $ref: "#/components/schemas/ItemType"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TemplateNode"

    TemplateUpdate:
      type: object
      description: A merge patch. An absent member is not touched; the node tree travels whole.
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TemplateNode"

    TemplateInstantiation:
      type: object
      required: [collection_id]
      properties:
        collection_id:
          type: string
          format: uuid
          description: The collection the tree lands in.
        parent_id:
          type: [string, "null"]
          format: uuid
          description: >
            The entry the tree hangs from, when the template's root type is one that sits under
            another. Absent puts it at the top level of the collection.
        anchor_date:
          type: [string, "null"]
          format: date
          description: >
            The day the relative dates count from, read in the caller's time zone. Absent anchors
            at the moment of the call.
        title:
          type: [string, "null"]
          maxLength: 500
          description: The root entry's title, overriding the template's own.

    TemplateInstance:
      type: object
      required: [template_id, root_item_id, created, dropped_references]
      properties:
        template_id: { type: string, format: uuid }
        root_item_id: { type: string, format: uuid }
        created:
          type: integer
          description: How many entries the template produced, the root included.
        dropped_references:
          type: array
          description: What the target collection could not carry (I-W6).
          items:
            $ref: "#/components/schemas/DroppedReference"

    TemplatePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        page:
          $ref: "#/components/schemas/PageInfo"

    Reminder:
      type: object
      required: [id, item_id, offset_spec, channels, recipients, state, created_at, version]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        offset_spec:
          type: string
          maxLength: 64
          example: "REL:-PT1H"
          description: >
            REL:<ISO-8601 duration> counted from the entry's due date - negative for before it -
            or ABS:<RFC 3339 instant>, a fixed moment. Years and months are refused in a duration:
            they are calendar arithmetic rather than a length of time, and a reminder that meant
            two different things in two months would be a promise this offset cannot keep.
        channels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReminderChannel"
        recipients:
          type: array
          items: { type: string, format: uuid }
          description: >
            Who is reminded. Empty means the assignee and the entry's members, resolved when the
            reminder fires rather than when it is written - so somebody added to the entry
            tomorrow is reached tomorrow.
        state:
          $ref: "#/components/schemas/ReminderState"
        fire_at:
          type: [string, "null"]
          format: date-time
          description: >
            The moment the server will fire at, and its value alone: for ABS the instant itself,
            for REL the due date plus the offset, recomputed whenever the due date moves. Null for
            a relative reminder whose entry has lost its due date - the reminder stays, because
            the date may come back and nobody asked for the reminder to go.
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        version: { type: integer }

    ReminderChannel:
      type: string
      enum: [EMAIL]
      description: >
        What carries the reminder. EMAIL is what this installation sends on; the channels arc42
        §5.2 names beside it arrive with the tasks that build them, and a client tolerates a value
        it does not know (offline-sync.md §9).

    ReminderState:
      type: string
      enum: [PENDING, SENT, CANCELLED]
      description: >
        Where the reminder stands, written by the server and never by a client: PENDING until it
        fires, SENT once it has, CANCELLED when it never will. Deleting a reminder removes it
        rather than cancelling it.

    ReminderInput:
      type: object
      required: [offset_spec]
      properties:
        offset_spec: { type: string, maxLength: 64, example: "REL:-PT1H" }
        channels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReminderChannel"
          description: Omitted means EMAIL, the one channel this installation sends on.
        recipients:
          type: array
          items: { type: string, format: uuid }
          description: >
            Omitted or empty means the assignee and the entry's members. Everybody named has to be
            able to reach the entry, exactly as an assignee has to (C-01).

    ReminderUpdate:
      type: object
      description: >
        A merge patch. An absent member is not touched; a member that is sent replaces what is
        stored, lists included - channels and recipients are chosen whole.
      properties:
        offset_spec: { type: string, maxLength: 64 }
        channels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReminderChannel"
        recipients:
          type: array
          items: { type: string, format: uuid }

    DataSubjectRequestKind:
      type: string
      description: |
        The right that was exercised. `RECTIFICATION` needs no special path - a correction is an
        ordinary write - and is a tracked case all the same, because the deadline is somebody's
        responsibility either way.
      enum: [ACCESS, ERASURE, PORTABILITY, RESTRICTION, OBJECTION, RECTIFICATION]

    DataSubjectRequestStatus:
      type: string
      enum: [RECEIVED, IN_PROGRESS, COMPLETED, REJECTED]

    DataSubjectRequestScope:
      type: string
      description: |
        How far the case reaches. `TENANT` is this workspace, which is what a controller answering
        for their own workspace means. `INSTALLATION` is every workspace of this installation in
        which the person is a member - the one operation in this system that legitimately crosses
        the tenant boundary, and it needs the `admin:tenants` scope, is audited in every workspace
        it touches, and is the provider's path rather than a tenant's.
      enum: [TENANT, INSTALLATION]

    ErasureMode:
      type: string
      description: |
        `ANONYMIZE` keeps the authorship as a former user and the workspace's content with it;
        `FULL_DELETE` takes the person's own contributions too. The choice rests with the
        controller, because tenant data touches third parties' rights (ADR-0018).
      enum: [ANONYMIZE, FULL_DELETE]

    DataSubjectRequest:
      type: object
      required: [id, kind, status, received_at, due_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DataSubjectRequestKind" }
        status: { $ref: "#/components/schemas/DataSubjectRequestStatus" }
        scope: { $ref: "#/components/schemas/DataSubjectRequestScope" }
        subject_account_id:
          type: [string, "null"]
          format: uuid
          description: The account the case is about, and null once a full deletion has taken it.
        subject_email:
          type: [string, "null"]
          description: Who asked, for a request that has no account behind it.
        erasure_mode: { $ref: "#/components/schemas/ErasureMode" }
        received_at: { type: string, format: date-time }
        due_at:
          type: string
          format: date-time
          description: The statutory deadline. Thirty days from receipt unless the caller named another.
        completed_at: { type: [string, "null"], format: date-time }
        handled_by: { type: [string, "null"], format: uuid }
        rejection_reason: { type: [string, "null"] }
        result_archive:
          type: [string, "null"]
          description: >
            Where the export was written at the backup target, once an access or portability case
            has produced one.
        result_target_id: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }

    DataSubjectRequestCreate:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/DataSubjectRequestKind" }
        scope: { $ref: "#/components/schemas/DataSubjectRequestScope" }
        subject_account_id: { type: string, format: uuid }
        subject_email: { type: string, format: email }
        due_at:
          type: string
          format: date-time
          description: The deadline, when it is not thirty days from receipt.
        notes: { type: string }
        target_id:
          type: string
          format: uuid
          description: >
            The backup target an access or portability export is written to. Required before such
            a case can start; a copy of somebody's data has to be put somewhere, and this system
            writes archives to configured targets rather than to a directory it chose itself.

    DataSubjectRequestUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/DataSubjectRequestStatus" }
        erasure_mode: { $ref: "#/components/schemas/ErasureMode" }
        handled_by: { type: string, format: uuid }
        rejection_reason:
          type: string
          description: Required when the case is rejected. A refusal without a reason is not an answer.
        notes: { type: string }
        target_id: { type: string, format: uuid }

    ProcessingState:
      type: object
      required: [account_id, status]
      description: |
        What the call set, rather than the person it was set on. A restriction touches nothing else
        about an account, and answering their name and address here would be answering more than
        the caller asked about.
      properties:
        account_id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, RESTRICTED] }

    ProcessingRestriction:
      type: object
      required: [restricted]
      properties:
        restricted: { type: boolean }
        reason:
          type: string
          description: Why, for the audit trail. The restriction is a decision somebody took.

    ConsentPurpose:
      type: string
      description: The optional processing a consent covers. Open rather than an enum, because a
        purpose is configuration - what an installation offers, not what this contract fixes.
      example: ai_processing

    ConsentRecord:
      type: object
      required: [id, purpose, granted]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: [string, "null"], format: uuid }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        granted: { type: boolean }
        granted_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"], enum: [user, tenant_admin, config, null] }

    ConsentWithdrawal:
      type: object
      required: [purpose]
      properties:
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        account_id:
          type: string
          format: uuid
          description: Whose consent. Omitted means the caller's own.
        reason: { type: string }

    AuditActor:
      type: object
      description: |
        Who acted, as the entry recorded them. The label is the one that was valid at the time and
        is stored denormalised: an entry that only pointed at a foreign key would become
        unreadable the moment the account was deleted, and a trail that loses its meaning through
        a deletion does not do its job (audit.md §2).
      properties:
        type: { type: string, enum: [USER, SERVICE_ACCOUNT, AUTOMATION, AI_AGENT, SYSTEM] }
        id: { type: [string, "null"], format: uuid }
        label: { type: [string, "null"] }
        on_behalf_of: { type: [string, "null"], format: uuid, description: The run_as principal for automation and agents }

    AuditTarget:
      type: object
      description: The object the entry is about.
      properties:
        type: { type: [string, "null"] }
        id: { type: [string, "null"], format: uuid }
        label: { type: [string, "null"] }

    AuditContext:
      type: object
      description: |
        The request the entry belongs to (audit.md §2). The address is truncated where the entry is
        written - IPv4 /24, IPv6 /48 - and the user agent is reduced to a class, because the trail
        is evidence about actions rather than a second analytics dataset.
      properties:
        request_id: { type: string }
        trace_id: { type: string }
        ip_prefix: { type: [string, "null"] }
        user_agent_class: { type: string }
        api_client: { type: string }
        rule_id: { type: string, format: uuid, description: The automation rule that acted }
        channel: { type: string, enum: [REST, MCP, AUTOMATION, SYSTEM, SYNC] }

    AuditChange:
      type: object
      description: |
        One changed field, masked per its classification (audit.md §4). An `OPEN` field carries
        `from` and `to`; a `SENSITIVE` one carries `changed` and the two hashes instead, which
        makes two entries comparable without either being readable; a `SECRET` one is not here at
        all.
      properties:
        field: { type: string }
        from: {}
        to: {}
        changed: { type: boolean }
        from_hash: { type: [string, "null"] }
        to_hash: { type: [string, "null"] }

    AuditEntry:
      type: object
      required: [id, occurred_at, action, outcome, actor]
      description: |
        Deliberately contains no user content (titles, notes, comments), so that the audit
        stays unaffected by deletion obligations on content.
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        occurred_at: { type: string, format: date-time }
        action: { type: string, example: membership.role_changed }
        outcome: { type: string, enum: [SUCCESS, DENIED, FAILED] }
        severity: { type: string, enum: [INFO, NOTICE, WARNING, CRITICAL] }
        actor: { $ref: "#/components/schemas/AuditActor" }
        target: { $ref: "#/components/schemas/AuditTarget" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/AuditChange" }
        context: { $ref: "#/components/schemas/AuditContext" }
        legal_basis: { type: [string, "null"] }
        hash: { type: string }

    AuditExportFormat:
      type: string
      description: |
        JSON Lines keeps the entry as it is - the nested actor, target, context and changes - and
        is what a second system reads. CSV flattens it for a spreadsheet, and what does not fit a
        column travels as JSON inside one.
      enum: [JSONL, CSV]

    AuditExport:
      type: object
      required: [from, to, target_id]
      description: |
        A period, a format, and where the archive goes. There is no filter beyond the period on
        purpose: an export is evidence about an interval, and one that had been narrowed by
        action or actor before it was signed would be evidence about somebody's selection.
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        format: { $ref: "#/components/schemas/AuditExportFormat" }
        target_id:
          type: string
          format: uuid
          description: The backup target the archive is written to.

    BackupTargetKind:
      type: string
      enum: [LOCAL, S3, SFTP, FTPS, FTP, WEBDAV, SMB, AZURE_BLOB, GCS, RCLONE, HTTP_PUT]

    BackupTarget:
      type: object
      required: [id, name, kind, encryption_mode]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/BackupTargetKind" }
        scope: { type: string, enum: [INSTANCE, TENANT] }
        config:
          type: object
          additionalProperties: true
          description: Endpoint, bucket, path, region - without credentials.
        encryption_mode: { type: string, enum: [AES256_GCM, NONE] }
        encryption_key_id: { type: [string, "null"] }
        region_note: { type: [string, "null"], description: Data residency; relevant for third-country targets }
        enabled: { type: boolean }
        last_test_at: { type: [string, "null"], format: date-time }
        last_test_ok: { type: [boolean, "null"] }
        warnings:
          type: array
          items: { type: string }
          description: "e.g. backup.target_unencrypted, backup.target_plaintext_protocol"

    BackupTargetCreate:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/BackupTargetKind" }
        config: { type: object, additionalProperties: true }
        credentials:
          type: object
          additionalProperties: true
          description: Only on create/update; stored encrypted and never returned.
        encryption_mode: { type: string, enum: [AES256_GCM, NONE], default: AES256_GCM }
        encryption_passphrase:
          type: [string, "null"]
          description: |
            Not stored. Without this value the archive is irrecoverably unreadable - the
            caller must keep it safe.
        insecure_acknowledged:
          type: boolean
          default: false
          description: "Mandatory for `FTP` or unencrypted storage (encryption_mode NONE)."

    BackupTargetProbe:
      type: object
      description: >
        What a write-read-delete against the target found. A target that could not be reached is a
        result rather than an error: it is what the caller asked to find out.
      required: [ok, latency_ms, writable, free_bytes, error_code]
      properties:
        ok: { type: boolean }
        latency_ms: { type: number }
        writable:
          type: boolean
          description: >
            Whether the write half worked. A target that can be read and not written is a
            permissions mistake somebody can act on, and it is the common one.
        free_bytes:
          type: [integer, "null"]
          description: >
            How much room is left, or `null` where the protocol cannot say. A bucket cannot say at
            all.
        error_code:
          type: [string, "null"]
          description: A message code, never the driver's message (ADR-0011).

    BackupArchive:
      type: object
      description: Read from the manifest at the target, not from the database.
      properties:
        archive_id: { type: string }
        path: { type: string }
        created_at: { type: string, format: date-time }
        mode: { type: string, enum: [FULL, INCREMENTAL] }
        parent_archive_id: { type: [string, "null"] }
        scope:
          type: object
          properties:
            kind: { type: string, enum: [INSTANCE, TENANT, HUB, COLLECTION] }
            id: { type: [string, "null"], format: uuid }
            label: { type: [string, "null"] }
        size_bytes: { type: integer }
        item_count: { type: integer }
        media_count: { type: integer }
        schema_version: { type: string }
        product_version: { type: string }
        encrypted: { type: boolean }
        encryption_key_id: { type: [string, "null"] }
        checksum_status: { type: string, enum: [UNVERIFIED, OK, MISMATCH] }
        complete:
          type: boolean
          description: >
            Whether the run that wrote it finished - whether `checksums.txt` is there. An archive
            without one is not damaged; it is a run still going or one that died, and the
            difference matters to whoever is deciding what to restore from.
        expires_at: { type: [string, "null"], format: date-time }

    BackupStart:
      type: object
      required: [target_id]
      description: A backup asked for by hand rather than by a schedule.
      properties:
        target_id: { type: string, format: uuid }
        mode:
          type: string
          enum: [FULL, INCREMENTAL]
          default: FULL
          description: >
            FULL by default, and deliberately: a run somebody asked for by hand is usually asked
            for because something is about to happen, and an incremental that turns out to have no
            parent at the target is the wrong thing to discover then. An INCREMENTAL with no
            parent is refused rather than quietly promoted.
        include_media: { type: boolean, default: true }
        include_audit: { type: boolean, default: true }

    BackupRun:
      type: object
      description: >
        One run of a backup. Its `id` is also the archive's id in the manifest at the target, which
        is what lets `:verify` and a restore name the same thing a caller already holds.
      required: [id, target_id, trigger, mode, status, started_at]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        schedule_id: { type: [string, "null"], format: uuid }
        parent_run_id:
          type: [string, "null"]
          format: uuid
          description: The archive this one continues, on an incremental run.
        trigger: { type: string, enum: [SCHEDULE, MANUAL, PRE_RESTORE, PRE_DELETE, API] }
        mode: { type: string, enum: [FULL, INCREMENTAL] }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED, EXPIRED] }
        archive_path: { type: [string, "null"], description: Where the archive lies at the target }
        size_bytes: { type: [integer, "null"] }
        item_count: { type: [integer, "null"] }
        media_count: { type: [integer, "null"] }
        snapshot_at:
          type: [string, "null"]
          format: date-time
          description: The instant the archive represents, taken from the database's own clock.
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error_code:
          type: [string, "null"]
          description: The message code of the failure, never a message and never free text.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the generation plan expects this archive to go. Null while nothing has decided.
        verified_at: { type: [string, "null"], format: date-time }
        verify_ok: { type: [boolean, "null"] }

    BackupSchedule:
      type: object
      required: [target_id, scope, rrule]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        target_id: { type: string, format: uuid }
        scope:
          type: object
          properties:
            kind: { type: string, enum: [INSTANCE, TENANT, HUB, COLLECTION] }
            id: { type: [string, "null"], format: uuid }
        rrule: { type: string, example: "FREQ=DAILY;BYHOUR=3;BYMINUTE=0" }
        timezone: { type: string, default: UTC }
        mode: { type: string, enum: [FULL, INCREMENTAL], default: INCREMENTAL }
        full_rrule: { type: [string, "null"], example: "FREQ=WEEKLY;BYDAY=SU" }
        include_media: { type: boolean, default: true }
        include_audit: { type: boolean, default: true }
        retention: { $ref: "#/components/schemas/BackupRetention" }
        notify_on:
          type: array
          items: { type: string, enum: [FAILURE, SUCCESS, FIRST_SUCCESS_AFTER_FAILURE] }
        enabled: { type: boolean, default: true }
        next_run_at: { type: [string, "null"], format: date-time, readOnly: true }

    BackupRetention:
      type: object
      description: The generation principle. `min_keep` prevents no backup being left at all.
      properties:
        keep_last: { type: integer, default: 7 }
        keep_daily: { type: integer, default: 14 }
        keep_weekly: { type: integer, default: 8 }
        keep_monthly: { type: integer, default: 12 }
        keep_yearly: { type: integer, default: 3 }
        min_keep: { type: integer, default: 3, minimum: 1 }

    RestoreRequest:
      type: object
      required: [target_id, archive_id, mode]
      properties:
        target_id: { type: string, format: uuid }
        archive_id: { type: string }
        mode: { type: string, enum: [INSPECT, SELECTIVE, MERGE, REPLACE_TENANT, NEW_TENANT, INSTANCE] }
        target_tenant_id: { type: [string, "null"], format: uuid }
        conflict_rule: { type: string, enum: [SKIP, OVERWRITE, DUPLICATE], default: SKIP }
        selection:
          type: object
          description: The selection for SELECTIVE - container and/or item IDs.
          properties:
            container_ids: { type: array, items: { type: string, format: uuid } }
            item_ids: { type: array, items: { type: string, format: uuid } }
        decryption_passphrase: { type: [string, "null"] }
        dry_run: { type: boolean, default: true }
        create_safety_backup: { type: boolean, default: true }
        confirmation:
          type: [string, "null"]
          description: For destructive modes, the exact tenant name.
        step_up_token:
          type: [string, "null"]
          description: >
            The proof of a fresh, stronger authentication for a destructive mode (§8.3). Sessions
            and MFA arrive in `0.6.0`; until an installation can issue one of these, a destructive
            restore is refused rather than silently permitted. A confirmation that is structurally
            impossible to give is a stronger position than one that is skipped.

    RestoreRun:
      type: object
      description: >
        One restore, asked for or done. Its report is what a dry run produces and what the mode
        without `dry_run` is judged against.
      required: [id, target_id, source_archive, mode, status, dry_run]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        source_archive:
          type: string
          description: >
            Where the archive lies at the target. A path rather than a run identifier, because a
            restore has to be possible when the database that recorded the run is gone.
        tenant_id: { type: [string, "null"], format: uuid, description: The tenant being restored into. }
        mode: { type: string, enum: [INSPECT, SELECTIVE, MERGE, REPLACE_TENANT, NEW_TENANT, INSTANCE] }
        conflict_rule: { type: string, enum: [SKIP, OVERWRITE, DUPLICATE] }
        dry_run: { type: boolean }
        status: { type: string, enum: [PENDING, VALIDATING, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        safety_backup_run_id:
          type: [string, "null"]
          format: uuid
          description: The copy taken before a destructive mode, and the way back from it.
        report: { $ref: "#/components/schemas/RestoreReport" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error_code:
          type: [string, "null"]
          description: The message code of the failure, never a message and never free text.

    RestoreReport:
      type: object
      description: >
        What a restore did, or - on a dry run - what it would do. The same shape either way, so
        that the report a caller approved and the report they get back are comparable.
      properties:
        new: { type: integer, description: Objects the archive holds and the tenant does not. }
        overwritten: { type: integer, description: Objects replaced by the archive's version. }
        skipped: { type: integer, description: Objects left as they are. }
        duplicated: { type: integer, description: Objects imported beside the live one under a new identity. }
        conflicts:
          type: integer
          description: >
            Collisions the conflict rule had to decide. It is the sum of the three ways one can be
            decided, and it is reported separately because "how much of this run is a decision I
            made in advance" is the question a dry run exists to answer.
        deleted:
          type: integer
          description: Objects the archive holds that the deletion journal kept out (§7).
        withheld:
          type: object
          additionalProperties: { type: integer }
          description: >
            What the restore deliberately did not bring back, counted by reason - `deletion_journal`,
            `excluded_entity`. An object rather than a total, so that a client can say why.
        media: { type: integer, description: Attachments transferred back into the object store. }
        entities:
          type: object
          additionalProperties: { type: integer }
          description: How many records each entity contributed.

    PurgeSummary:
      type: object
      description: What one pass of a removal did.
      required: [matched, removed, blocked]
      properties:
        matched:
          type: integer
          description: How many rows the pass considered, whether or not they went.
        removed:
          type: integer
          description: How many actually went.
        blocked:
          type: object
          additionalProperties: { type: integer }
          description: >
            What was kept, counted by reason - `legal_hold`, `tombstone_window`. An object rather
            than a total, so that a client can say why rather than only how many.

    TrashPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TrashEntry"
        page:
          $ref: "#/components/schemas/PageInfo"

    CommentPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        page:
          $ref: "#/components/schemas/PageInfo"

    ActivityPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        page:
          $ref: "#/components/schemas/PageInfo"

    ActivityEntry:
      type: object
      description: >
        One step of an entry's history. Append-only: nothing edits one, and what removes one is the
        deletion of the entry it belongs to.
      required: [id, item_id, code, actor, occurred_at, change_set]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        code:
          type: string
          description: >
            The message the client renders, from locales/*.json - activity.item_completed and the
            rest (i18n-l10n.md §1). A code rather than a sentence, so that one history reads in
            whichever language each client is set to.
          example: activity.item_completed
        actor:
          type: object
          description: >
            Who did it. The label is not here: the account is one request away and this record is
            deleted with its entry, so there is nothing for a copy of somebody's name to outlive.
          required: [type, id]
          properties:
            type:
              type: string
              enum: [USER, SERVICE_ACCOUNT, AUTOMATION, AI_AGENT, SYSTEM]
            id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
        change_set:
          type: object
          additionalProperties: true
          description: >
            The fields that moved, keyed by field name. A field the history keeps the values of
            carries `from` and `to` - each present only where there was a value on that side - and
            one it does not carries `changed: true`: a note is a page of text and its history is
            that somebody edited it. Empty where the step moved no field at all, and empty for
            every step of an activity's compact history.
          example:
            title: { from: Milk, to: Oat milk }
            notes: { changed: true }

    TrashEntry:
      type: object
      description: >
        One deletion, as the trash lists it. A projection rather than the object: it carries what the
        view shows and what restoring it needs, and reading the entry back in full is a second
        request to the object's own endpoint.
      required:
        [kind, id, trash_batch_id, deleted_at, title, subtype, hub_id, collection_id, parent_id, version]
      properties:
        kind:
          type: string
          enum: [CONTAINER, ITEM]
          description: Which of the two endpoints restores it.
        id: { type: string, format: uuid }
        trash_batch_id:
          type: string
          format: uuid
          description: >
            The deletion every row of one act shares. It is what a restore is keyed on, and what
            tells a client that two entries went together.
        deleted_at:
          type: string
          format: date-time
          description: When it went in, and the moment the retention period runs from.
        title:
          type: string
          description: The container's name or the entry's title.
        subtype:
          type: string
          description: HUB or COLLECTION for a container, TASK, WORK_PACKAGE or ACTIVITY for an entry.
        hub_id:
          type: [string, "null"]
          format: uuid
          description: >
            The hub it sits under. Null for a hub, which is its own level. Required and nullable
            rather than optional, like the two below it: this list mixes containers and entries by
            design, so a field that appeared only for some rows would be one a client could not read
            unconditionally.
        collection_id:
          type: [string, "null"]
          format: uuid
          description: The collection an entry belongs to. Null for a container.
        parent_id:
          type: [string, "null"]
          format: uuid
          description: Where it would go back to - the hub of a collection, the entry above an entry.
        version:
          type: integer
          description: The row's version, so a restore can be sent with the version it was read at.

    RetentionPolicy:
      type: object
      required: [scope, data_kind, retain_days, action]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        scope:
          type: object
          properties:
            kind: { type: string, enum: [TENANT, HUB, COLLECTION] }
            id: { type: [string, "null"], format: uuid }
        data_kind:
          type: string
          description: For the catalogue see data-retention.md; extensible through /meta/capabilities.
          example: COMPLETED_ITEM
        condition: { type: [string, "null"], description: An optional CEL expression }
        retain_days: { type: integer, minimum: 0 }
        action: { type: string, enum: [ARCHIVE, TRASH, ANONYMIZE, HARD_DELETE, EXPORT_THEN_DELETE, NOTIFY_ONLY] }
        then_after_days: { type: [integer, "null"] }
        then_action: { type: [string, "null"], enum: [ARCHIVE, TRASH, ANONYMIZE, HARD_DELETE, EXPORT_THEN_DELETE, null] }
        grace_days: { type: integer, default: 14 }
        notify:
          type: object
          properties:
            before_days: { type: integer, default: 7 }
            recipients:
              type: array
              items: { type: string, enum: [ITEM_MEMBERS, COLLECTION_ADMINS, TENANT_ADMINS] }
        justification: { type: [string, "null"], description: Mandatory when the upper bound is exceeded }
        enabled: { type: boolean, default: true }
        export_target_id: { type: [string, "null"], format: uuid }
        in_force:
          type: boolean
          readOnly: true
          description: >
            Whether this is the rule that would act in the container the listing was asked about
            (`container_id`). Absent from a listing that named no container: with nothing to be in
            force *in*, the question has no answer. The narrower rule wins, and a rule switched off
            in a collection lets the wider one through rather than stopping it.

    LegalHold:
      type: object
      description: >
        An instruction not to delete something. The first thing every deletion path checks, and the
        one that overrides a workspace's own configured periods.
      required: [id, scope, reason, placed_by, placed_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        scope:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [TENANT, CONTAINER, ITEM, ACCOUNT]
              description: >
                What the hold covers. TENANT names nothing because it covers everything; CONTAINER
                and ITEM name what they hold, and the hold reaches everything below it.
            id: { type: [string, "null"], format: uuid }
        reason:
          type: string
          description: >
            Why, in the words of whoever placed it. Operator content rather than user content, and
            it never travels into a metric or an event - an auditor and an operator reading a
            blocked run are the only readers.
        placed_by: { type: string, format: uuid, readOnly: true }
        placed_at: { type: string, format: date-time, readOnly: true }
        released_by: { type: [string, "null"], format: uuid, readOnly: true }
        released_at: { type: [string, "null"], format: date-time, readOnly: true }
        released_reason:
          type: [string, "null"]
          readOnly: true
          description: Why it was lifted. Present only on a hold that has been.

    LegalHoldCreate:
      type: object
      required: [scope, reason]
      properties:
        scope:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [TENANT, CONTAINER, ITEM, ACCOUNT] }
            id: { type: [string, "null"], format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    LegalHoldRelease:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the hold is being lifted. Required - "released" with no reason is an entry an auditor cannot act on.

    RetentionState:
      type: object
      description: Visible on the object for as long as a retention rule applies.
      properties:
        action: { type: string }
        effective_at: { type: string, format: date-time }
        policy_id: { type: string, format: uuid }
        can_retain: { type: boolean }
        blocked_by: { type: [string, "null"], enum: [legal_hold, restriction, null] }

    SyncPullRequest:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, format: uuid }
        cursor: { type: [string, "null"], description: Opaque; NULL means an initial synchronisation. }
        scopes:
          type: array
          items:
            type: object
            properties:
              container_id: { type: string, format: uuid }
              depth: { type: string, enum: [SELF, CHILDREN, SUBTREE], default: SUBTREE }
        limit: { type: integer, default: 500, maximum: 2000 }

    SyncChange:
      type: object
      required: [op, entity, entity_id]
      properties:
        op: { type: string, enum: [UPSERT, DELETE, ACCESS_REVOKED] }
        entity: { type: string, example: work_item }
        entity_id: { type: string, format: uuid }
        container_id: { type: [string, "null"], format: uuid }
        hlc: { type: string }
        payload:
          type: [object, "null"]
          additionalProperties: true
          description: The complete object for UPSERT; NULL for DELETE and ACCESS_REVOKED.

    SyncPullResponse:
      type: object
      required: [changes, cursor, has_more]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/SyncChange" }
        cursor: { type: string }
        has_more: { type: boolean }
        server_time: { type: string, format: date-time }
        tombstone_window_days: { type: integer, description: The maximum offline window before a forced resynchronisation }

    SyncMutation:
      type: object
      required: [op_id, kind]
      properties:
        op_id: { type: string, format: uuid, description: The idempotency key, valid for 30 days }
        kind: { type: string, enum: [ITEM_CREATE, ITEM_PATCH, ITEM_DELETE, SET_ADD, SET_REMOVE, MOVE, COMMENT_ADD] }
        item_id: { type: string, format: uuid, description: Assigned by the client (UUIDv7), including on CREATE }
        base_version: { type: [integer, "null"] }
        fields:
          type: object
          description: Per-field changes, each field with its own HLC.
          additionalProperties:
            type: object
            properties:
              value: {}
              hlc: { type: string }
        set: { type: [string, "null"], enum: [labels, members, watchers, null] }
        element: { type: [string, "null"], format: uuid }
        hlc: { type: [string, "null"] }
        payload: { type: [object, "null"], additionalProperties: true }

    SyncPushRequest:
      type: object
      required: [device_id, mutations]
      properties:
        device_id: { type: string, format: uuid }
        mutations:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/SyncMutation" }

    SyncMutationResult:
      type: object
      required: [op_id, result]
      properties:
        op_id: { type: string, format: uuid }
        result: { type: string, enum: [APPLIED, MERGED, REJECTED, CONFLICT] }
        entity_id: { type: [string, "null"], format: uuid }
        server_state: { type: [object, "null"], additionalProperties: true }
        conflict:
          type: [object, "null"]
          description: Both versions on CONFLICT; the displaced one is preserved as a system comment.
          properties:
            field: { type: string }
            mine: {}
            theirs: {}
            preserved_comment_id: { type: [string, "null"], format: uuid }
        error:
          type: [object, "null"]
          properties:
            code: { type: string, example: sync.gone }
            message_code: { type: string }

    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SyncMutationResult" }
        cursor: { type: [string, "null"], description: The cursor after application, saving a pull. }
        server_time: { type: string, format: date-time }

    SyncDevice:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        last_seen_at: { type: [string, "null"], format: date-time }
        last_cursor: { type: [string, "null"] }
        blocked: { type: boolean }

    JobStatus:
      type: string
      description: >
        What a caller sees of a job's life. Five states rather than the queue's six: a job the
        queue gave up on is `FAILED`, because "it did not work and will not be tried again" is
        the whole of what a caller can act on, and the dead letter is an operator's word for
        where the row went.
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    JobRef:
      type: object
      description: >
        The pointer a `202 Accepted` hands back. It is the same shape as `Job`, narrowed to what
        is knowable at the moment the work was accepted.
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress: { type: [number, "null"] }
        result_url: { type: [string, "null"] }

    Job:
      type: object
      description: >
        Background work, as the caller who asked for it sees it. Deliberately narrow: the queue's
        row also carries the payload, the attempt count, the lease and the deduplication key, and
        all four are the queue's business rather than a caller's - a payload can name objects the
        caller may not resolve, and an attempt count invites a client to reason about a retry
        policy that is not part of the contract. Widening this later is additive; narrowing it
        would not be.
      required: [job_id, status, progress, result_url, error_code, created_at, finished_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: >
            How far along, between 0 and 1, or `null` from a job that cannot say. `null` is the
            honest answer rather than a number nobody computed - a client renders an
            indeterminate bar for it.
        result_url:
          type: [string, "null"]
          description: Where what the job produced can be fetched, once there is something.
        error_code:
          type: [string, "null"]
          description: >
            The message code of the last failure, never a message and never free text
            (ADR-0011). Set on a `FAILED` job, and on a job that is being retried.
        created_at: { type: string, format: date-time }
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the job reached a terminal state. `null` while it has not.

    HealthStatus:
      type: string
      enum: [ok, degraded, down, disabled]

    DependencyHealth:
      type: object
      required: [name, required, status]
      properties:
        name: { type: string, example: object_storage }
        required:
          type: boolean
          description: A mandatory dependency; only PostgreSQL is mandatory.
        status: { $ref: "#/components/schemas/HealthStatus" }
        latency_ms: { type: [number, "null"] }
        since:
          type: [string, "null"]
          format: date-time
          description: The time of the last state change.
        last_error_code:
          type: [string, "null"]
          description: A stable error code, not free text and not a third-party message.
        circuit_state:
          type: [string, "null"]
          enum: [closed, half_open, open, null]
        impact:
          type: array
          description: The features affected during a disruption.
          items: { type: string }

    DegradedFeature:
      type: object
      required: [feature, reason_code, since]
      properties:
        feature: { type: string, example: media }
        reason_code: { type: string, example: dependency.unavailable }
        since: { type: string, format: date-time }

    HealthWarning:
      type: object
      required: [code, severity]
      properties:
        code:
          type: string
          description: A message code, translatable on the client side.
          example: config.backup_not_configured
        severity: { type: string, enum: [info, warn, critical] }
        params:
          type: object
          additionalProperties: true

    HealthReport:
      type: object
      required: [status, version, dependencies]
      description: |
        Machine-readable self-diagnosis. `warnings` names what the installation is missing,
        without an error having occurred (a missing backup, missing SMTP with reminders
        enabled, expiring keys).
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        version: { type: string }
        role:
          type: array
          items: { type: string, enum: [api, worker, scheduler, automation] }
        migration:
          type: object
          properties:
            applied: { type: integer }
            expected: { type: integer }
            status: { type: string, enum: [ok, behind, ahead] }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/DependencyHealth" }
        degraded_features:
          type: array
          items: { $ref: "#/components/schemas/DegradedFeature" }
        backlogs:
          type: object
          properties:
            outbox_pending: { type: integer }
            outbox_lag_seconds: { type: number }
            job_queue_depth: { type: integer }
            dead_letter_total: { type: integer }
            webhook_retry_backlog: { type: integer }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/HealthWarning" }

    QueryField:
      type: object
      required: [field, kind, operators, nullable, sortable, groupable]
      description: One field `POST /items:query` accepts, and what may be asked of it.
      properties:
        field: { type: string }
        kind:
          type: string
          enum: [string, text, id, boolean, integer, timestamp, enum, id_set]
          description: >
            What a value for this field looks like. `text` is free text a full-text operator
            reads, `id_set` a relation an entry has several of.
        operators:
          type: array
          description: >
            The comparisons this field permits, exhaustively. Empty for a field that may only be
            ordered or grouped by.
          items: { type: string }
        values:
          type: array
          description: The permitted values, for a field of kind `enum`.
          items: { type: string }
        nullable:
          type: boolean
          description: Whether the field can be absent, and `IS_NULL` therefore means something.
        sortable: { type: boolean }
        groupable: { type: boolean }

    Capabilities:
      type: object
      description: Self-description; clients configure themselves from this.
      properties:
        product_version: { type: string }
        api_version: { type: string }
        tenancy_mode: { type: string, enum: [single, multi] }
        item_types:
          type: array
          items:
            type: object
            properties:
              type: { $ref: "#/components/schemas/ItemType" }
              capabilities:
                type: array
                items: { type: string }
              allowed_child_types:
                type: array
                items: { $ref: "#/components/schemas/ItemType" }
              max_depth: { type: integer }
        view_layouts:
          type: array
          items: { type: string }
        query_fields:
          type: array
          description: >
            What `POST /items:query` accepts. A client builds its filter editor from this rather
            than from a hard-coded list, because the set grows with the installation's features -
            a field whose use case this version does not have is not in it, and filtering on it is
            refused rather than silently matching nothing.
          items: { $ref: "#/components/schemas/QueryField" }
        text_languages:
          type: array
          description: >
            The languages this installation can index the text of, as BCP-47 tags, and what a
            client's language picker for `content_language` is built from. It is the
            installation's answer rather than the product's: the mapping from a tag to a text
            search configuration is in the database, and which of those configurations exist is
            what its PostgreSQL was built with (ADR-0034). A language that is not in this list is
            not refused - an entry declaring one is stored and matched word by word, which is the
            same treatment a script without word boundaries gets.
          items: { type: string }
        supported_locales:
          type: array
          items:
            type: object
            properties:
              locale: { type: string }
              direction: { type: string, enum: [ltr, rtl] }
              week_start: { type: string }
        automation:
          type: object
          properties:
            triggers:
              type: array
              items: { type: string }
            actions:
              type: array
              items: { type: string }
        event_types:
          type: array
          items: { type: string }
        roles:
          type: array
          description: >
            The role matrix as this installation enforces it (domain-model.md §3.2). A client
            decides from this which actions to offer, rather than from a table compiled into it:
            two cells of the matrix are qualifiers no permission name can carry - a contributor
            writes only what is assigned to them, and a guest may comment on an entry without
            being able to change it - and a client that does not know them offers buttons the
            server refuses.
          items: { $ref: "#/components/schemas/RoleDescription" }
        limits:
          type: object
          additionalProperties: true
        features:
          type: object
          additionalProperties: { type: boolean }

    RoleDescription:
      type: object
      description: >
        One row of the role matrix: the permissions the role carries, and what it may do to a
        single entry.

        Every cell is bounded by where the membership was granted. The role applies downwards from
        its scope - tenant, hub, collection, or one entry - so a role granted at `ITEM` scope
        reaches that entry and nothing else. That is what sharing an entry with a guest is; it
        needs no separate mechanism and is therefore not a property of the role.
      properties:
        role: { $ref: "#/components/schemas/MembershipRole" }
        permissions:
          type: array
          description: The columns of the matrix this role carries unqualified.
          items:
            type: string
            enum: [READ, WRITE_ITEMS, STRUCTURE, MANAGE_MEMBERS, AUTOMATION, DELETE_CONTAINER]
        item_access: { $ref: "#/components/schemas/RoleItemAccess" }

    RoleItemAccess:
      type: object
      description: >
        What a role does to a single entry, per kind of access. Every kind is answered, including
        the ones that are `NONE`: an absent one would leave a client guessing, and guessing wrong
        in the permissive direction is what this endpoint exists to prevent.
      properties:
        read: { $ref: "#/components/schemas/ItemAccess" }
        create: { $ref: "#/components/schemas/ItemAccess" }
        change: { $ref: "#/components/schemas/ItemAccess" }
        comment: { $ref: "#/components/schemas/ItemAccess" }

    ItemAccess:
      type: string
      description: >
        How far a role reaches into one entry.

        `ALL` is unqualified. `ASSIGNED` is only where the actor is the entry's assignee - which is
        what the matrix's "assigned only" cell means, and why a contributor's `create` is `ALL`
        while their `change` is not: a created entry is assigned to its creator, so the qualifier
        holds at every moment rather than being suspended for the one call that would break it.
        `NONE` is never, whatever the membership.
      enum: [ALL, ASSIGNED, NONE]
