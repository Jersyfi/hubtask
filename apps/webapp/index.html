     until the account preference exists (W-07). The stylesheet has no :root fallback on purpose,
     so a boot path that forgets the module shows itself immediately. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hubtask</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
