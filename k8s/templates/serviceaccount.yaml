{{/*
A service account of its own, so that the pods do not run as the namespace's default - and so that
the token they carry can be taken away. Nothing in Hubtask talks to the Kubernetes API, which is
why automountServiceAccountToken is off: a token that is never used is a token that should not be
in the pod (ADR-0015).
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hubtask.fullname" . }}
  labels: {{- include "hubtask.labels" (dict "root" .) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
