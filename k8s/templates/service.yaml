{{/*
Two services, because they answer two different questions.

The first is the API: what an ingress or another workload in the cluster talks to. It carries the
interactive port only - the operations port is not something a route should be able to reach
(observability-reliability.md §3.2).

The second is for scraping and selects every role, because every role has metrics and health of its
own. It is headless: Prometheus wants the pods, not one of them chosen by a load balancer.
*/}}
{{- if .Values.roles.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hubtask.fullname" . }}-api
  labels: {{- include "hubtask.labels" (dict "root" . "role" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "hubtask.selectorLabels" (dict "root" . "role" "api") | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hubtask.fullname" . }}-metrics
  labels: {{- include "hubtask.labels" (dict "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: ops
      port: 9090
      targetPort: ops
      protocol: TCP
  # No component label: this one deliberately spans every role.
  selector: {{- include "hubtask.selectorLabels" (dict "root" .) | nindent 4 }}
