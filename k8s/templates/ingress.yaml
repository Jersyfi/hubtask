{{/*
The route in, when there is one. Off by default: an installation reached from inside the cluster,
or through a gateway the operator manages elsewhere, should not have an object here it did not ask
for.

Only the interactive port is routed. The operations port carries metrics and the health report, and
neither belongs on the public internet (observability-reliability.md §3.2).
*/}}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled needs ingress.host: a route without a host name matches every request that reaches the controller." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hubtask.fullname" . }}
  labels: {{- include "hubtask.labels" (dict "root" . "role" "api") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{/*
  One route per host, and every host on one certificate. An installation that serves several
  workspaces is reached by their subdomains (multi-tenancy.md §3), so the name in the browser's
  address bar is not always the installation's own - and a certificate that does not cover it is a
  page a browser refuses before the application is asked anything.

  In production the operator names one wildcard and the platform issues the matching certificate,
  which is why one entry was enough until now. An operator issuing per host - cert-manager over
  HTTP-01 cannot do wildcards - needs to name each one.
  */}}
  {{- $hosts := prepend (.Values.ingress.extraHosts | default list) .Values.ingress.host }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ range $i, $h := $hosts }}{{ if $i }}, {{ end }}{{ $h | quote }}{{ end }}]
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "hubtask.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $host := $hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hubtask.fullname" $ }}-api
                port:
                  name: http
    {{- end }}
{{- end }}
