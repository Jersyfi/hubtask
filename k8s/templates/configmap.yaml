{{/*
Everything an operator sets that is not a secret. One object for every role: the roles differ in
one variable, and that one is set on the pod (see _helpers.tpl).

A change here rolls the pods, because every deployment carries a checksum of this object as a pod
annotation. Without that, a configuration change would take effect at the next unrelated deploy and
nobody could say when it started.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hubtask.fullname" . }}
  labels: {{- include "hubtask.labels" (dict "root" .) | nindent 4 }}
data:
  # The ports the probes and the service refer to. Set explicitly rather than left to the image's
  # defaults: two places name these numbers, and they have to agree.
  HUBTASK_HTTP_ADDR: ":8080"
  HUBTASK_OPS_ADDR: ":9090"

  HUBTASK_TENANCY_MODE: {{ .Values.config.tenancyMode | quote }}
  HUBTASK_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  HUBTASK_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.baseUrl }}
  HUBTASK_BASE_URL: {{ .Values.config.baseUrl | quote }}
  {{- end }}
  # Off by default: in provider operation the tenant label multiplies every use case series by the
  # number of tenants (observability-reliability.md §3.2).
  HUBTASK_METRICS_TENANT_LABEL: {{ .Values.config.metricsTenantLabel | quote }}

  # The shutdown budget and the pod's grace period are two halves of one number: the pod must not
  # be killed while the process is still draining (deployment.md §5).
  HUBTASK_SHUTDOWN_GRACE_SECONDS: {{ .Values.config.shutdownGraceSeconds | quote }}
  HUBTASK_JOB_TIMEOUT: {{ .Values.config.jobTimeout | quote }}

  HUBTASK_STORAGE_KIND: {{ .Values.storage.kind | quote }}
  {{- if eq .Values.storage.kind "s3" }}
  HUBTASK_S3_BUCKET: {{ .Values.storage.bucket | quote }}
  HUBTASK_S3_REGION: {{ .Values.storage.region | quote }}
  {{- if .Values.storage.endpoint }}
  HUBTASK_S3_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.config.egressAllowedHosts }}
  # The egress allowlist is mandatory in provider operation (T-07); without it /meta/health warns.
  HUBTASK_HTTP_ALLOWED_HOSTS: {{ join "," .Values.config.egressAllowedHosts | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
