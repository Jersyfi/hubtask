#
# The provider alert set (observability-reliability.md §10): what joins the self-hosting
# file and the tenant file when this system is operated for other people, with an on-call rota
# and an error budget. A provider loads all three files; a self-hoster loads only the first and
# is deliberately never paged by anything in here.
#
# The burn-rate pair A-01/A-02 is the multiwindow shape: each alert needs its long window - which
# says the budget is genuinely being spent - AND a short window, which says the spending is still
# happening now. Without the short window the alert keeps firing long after the outage ended,
# because the long window remembers it. The arithmetic lives in RB-A01-acute-burn.md.
#
# Every rule carries a `runbook` annotation naming a file under deploy/observability/runbooks/,
# and the gate in test/observability enforces the pairing in both directions. The thresholds are
# the catalogue's starting values.
groups:
  - name: hubtask-slo
    interval: 30s
    rules:
      # SLO-1's indicator, recorded at every window the burn alerts read: the share of requests
      # answered 5xx. A request that timed out client-side appears as whatever status the
      # middleware finally wrote - SLO-1's "without a timeout" half has no series of its own, and
      # the 5xx share is the measurable part. clamp_min keeps a quiet installation at ratio 0
      # instead of NaN, which would otherwise make every burn alert unevaluable at night.
      - record: hubtask:slo1_error_ratio:rate5m
        expr: >
          sum(rate(hubtask_http_requests_total{status_class="5xx"}[5m]))
          / clamp_min(sum(rate(hubtask_http_requests_total[5m])), 1e-9)
      - record: hubtask:slo1_error_ratio:rate30m
        expr: >
          sum(rate(hubtask_http_requests_total{status_class="5xx"}[30m]))
          / clamp_min(sum(rate(hubtask_http_requests_total[30m])), 1e-9)
      - record: hubtask:slo1_error_ratio:rate1h
        expr: >
          sum(rate(hubtask_http_requests_total{status_class="5xx"}[1h]))
          / clamp_min(sum(rate(hubtask_http_requests_total[1h])), 1e-9)
      - record: hubtask:slo1_error_ratio:rate6h
        expr: >
          sum(rate(hubtask_http_requests_total{status_class="5xx"}[6h]))
          / clamp_min(sum(rate(hubtask_http_requests_total[6h])), 1e-9)

  - name: hubtask-provider
    interval: 30s
    rules:
      # A-01. Burn rate 14 means the 30-day budget of SLO-1 (0.1% of requests) is being spent
      # 14 times too fast - gone in about two days. The 1h window carries the verdict, the 5m
      # window confirms it is still happening, and `for: 2m` rides out a single bad scrape.
      - alert: HubtaskErrorBudgetBurnAcute
        expr: >
          hubtask:slo1_error_ratio:rate1h > (14 * 0.001)
          and
          hubtask:slo1_error_ratio:rate5m > (14 * 0.001)
        for: 2m
        labels:
          severity: page
          alert_id: A-01
        annotations:
          summary: "SLO-1's error budget is burning at more than 14x - an acute outage"
          description: >
            More than 1.4% of requests are failing with a 5xx, sustained over the last hour and
            still happening in the last five minutes. At this rate the 30-day budget is gone in
            two days.
          runbook: RB-A01-acute-burn.md

      # A-02. Burn rate 6 over six hours: nothing is on fire, but the budget is quietly going -
      # gone in five days. The 30m window keeps it from paging for a burn that already stopped.
      - alert: HubtaskErrorBudgetBurnCreeping
        expr: >
          hubtask:slo1_error_ratio:rate6h > (6 * 0.001)
          and
          hubtask:slo1_error_ratio:rate30m > (6 * 0.001)
        for: 15m
        labels:
          severity: page
          alert_id: A-02
        annotations:
          summary: "SLO-1's error budget is burning at more than 6x - a creeping outage"
          description: >
            More than 0.6% of requests have failed with a 5xx across the last six hours, and the
            last half hour looks the same. Slow enough to miss, fast enough to spend the month's
            budget in five days.
          runbook: RB-A02-creeping-burn.md

      # A-06. Rising for the whole window, not merely deep: a busy queue with a stable backlog is
      # working, and a queue whose depth only ever goes up is not keeping up. `for: 15m` on top of
      # the 15m delta demands half an hour of one-way growth before anybody is ticketed.
      - alert: HubtaskQueueNotKeepingUp
        expr: delta(hubtask_job_queue_depth[15m]) > 0 and hubtask_job_queue_depth > 10
        for: 15m
        labels:
          severity: ticket
          alert_id: A-06
        annotations:
          summary: "The {{ $labels.job_type }} backlog has done nothing but grow"
          description: >
            The pending count for this job kind has risen throughout the last half hour.
            Processing is not keeping up with what is being scheduled.
          runbook: RB-A06-queue-growth.md

      # A-09. SLO-6's error rate over its own shape: the 4xx class is the recipient's fault and
      # is excluded, exactly as §2 words the objective. A quiet installation divides by the
      # clamp and reads 0.
      - alert: HubtaskWebhookDeliveryFailing
        expr: >
          sum(rate(hubtask_webhook_deliveries_total{result!="ok",status_class!="4xx"}[30m]))
          / clamp_min(sum(rate(hubtask_webhook_deliveries_total[30m])), 1e-9)
          > 0.2
        for: 10m
        labels:
          severity: ticket
          alert_id: A-09
        annotations:
          summary: "More than 20% of webhook attempts are failing"
          description: >
            Excluding recipient-side 4xx answers, at least a fifth of webhook deliveries over
            the last half hour did not get through. Targets are down, or egress is broken.
          runbook: RB-A09-webhook-failures.md

      # A-10. State 2 is open: the breaker gave up on the dependency and is refusing calls
      # outright. Ten minutes open is past "blip" - somebody's integration is persistently down.
      - alert: HubtaskCircuitBreakerOpen
        expr: hubtask_circuit_breaker_state == 2
        for: 10m
        labels:
          severity: ticket
          alert_id: A-10
        annotations:
          summary: "The breaker for {{ $labels.dependency }} has been open for 10 minutes"
          description: >
            Calls to this dependency are being refused without being attempted. Whatever the
            feature that needs it does now, it does degraded.
          runbook: RB-A10-breaker-open.md

      # A-11. Utilisation, not absolute numbers: in_use over the configured max, per pool. The
      # max rides the same series as a third state precisely so this division needs no
      # configuration knowledge.
      - alert: HubtaskPoolNearSaturation
        expr: >
          sum by (pool) (hubtask_db_pool_connections{state="in_use"})
          / clamp_min(sum by (pool) (hubtask_db_pool_connections{state="max"}), 1)
          > 0.8
        for: 10m
        labels:
          severity: ticket
          alert_id: A-11
        annotations:
          summary: "The {{ $labels.pool }} pool has run above 80% for 10 minutes"
          description: >
            Four out of five connections are in use, sustained. The next slow query or small
            spike turns into waiting - this is the warning before the outage, not the outage.
          runbook: RB-A11-pool-saturation.md

      # A-13. Every pod reports the migration its build embeds; a spread means a rollout in
      # flight, and a spread that holds for 15 minutes means one that is stuck.
      - alert: HubtaskMigrationVersionsDiverge
        expr: (max(hubtask_migration_version) - min(hubtask_migration_version)) > 0
        for: 15m
        labels:
          severity: ticket
          alert_id: A-13
        annotations:
          summary: "The cluster is running two different migration versions"
          description: >
            Pods disagree about which migration their build embeds, and have for 15 minutes. A
            rolling update is stuck halfway - old and new code are serving side by side.
          runbook: RB-A13-migration-drift.md

      # A-14. The counter carries the warn-severity startup findings /meta/health shows - a
      # hard-invalid variable stops the process and can never be counted. Greater than zero is
      # the condition; there is no rate, because the count only moves at startup.
      - alert: HubtaskMisconfigured
        expr: hubtask_config_invalid_total > 0
        for: 5m
        labels:
          severity: ticket
          alert_id: A-14
        annotations:
          summary: "The process is running with flagged configuration ({{ $labels.key }})"
          description: >
            A startup check flagged this configuration key and the process is running without
            what it names. The same finding is in /meta/health's warnings, with parameters.
          runbook: RB-A14-misconfiguration.md

      # A-15, first half. Failed auth attempts against the traffic on the auth routes: above 5%
      # somebody is guessing, or a client is broken, or a secret rotated without its consumer.
      #
      # The denominator matches the route label as the process emits it: the router's template is
      # the method followed by the full path under /api/v1 ("POST /api/v1/auth/sessions"), and a
      # Prometheus regex is anchored at both ends. Sign-in and refresh are the two POSTs; listing
      # and revoking sessions are not authentication attempts and stay out of the denominator.
      - alert: HubtaskAuthFailureRate
        expr: >
          sum(rate(hubtask_auth_failures_total[15m]))
          / clamp_min(sum(rate(hubtask_http_requests_total{route=~"POST .*/auth/sessions(:refresh)?"}[15m])), 1e-9)
          > 0.05
        for: 10m
        labels:
          severity: ticket
          alert_id: A-15
        annotations:
          summary: "More than 5% of authentication attempts are being refused"
          description: >
            The refusal rate across sign-in and refresh is above one in twenty. Either a
            credential-stuffing attempt, or a client somewhere is misconfigured and retrying.
          runbook: RB-A15-auth-failures.md

      # A-15, second half. One reuse of a rotated refresh token means two holders of one
      # credential - the server has already revoked the family; this pages the human. No `for`: a single
      # occurrence is the event.
      - alert: HubtaskRefreshTokenReused
        expr: increase(hubtask_auth_failures_total{reason="refresh_reused"}[15m]) > 0
        labels:
          severity: page
          alert_id: A-15
        annotations:
          summary: "A rotated refresh token was presented again - possible token theft"
          description: >
            Somebody used a refresh token that had already been rotated away. The session family
            is already revoked; what needs a person is the question of how there were two holders.
          runbook: RB-A15-auth-failures.md

      # A-16. The engine's self-protection became visible: a rule failed often enough in a row
      # to be switched off. The owner was notified by the product; the ticket exists because
      # a pattern of these is a product defect, not a user problem.
      - alert: HubtaskRuleSelfDisabled
        expr: increase(hubtask_rule_disabled_total[1h]) > 0
        labels:
          severity: ticket
          alert_id: A-16
        annotations:
          summary: "An automation rule switched itself off ({{ $labels.reason }})"
          description: >
            The consecutive-failures protection disabled at least one rule in the last hour. The
            owner has been notified; this ticket is for finding out what kept failing.
          runbook: RB-A16-rule-disabled.md

      # A-17. Hubtask's own key material does not expire - TLS is terminated in front of it, and
      # in our operation the certificates are cert-manager's. This reads cert-manager's exporter
      # where one is scraped, and stays dormant (no series, no absent()) where none is - the
      # A-20 precedent for a rule that is ahead of one environment's wiring.
      - alert: HubtaskCertificateExpiring
        expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (14 * 24 * 3600)
        for: 1h
        labels:
          severity: ticket
          alert_id: A-17
        annotations:
          summary: "A certificate expires in under 14 days"
          description: >
            cert-manager reports a certificate within two weeks of its end and renewal has not
            happened. Renewal is supposed to be automatic - it firing means the automation broke.
          runbook: RB-A17-certificate-expiry.md

      # A-21. The installation's events wait to reach the purchase platform: deliveries ended as
      # dead letters, and an installation subscription is never switched off for it - the
      # operator is told here, and redelivers once the platform is reachable (UC-INS-14). The
      # gauge is sampled by the scheduler leader, so it falls when the dead letters are
      # redelivered or swept, and the alert with it; max() reads the one leader's series.
      - alert: HubtaskPlatformDeadLetters
        expr: max(hubtask_platform_dead_letters) > 0
        for: 15m
        labels:
          severity: ticket
          alert_id: A-21
        annotations:
          summary: "Events wait to be redelivered to the purchase platform"
          description: >
            Deliveries of the installation's events to a platform subscription ended without
            arriving. The subscription stays on and the events wait; the platform can also read
            them from GET /admin/events. Redeliver from the installation screen or hubctl once the
            platform answers again.
          runbook: RB-A21-platform-dead-letters.md

      # A-22. Live document awareness does not reach the other replicas: co-editors connected to
      # different replicas stop seeing each other's cursors and presence, while the document's
      # own words still arrive (they are stored and woken separately). Awareness is best effort
      # and never the connection's error, so this counter is the only place it shows.
      - alert: HubtaskAwarenessRelayFailing
        expr: sum(rate(hubtask_realtime_awareness_relayed_total{outcome="failed"}[10m])) > 0
        for: 15m
        labels:
          severity: ticket
          alert_id: A-22
        annotations:
          summary: "Co-editors on different replicas do not see each other"
          description: >
            Awareness - cursors and presence on a live document - could not be handed to the
            other replicas for a quarter of an hour. Editing still works and every word arrives;
            people on different replicas only miss each other's cursors.
          runbook: RB-A22-awareness-relay.md

      # A-23. Uploads wait for a malware scan the daemon does not give: a held file can be
      # attached but nobody can download it until the scan settles it (UC-MED-01 check 10). The
      # media.scan job retries every five minutes on its own, so a short daemon restart resolves
      # itself; an hour of it is the scanner down or scanning switched off with files held. Not in
      # the self-hosting set: the bytes are kept, nothing is lost by waiting. max() reads the one
      # leader's series.
      - alert: HubtaskUploadsHeldForScan
        expr: max(hubtask_media_scan_held_workspaces) > 0
        for: 1h
        labels:
          severity: ticket
          alert_id: A-23
        annotations:
          summary: "Uploads wait for a malware scan"
          description: >
            Files confirmed while the scanner did not answer are held and cannot be downloaded
            until it does. Check the daemon at HUBTASK_CLAMD_ADDRESS; the scan job settles the
            held files by itself once it answers.
          runbook: RB-A23-uploads-held-for-scan.md

      # A-24. A live document's log is not compacted: its writers do not answer the server's
      # request for a snapshot (offline-sync.md SY-F), so each opening replays a longer log.
      # Counted past five rounds of asking, before reconnects slow down; at ten rounds the log
      # refuses new updates until a snapshot comes, which the writers' editors then send.
      - alert: HubtaskDocumentLogNotCompacted
        expr: sum(rate(hubtask_realtime_document_backlog_total[15m])) > 0
        for: 30m
        labels:
          severity: ticket
          alert_id: A-24
        annotations:
          summary: "A live document's log is not compacted"
          description: >
            Updates keep landing on a live document whose log is far past its snapshot, or are
            refused at its ceiling. Opening the document gets slower; past the ceiling its writers
            wait for a snapshot before their words are stored.
          runbook: RB-A24-document-log-not-compacted.md

      # A-25. A transaction has stayed open for two hours: vacuum keeps every row version it might
      # still read, so the busy tables and their indexes grow until it ends. Usually a backup's or a
      # workspace export's snapshot of a large workspace (backup-restore.md §5), sometimes a session
      # left open by hand. Nothing is lost; queries slow down as the tables bloat. max() reads the
      # one leader's series.
      - alert: HubtaskLongTransaction
        expr: max(hubtask_db_oldest_transaction_seconds) > 7200
        for: 10m
        labels:
          severity: ticket
          alert_id: A-25
        annotations:
          summary: "A database transaction has been open for over two hours"
          description: >
            Vacuum cannot reclaim rows changed since the oldest open transaction began, so tables
            and indexes grow while it stays open. Find it in pg_stat_activity; a backup or export
            of a large workspace is the usual one.
          runbook: RB-A25-long-transaction.md

      # A-26. Live connections are refused at a workspace's or a pod's cap (HUBTASK_STREAM_PER_*):
      # the server is fine, but the refused clients get no live updates and fall back to pulling
      # the changes at a slowing interval. A client over its own cap is its loop, not capacity, and
      # is left out.
      - alert: HubtaskStreamCapacityReached
        expr: sum(increase(hubtask_stream_refused_total{reason=~"tenant|process"}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          alert_id: A-26
        annotations:
          summary: "Live connections are refused at the stream cap"
          description: >
            A workspace or a pod holds as many live connections as allowed, so new ones are
            refused and those clients work without live updates. Raise HUBTASK_STREAM_PER_TENANT
            or HUBTASK_STREAM_PER_PROCESS, or add a replica.
          runbook: RB-A26-stream-capacity-reached.md

      # A-27. A data kind's retention passes ran this week and none has completed for two days:
      # the per-workspace sweep (hourly by default) stopped, so data stays past its period. The
      # run histogram is written on a completed pass only, zero rows included. A kind with no
      # pass in the week (never installed, or switched off long ago) has nothing to compare and
      # stays quiet; one switched off within the week fires until it ages out.
      - alert: HubtaskRetentionStalled
        expr: |
          sum by (data_kind) (increase(hubtask_retention_run_duration_seconds_count[7d])) > 0
          unless on (data_kind)
          sum by (data_kind) (increase(hubtask_retention_run_duration_seconds_count[48h])) > 0
        for: 1h
        labels:
          severity: ticket
          alert_id: A-27
        annotations:
          summary: "No retention pass of {{ $labels.data_kind }} has completed in 48 hours"
          description: >
            The retention sweep ran this week and has stopped: data of this kind stays past its
            period. Look for dead letters of retention.sweep and for a scheduler that does not
            run.
          runbook: RB-A27-retention-stalled.md

      # A-28. An index has been invalid for an hour: a CREATE INDEX CONCURRENTLY was interrupted
      # and the migrator did not rebuild it (one no migration builds, or a build that fails again).
      # Every write still maintains it and no query uses it; a unique one enforces nothing. The hour
      # lets a concurrent build in progress, which is invalid until it ends, finish. max() reads the
      # one leader's series.
      - alert: HubtaskInvalidIndex
        expr: max(hubtask_db_invalid_indexes) > 0
        for: 1h
        labels:
          severity: ticket
          alert_id: A-28
        annotations:
          summary: "An index of the database has been invalid for an hour"
          description: >
            An interrupted concurrent index build left an index that queries do not use and that,
            if unique, does not enforce its uniqueness. Find it in pg_index and build it again.
          runbook: RB-A28-invalid-index.md

      # A-29. At least half of the mailboxes on one of the installation's own mail apps
      # (HUBTASK_MAIL_OAUTH_*) have failed for over an hour - across workspaces, so the app itself
      # is the likely cause: its client secret ran out or was withdrawn. Each workspace's
      # administrators are told of their own mailbox and cannot fix it; the operator can. The
      # mailbox's own hour of grace is already in the gauge; the 15 minutes ride out one tick.
      - alert: HubtaskMailAppFailing
        expr: |
          max by (app) (hubtask_mail_app_mailboxes_failing) >= 1
          and on (app)
          max by (app) (hubtask_mail_app_mailboxes_failing) * 2 >= max by (app) (hubtask_mail_app_mailboxes)
        for: 15m
        labels:
          severity: ticket
          alert_id: A-29
        annotations:
          summary: "Most mailboxes on the installation's {{ $labels.app }} mail app fail"
          description: >
            At least half of the mailboxes that sign in through the installation's own
            {{ $labels.app }} app have failed for over an hour. Check the app's client secret at
            the provider and in HUBTASK_MAIL_OAUTH_*.
          runbook: RB-A29-mail-app-failing.md

      # A-31. More than one in twenty notification sends failed over a quarter of an hour, with at
      # least five failures so that one bounced address on a quiet installation stays silent. A
      # failure the breaker does not see - a refusal per recipient, a template the channel rejects -
      # raises only the counter; the person waiting for the mail notices nothing.
      - alert: HubtaskNotificationsFailing
        expr: |
          sum(increase(hubtask_notification_failures_total[15m])) >= 5
          and
          sum(rate(hubtask_notification_failures_total[15m]))
            / (sum(rate(hubtask_notification_failures_total[15m]))
               + (sum(rate(hubtask_notification_send_duration_seconds_count[15m])) or vector(0)))
            > 0.05
        for: 15m
        labels:
          severity: ticket
          alert_id: A-31
        annotations:
          summary: "Notifications are failing to send"
          description: "More than 5% of notification sends failed over 15 minutes. hubtask_notification_failures_total names the channel and the reason."
          runbook: RB-A31-notifications-failing.md

      # A-32. An occurrence of a recurring entry was created more than an hour after the moment it
      # is for. A rolling window creates them ahead, so a late one means the scheduler stopped and
      # came back, or the materialising job is failing; A-30 catches the stop while it lasts.
      - alert: HubtaskRecurrenceLate
        expr: |
          sum(increase(hubtask_recurrence_occurrence_lag_seconds_count[1h]))
            - sum(increase(hubtask_recurrence_occurrence_lag_seconds_bucket{le="3600"}[1h]))
            > 0
        labels:
          severity: ticket
          alert_id: A-32
        annotations:
          summary: "Recurring entries were created more than an hour late"
          description: "At least one occurrence of a recurrence arrived over an hour after its moment in the last hour."
          runbook: RB-A32-recurrence-late.md

      # A-33. Statements that fail by timeout, by a lost connection or for no known reason, at more
      # than one every ten seconds for a quarter of an hour. Serialisation failures are retried and
      # constraint violations are answers, so neither counts.
      - alert: HubtaskDatabaseErrors
        expr: |
          sum by (kind) (rate(hubtask_db_errors_total{kind=~"timeout|connection|other"}[10m])) > 0.1
        for: 15m
        labels:
          severity: ticket
          alert_id: A-33
        annotations:
          summary: "Database statements are failing ({{ $labels.kind }})"
          description: "More than one statement every ten seconds fails with {{ $labels.kind }} for 15 minutes."
          runbook: RB-A33-database-errors.md

      # A-34. Audit entries past their period lie in the trail's default partition, which no
      # partition drop reaches: the retention promise is broken for them until an operator moves
      # them out. Six hours lets the leader's own partition maintenance run first. The months a
      # legal hold keeps whole (hubtask_audit_partitions_held) are the hold working, not a fault,
      # and raise nothing.
      - alert: HubtaskAuditDefaultPartitionAged
        expr: max(hubtask_audit_default_partition_aged_rows) > 0
        for: 6h
        labels:
          severity: ticket
          alert_id: A-34
        annotations:
          summary: "Audit entries past their period are stuck in the default partition"
          description: "No partition drop reaches them; move them into their monthly partitions so retention can remove them."
          runbook: RB-A34-audit-default-partition.md

      # A-35. A durable timer's firing failed and was put back: the pass fires each timer under its
      # own savepoint, so one bad row degrades only itself, but that SLA breach, OLA, approval
      # reminder or page review is not happening while it keeps failing. Retried with a delay
      # doubling up to six hours; a failure that stays is a defect or a row to repair.
      - alert: HubtaskTimerFailing
        expr: sum by (purpose) (increase(hubtask_timer_failures_total[1h])) > 0
        for: 0m
        labels:
          severity: ticket
          alert_id: A-35
        annotations:
          summary: "Durable timers of purpose {{ $labels.purpose }} fail to fire"
          description: "Each failing timer is put back with a growing delay while the others fire. The worker's log names the timer and the failure's code."
          runbook: RB-A35-timer-failing.md

      # A-36. Half of PostgreSQL's NOTIFY queue is in use: a session that LISTENs stopped reading,
      # and the queue keeps every notification until the slowest listener has read it. Once it is
      # full, every transaction that notifies fails at commit - every write to an entry among them.
      # Paged, because the step from half to full can take minutes under the live updates' traffic.
      - alert: HubtaskNotifyQueueFilling
        expr: max(hubtask_db_notify_queue_usage_ratio) > 0.5
        for: 2m
        labels:
          severity: page
          alert_id: A-36
        annotations:
          summary: "PostgreSQL's NOTIFY queue is more than half full"
          description: "A listening session stopped reading. When the queue is full, every write that notifies fails. Find and end the stuck listener."
          runbook: RB-A36-notify-queue-filling.md

      # A-37. Vacuum has not frozen the database for more than a billion transaction IDs. At about
      # two billion PostgreSQL stops accepting writes until a vacuum has run, which on a large
      # database takes hours; half-way leaves the time to find what holds vacuum back.
      - alert: HubtaskTransactionIdAgeHigh
        expr: max(hubtask_db_frozen_xid_age) > 1000000000
        for: 30m
        labels:
          severity: ticket
          alert_id: A-37
        annotations:
          summary: "The database's transaction-ID age is past one billion"
          description: "Vacuum is not freezing old rows. Near two billion PostgreSQL refuses writes; find what holds vacuum back before then."
          runbook: RB-A37-transaction-id-age.md

