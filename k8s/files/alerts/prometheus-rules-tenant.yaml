#
# The multi-tenant operator's additions (observability-reliability.md §10, H-08).
#
# A separate file, deliberately: the self-hosting set next door is pinned to the rule "doing
# nothing loses data", and a capacity-planning signal does not meet it - a workspace approaching
# a quota loses nothing yet, which is exactly why the alert exists. A provider adds this file
# beside the other; a self-hoster who configures no quotas never sees a series for it to fire on.
#
# Every rule carries a `runbook` annotation naming a file under deploy/observability/runbooks/,
# the same gate as the self-hosting set (test/observability, both directions).
groups:
  - name: hubtask-tenant
    rules:
      - alert: HubtaskTenantQuotaApproaching
        # A-18. The gauge is used/limit per quota, recorded at every enforcement check (H-08);
        # 90% for a quarter hour is a workspace that will hit the wall on a normal afternoon,
        # early enough that raising the ceiling is a decision rather than an incident. Without
        # the tenant label the series says "somebody stands at 90%" - which is the alarm - and
        # the who is one HUBTASK_METRICS_TENANT_LABEL=true away.
        expr: max by (quota) (hubtask_tenant_quota_usage_ratio) > 0.9
        for: 15m
        labels:
          severity: info
          alert_id: A-18
        annotations:
          summary: "A workspace stands at {{ $value | humanizePercentage }} of its {{ $labels.quota }} quota"
          description: "hubtask_tenant_quota_usage_ratio is above 0.9; capacity planning, not an outage."
          runbook: RB-A18-quota-approaching.md
