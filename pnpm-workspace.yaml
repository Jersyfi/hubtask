# The workspace of ADR-0027: two first-party clients, the packages they share, and the TypeScript
# SDK - a member so that the Node lane checks it, and an island on the map (project-structure.md
# §2.1): it depends on nothing here and nothing here depends on it. Nothing in the workspace is
# importable from Go, and nothing under packages/ may depend on anything under apps/.
packages:
  - apps/*
  - packages/*
  - sdk/typescript

# `devalue` below 5.9.3 carries six advisories against `uneval` and `stringify` (quadratic
# expansion, sparse-array amplification, a __proto__ bypass). SvelteKit 3 asks for the fixed
# release itself, but svelte asks for ^5.9.2 and so still admits one that is not fixed; the bound
# keeps the lock on the fixed one whatever resolves it. `brace-expansion` below 2.1.7
# carries three denials of service and reaches the tree through minimatch 5 under
# openapi-typescript, a build-time tool of the API client. Both bounds stay inside the major the
# dependent asks for.
overrides:
  devalue@<5.9.3: ^5.9.4
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
