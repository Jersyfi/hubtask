# Secret scanning, gate SG-7 (security.md §4, threat T-13).
#
# The default rule set stays in force; this file only records exceptions, and each one names what
# it is and why it is not a secret. An allowlist entry is a claim someone has to be able to check
# in review - so it is a value, never a path or a file pattern. Allowlisting "every test file"
# would be the end of the gate, because a leaked credential pasted into a test is a leaked
# credential.

[extend]
useDefault = true

[allowlist]
description = "Known test fixtures that look like credentials"
regexes = [
  # A configuration fixture from infrastructure/environment/EnvConfig_test.go. It was a literal
  # until commit da70edc replaced it with an assembled value; the scan reads the history, so the
  # entry stays for as long as the commit does.
  '''0123456789abcdef0123456789abcdef''',
  # The digits of a rank key, core/domain/service/Ordering.go. Base 62 in ASCII order is what
  # makes two keys comparable as strings; to an entropy check it reads like a generated token,
  # because it contains every character one would be built from.
  '''0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz''',
  # Throwaway values from scripts/compose-smoke.sh, which starts the reference stack for the
  # length of one CI job. They were literals until the script was changed to draw both from
  # /dev/urandom; the scan reads the history, so the entries stay for as long as the commits do.
  '''compose-smoke-key-long-enough-for-32''',
  '''compose-smoke-not-a-secret''',
  # The key ring of the load suite's installation, test/load/stack_test.go. It lives for the
  # two minutes a run takes, seals a webhook signing secret nothing outside that run ever sees,
  # and is a literal so that the same run produces the same bytes twice - which is the whole
  # point of a dataset a baseline is measured over.
  '''bG9hZC10ZXN0LWtleS0zMi1ieXRlcy1sb25nLWFiY2Q=''',
]
