# The development database. Not the deployment file - that is compose.yaml.
#
# Deliberately without the application: `make db-up` starts what a test or a locally running
# server needs, nothing more.
name: hubtask-dev

services:
  postgres:
    # pgvector, for the reason deploy/docker/compose.yaml gives (ADR-0050).
    image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    # As compose.yaml: parallel workers outgrow the default 64 MB /dev/shm.
    shm_size: 256mb
    environment:
      POSTGRES_USER: hubtask
      POSTGRES_PASSWORD: hubtask-dev
      POSTGRES_DB: hubtask
      # Faster startup for a database whose data nobody mourns.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    healthcheck:
      # -h for the reason compose.yaml gives: without it the probe answers from the socket
      # that initdb's temporary server listens on, before anything answers over the network.
      test: ["CMD-SHELL", "pg_isready -U hubtask -d hubtask -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
