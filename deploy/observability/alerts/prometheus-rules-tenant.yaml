#
# The multi-tenant operator's additions (observability-reliability.md §10).
#
# A separate file, deliberately: the self-hosting set next door is pinned to the rule "doing
# nothing loses data", and a capacity-planning signal does not meet it - a workspace approaching
# a quota loses nothing yet, which is exactly why the alert exists. A provider adds this file
# beside the other; a self-hoster who configures no quotas never sees a series for it to fire on.
#
# Every rule carries a `runbook` annotation naming a file under deploy/observability/runbooks/,
# the same gate as the self-hosting set (test/observability, both directions).
groups:
  - name: hubtask-tenant
    rules:
      - alert: HubtaskTenantQuotaApproaching
        # A-18. The scheduler leader counts every workspace's standing every five minutes;
        # one at 90% or more of a quota for a quarter hour will hit the wall on a normal
        # afternoon, early enough that raising the ceiling is a decision rather than an
        # incident. Not the guard's own ratio: that is written on a create and carries whichever
        # workspace created last, so a busy neighbour hides the one near its wall.
        expr: max by (quota) (hubtask_tenant_quota_workspaces{band="approaching"}) > 0
        for: 15m
        labels:
          severity: info
          alert_id: A-18
        annotations:
          summary: "{{ $value }} workspaces stand at 90% or more of their {{ $labels.quota }} quota"
          description: "hubtask_tenant_quota_workspaces{band=approaching} is above 0; capacity planning, not an outage."
          runbook: RB-A18-quota-approaching.md
