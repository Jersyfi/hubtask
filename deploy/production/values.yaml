# Helm values for the production environment (deployment.md §3.2, ADR-0046).
#
# The image tag is deliberately absent: the release sets it from the tag, so this file never has
# to be touched to deploy. Everything else is the environment's shape, and it is small on purpose —
# an environment that overrides half the chart stops testing the chart.
#
# Sized against the namespace's ResourceQuota rather than against the chart's defaults, which
# assume a cluster with room. The arithmetic is in README.md, because a number nobody can
# reconstruct is a number nobody dares change.

roles:
  # Two, so a rolling update has somewhere to send traffic. Smaller than the chart's default
  # request: this installation serves one workspace, and the quota is shared with the database.
  api:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits:   { memory: 768Mi }
  # One. The bulkhead is what matters (ADR-0016) and a bulkhead exists at one replica.
  worker:
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits:   { memory: 768Mi }
  # Two, one of them a standby. The leader lock matters more here than in integration, not less:
  # a scheduler that is gone is reminders that do not fire (ADR-0008).
  scheduler:
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { memory: 256Mi }
  automation:
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits:   { memory: 512Mi }

config:
  tenancyMode: multi
  baseUrl: https://hubtask.prho.cloud
  logFormat: json
  logLevel: info
  extraEnv:
    # Exactly the origin the browser will send: the chart refuses a bare host name rather than
    # silently matching nothing (security.md §9).
    HUBTASK_CORS_ALLOWED_ORIGINS: https://hubtask.prho.cloud
    # The parts of SMTP that are not secret. The password is a key in existingSecret below.
    HUBTASK_SMTP_FROM: noreply@hubtask.eu
    # HUBTASK_SMTP_HOST / _PORT / _USER: the relay is not chosen yet (README, unknown 7).

# Created by the owner, referenced by name — the platform's rule and ours.
# Keys: db-dsn, secret-key, smtp-password.
existingSecret: hubtask-secrets

migration:
  # CloudNativePG manages the database roles, so the migrator does not hand out a login (A-11).
  dsnSecretKey: db-dsn-owner

ingress:
  enabled: true
  className: traefik
  host: hubtask.prho.cloud
  annotations:
    # The issuer's name is the platform's (README, unknown 3).
    cert-manager.io/cluster-issuer: PLATFORM_CLUSTER_ISSUER
  tls:
    enabled: true

serviceMonitor:
  # The platform's operator scrapes this namespace; the rules are ours and its stack evaluates
  # them. The labels are what its serviceMonitorSelector looks for (README, unknown 1).
  enabled: true
  interval: 30s
  labels: {}

storage:
  kind: s3
  existingSecret: hubtask-media-s3    # keys: access-key, secret-key (README, unknown 4)
  bucket: PLATFORM_MEDIA_BUCKET
  endpoint: PLATFORM_S3_ENDPOINT
  region: eu-central-1

networkPolicy:
  enabled: true
  # Left at the default. Narrowing it needs to know which namespaces Traefik and the scraper live
  # in, and a rule written for one of two callers is a rule that breaks when the other arrives.
  ingressFrom: []
  # Egress is not default-deny on this cluster and SMTP, S3 and webhooks need no exception; the
  # link-local exclusion is in the template rather than in this list.
  allowedEgressCIDRs: []
