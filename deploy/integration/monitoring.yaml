# The integration environment's own monitoring (observability-reliability.md §14, O-1).
#
# Prometheus scrapes the operations port of every hubtask pod, evaluates the alert rules this
# repository ships, and hands what fires to Alertmanager. Alertmanager delivers by SMTP into a
# mail catcher in the same namespace, whose HTTP API is where a maintaining session reads what
# arrived - the environment is watched by whoever is working on it, and a page nobody can read is
# not a page.
#
# Three properties this file exists to hold:
#
#   1. The rules that run here are the rules the repository ships, byte for byte. bootstrap.sh
#      builds the rules ConfigMap from deploy/observability/alerts/, so `promtool test rules` in
#      the gate and the evaluation on this cluster read the same three files. A rule that fires
#      here is one somebody can find.
#   2. Prometheus is pinned to the version the gate checks with (Makefile, PROMTOOL_VERSION).
#      "It parses in CI" and "it evaluates on the cluster" are then the same statement.
#   3. Delivery is SMTP, the receiver a real provider would use, and the smarthost is the only
#      part that is local. Pointing it at a real mail server later is an address and a credential
#      in the Secret below - not a redesign of the routing.
#
# Nothing here is reachable from outside the node: no Ingress, and the services are ClusterIP. The
# way in is the kubeconfig, which is what makes this environment's monitoring a thing you look at
# on purpose rather than a second public surface to defend.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: hubtask-integration
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Discovery is namespaced on purpose: Prometheus is told to look in `hubtask` and nowhere else, so
# a Role suffices and there is no ClusterRole granting a scraper sight of the whole cluster. The
# deploy identity next door is namespace-bound for the same reason (deploy/integration/README.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: hubtask
rules:
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list, watch]
  # EndpointSlices rather than Endpoints: the core/v1 object is deprecated from 1.33 and the
  # cluster says so in Prometheus's log on every discovery refresh. This is the API that replaces
  # it, and it lives in its own group.
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: hubtask
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      # Every alert carries where it came from. One environment today; the label is what keeps a
      # second one from arriving as an indistinguishable page.
      external_labels:
        environment: integration

    rule_files:
      # What the repository ships, built from deploy/observability/alerts by bootstrap.sh.
      - /etc/prometheus/rules/*.yaml
      # And what belongs to this environment rather than to the product: the watchdog and the
      # scrape check below. They carry no alert_id, because the catalogue in §10 is the product's
      # and this is the cluster watching itself.
      - /etc/prometheus/rules-environment/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      # The headless metrics service spans every role, which is the point: the queue depth, the
      # outbox lag and the dead letter counters live in the worker and the scheduler, not in the
      # API (k8s/templates/service.yaml).
      - job_name: hubtask
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names: [hubtask]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
            action: keep
            regex: hubtask-metrics;ops
          # The pod, not the endpoint address: an alert that names 10.42.0.17 names something that
          # will not exist by the time anybody reads it.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: role

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager:9093"]
---
# The environment's own two rules. Neither is in the catalogue and neither has an alert_id: §10 is
# the product's catalogue, shipped to operators, and these two watch this cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules-environment
  namespace: monitoring
data:
  environment.yaml: |
    groups:
      - name: environment
        interval: 30s
        rules:
          # The dead man's switch. It fires always and on purpose: an alerting path is only known
          # to work while something is coming out of the far end, and every other alert here is
          # evidence of nothing until this one has arrived. A mail every twelve hours is what
          # "the pipeline is alive" looks like; its absence is the failure this rule detects, and
          # no rule can detect that from the inside.
          - alert: HubtaskAlertingPathAlive
            expr: vector(1)
            labels:
              severity: watchdog
            annotations:
              summary: "The alerting path is alive - Prometheus evaluated, Alertmanager routed, this arrived"
              description: >
                This alert always fires. What it proves is delivery: if it stops arriving, the
                path from evaluation to mailbox is broken, and every silence from every other
                alert means nothing until it is back.

          # A target that stopped answering. Not the catalogue's A-03, which is the application
          # saying a dependency is down - this is nobody saying anything, which is the failure
          # that hides every other one.
          - alert: HubtaskTargetDown
            expr: up{job="hubtask"} == 0
            for: 10m
            labels:
              severity: ticket
            annotations:
              summary: "The {{ $labels.role }} pod {{ $labels.instance }} has not been scrapeable for 10 minutes"
              description: >
                Its operations port is refusing or timing out. Everything this pod reports is
                stale, and an alert that reads its metrics cannot fire while it is gone.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  # A single writer to one volume: the old pod must be gone before the new one starts, or two
  # Prometheus processes open the same TSDB and the second one refuses.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # A rules change is a ConfigMap change, and a ConfigMap change alone restarts nothing.
        # bootstrap.sh stamps this with the rules' own checksum, so applying new rules rolls the
        # pod that has to read them.
        hubtask.eu/rules-checksum: "unset"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          # Pinned to the Makefile's PROMTOOL_VERSION: the gate checks the rules with exactly the
          # version that evaluates them here.
          image: prom/prometheus:v3.6.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Long enough that the 30-day windows SLO-1 to SLO-3 are written against have data
            # behind them, and short enough for a node with one disk.
            - --storage.tsdb.retention.time=45d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: rules-environment
              mountPath: /etc/prometheus/rules-environment
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: rules-environment
          configMap:
            name: prometheus-rules-environment
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    app: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      # The smarthost is the only local part of this configuration. A real mail server takes its
      # place with an address and a credential; the routing below does not change.
      smtp_smarthost: "mailpit:1025"
      smtp_from: "alertmanager@integration.hubtask.eu"
      smtp_require_tls: false

    route:
      # Grouped by what the catalogue calls the alert, not by instance: three pods failing the
      # same way is one incident, and three mails about it is how a real page gets ignored.
      group_by: [alertname, alert_id]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ticket
      routes:
        # First, because it matches nothing else and must never be grouped with a real incident.
        - matchers: ['severity="watchdog"']
          receiver: watchdog
          group_wait: 0s
          repeat_interval: 12h
        # A-12 is true here, and deliberately so: this environment keeps no backups, and the rule
        # fires on the *absent* series precisely so that "nobody configured one" is loud rather
        # than silent. What is a finding on a real installation is a written decision on a
        # throwaway one (deploy/integration/README.md, "What is not here, and why"), so it is
        # routed to a receiver that sends nothing. Not a silence: a silence expires, and this
        # decision does not - and a route is in the diff where somebody can argue with it.
        - matchers: ['alert_id="A-12"']
          receiver: muted
        - matchers: ['severity="page"']
          receiver: page
          # A page waits for nothing and repeats until somebody acts.
          group_wait: 0s
          repeat_interval: 1h
        - matchers: ['severity="info"']
          receiver: info
          repeat_interval: 24h

    inhibit_rules:
      # An installation whose database is gone (A-03) produces every symptom at once. The page for
      # the cause silences the tickets for the consequences, within the same environment.
      - source_matchers: ['alert_id="A-03"']
        target_matchers: ['severity=~"ticket|info"']
        equal: [environment]

    receivers:
      # Three mailboxes rather than one, so severity is visible before anything is opened. The
      # addresses are local to the catcher: nothing leaves the node.
      - name: page
        email_configs:
          - to: "page@integration.hubtask.eu"
            send_resolved: true
      - name: ticket
        email_configs:
          - to: "ticket@integration.hubtask.eu"
            send_resolved: true
      - name: info
        email_configs:
          - to: "info@integration.hubtask.eu"
            send_resolved: false
      # Sends nothing, on purpose. See the A-12 route above.
      - name: muted
      # Its own mailbox, so that "is the path alive" is one query and never competes with a page.
      - name: watchdog
        email_configs:
          - to: "watchdog@integration.hubtask.eu"
            send_resolved: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: http
  selector:
    app: alertmanager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# The delivered mail, kept where a session can read it: GET /api/v1/messages lists what arrived,
# with the alert's own summary as the subject. It is a catcher and not a relay - it accepts on
# 1025 and forwards to nobody, which is the property that makes it safe to point alerts at an
# address that does not exist anywhere else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.0
          env:
            - name: MP_DATABASE
              value: /data/mailpit.db
            # A ceiling rather than a cleanup job: the catcher holds the last thousand alerts and
            # forgets the rest by itself.
            - name: MP_MAX_MESSAGES
              value: "1000"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8025
            - name: smtp
              containerPort: 1025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailpit-data
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8025
      targetPort: http
    - name: smtp
      port: 1025
      targetPort: smtp
  selector:
    app: mailpit
