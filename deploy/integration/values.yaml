# Helm values for the integration environment (deployment.md §3.1).
#
# The image tag is deliberately absent: CI sets it per commit with `--set image.tag=...`, so this
# file never has to be touched to deploy, and a deploy is never a file edit somebody forgot to
# push. Everything else here is the environment's shape, and it is small on purpose — an
# environment that overrides half the chart stops testing the chart.

roles:
  # Two API replicas, because that is the whole point of the environment: RT-8 asks whether a
  # rolling update stays quiet, and there is nothing to answer with one replica.
  api:
    replicas: 2
  # Two schedulers, one of them a standby. The leader lock is the thing under test here, not
  # throughput (ADR-0008).
  scheduler:
    replicas: 2
  # One each. The bulkhead is what matters (ADR-0016) and a bulkhead exists at one replica; a
  # second would only spend the node's memory on load nobody is generating.
  worker:
    replicas: 1
  automation:
    replicas: 1

config:
  # Provider-shaped, because that is the operating profile the chart is for
  # (observability-reliability.md §13). Self-hosting is what the Compose stack covers.
  tenancyMode: multi
  baseUrl: https://api.integration.hubtask.eu
  logFormat: json
  logLevel: info
  # The hosts the application may call out to over HTTP - webhooks, HTTP actions, backup
  # targets, an identity provider. Mandatory in provider operation (T-07), and an empty list
  # means "anywhere public", which is the posture production must not run with. The one name
  # here is the target the e2e walk subscribes to (scripts/hubctl-e2e.sh): it never resolves,
  # by RFC 2606, and that is the truth of this environment - nothing leaves it. The day a walk
  # needs a receiver that answers, its host goes on this list, which is what the list is for.
  # The second is the AI model the installation offers its workspaces (Claude, through its
  # OpenAI-compatible endpoint).
  egressAllowedHosts:
    - webhook.invalid
    - api.anthropic.com
  extraEnv:
    # The application's mail path (smtp.yaml): a catcher in this namespace, reached by the name
    # its certificate carries, on production's port, with the default - STARTTLS - security.
    # No credentials: the catcher authenticates nobody, and the adapter sends AUTH only when a
    # user is configured. What is exercised is what reminders need - the connection, the
    # STARTTLS upgrade, the envelope - and what production's relay adds is a password.
    # The offered model's processor is in the United States. Integration's data is nobody's, so
    # the installation confirms such transfers here; production decides that for itself.
    HUBTASK_AI_ALLOW_THIRD_COUNTRY_TRANSFER: "true"
    HUBTASK_SMTP_HOST: smtp.hubtask.svc
    HUBTASK_SMTP_FROM: noreply@integration.hubtask.eu
    # Go's own knob for a second trust directory. The default bundle stays - SSL_CERT_DIR replaces
    # the directory list, not the file list - so public certificates verify as before and the
    # cluster's mail authority verifies beside them. It is the process-wide trust store: a
    # webhook target presenting a certificate from this authority would be trusted too, which is
    # the same statement an operator makes when they add an internal authority in production.
    SSL_CERT_DIR: /etc/hubtask/mail-ca

# The names are in bootstrap.sh, and the values were generated on the host and never left it.
existingSecret: hubtask-secrets

# One master key, generated by bootstrap.sh into hubtask-secrets as `encryption-key-k1`.
encryption:
  keys: [k1]

# The database in production's shape (ADR-0082): a CloudNativePG Cluster of one instance, its WAL
# archive and daily base backup in an object-store bucket, smaller in size and the same in shape.
database:
  enabled: true
  name: hubtask-db
  instances: 1
  appRole:
    enabled: true
    name: hubtask_app
    # Created by bootstrap.sh; the same password is the one in hubtask-secrets' db-dsn.
    passwordSecret: hubtask-app-role
  storage:
    # The live database and the drill's temporary cluster both fit, on a node of 75 GB.
    size: 4Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }
  metrics:
    # No Prometheus Operator here: monitoring.yaml scrapes the instance's port by its pods.
    serviceMonitor: false
  backup:
    enabled: true
    # The bucket is the access holder's to create, with Object Lock where the store offers it
    # (README, "Rebuilding the database"). Its name and endpoint are configuration; its keys are
    # the Secret bootstrap.sh makes from the holder's environment.
    destinationPath: s3://hubtask-integration-wal/
    endpointURL: https://nbg1.your-objectstorage.com
    existingSecret: hubtask-wal

migration:
  # The owner runs the migrations, out of the Secret the operator generates; the application
  # never gets this DSN (multi-tenancy.md §2.1).
  dsnSecretName: hubtask-db-app
  dsnSecretKey: uri

# RT-9 where the data is, as production runs it - but by its schedule alone. Integration releases on
# every push to main, and a drill of up to three quarters of an hour after each would hold or time
# out every deploy (CP-07's D1). Daily, before anybody works.
restoreDrill:
  enabled: true
  afterRelease: false
  schedule: "30 4 * * *"
  # The Role is bootstrap.sh's (restore-drill-rbac.yaml): the deploy identity creates no RBAC.
  rbac:
    create: false

ingress:
  enabled: true
  className: traefik
  host: api.integration.hubtask.eu
  # The workspaces of this environment: `operations`, whose owner is the installation's operator and
  # the only account that reaches the instance area, and `demo`, the one a walk signs in to. In
  # multi-tenant operation a workspace is reached by its own subdomain, so the bare host above
  # answers no workspace at all - it is the installation's name, not anybody's. A wildcard entry is
  # not an option here: cert-manager issues over HTTP-01, which cannot do wildcards, so each name is
  # named. The DNS record for `*.api.integration` already points at this node.
  extraHosts:
    - operations.api.integration.hubtask.eu
    - demo.api.integration.hubtask.eu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect to HTTPS (https-redirect.yaml, bootstrap's). Only this
    # route: the certificate's HTTP-01 challenge has an ingress of its own and stays on port 80.
    traefik.ingress.kubernetes.io/router.middlewares: hubtask-https-redirect@kubernetescrd
  tls:
    enabled: true

storage:
  # A volume on the node rather than S3: there is no object storage here to point at, and standing
  # one up would be testing the object store. The claim is created by bootstrap.sh.
  kind: local
  persistence:
    enabled: true
    existingClaim: hubtask-media

# The mail authority's certificate, and nothing else out of that secret: the key stays with
# cert-manager. The directory is what SSL_CERT_DIR above names.
extraVolumes:
  - name: mail-ca
    secret:
      secretName: smtp-ca
      items:
        - key: ca.crt
          path: ca.crt
extraVolumeMounts:
  - name: mail-ca
    mountPath: /etc/hubtask/mail-ca
    readOnly: true

networkPolicy:
  enabled: true
  # Left at the default (from anywhere the cluster allows) and not narrowed to Traefik's
  # namespace: the second consumer, the metrics scraper, does not exist here yet, and a rule
  # written for one of two callers is a rule that breaks when the other arrives.
  ingressFrom: []
  # Also the default, and the same as production's reference: egress is bounded by name in
  # config.egressAllowedHosts above, not by address here, and a list of ranges written for a
  # cluster whose addresses nobody chose is a list that breaks on the next rebuild. Link-local
  # stays excluded either way — that exclusion is in the template, not in this list.
  allowedEgressCIDRs: []
